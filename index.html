    <div class="ctrl-group">
      <label>試験管の内容液:</label>
      <select id="tubeSelect" class="search-input" style="padding:6px;">
        <option value="saliva">デンプン溶液 ＋ だ液 (分解あり)</option>
        <option value="water">デンプン溶液 ＋ 水 (対照実験・分解なし)</option>
      </select>
    </div>
    <div class="ctrl-group">

      </div>

  `;

  document.getElementById('bBenedict').onclick = () => { reagent='benedict'; heated=true; updateView(); };

  function updateView() {
    if (reagent === 'iodine') {
      if (hasSaliva) setStatus("【だ液あり＋ヨウ素液】だ液アミラーゼによってデンプンが分解されたため、青紫色への変色は起こりません。");
      else setStatus("【水＋ヨウ素液】デンプンがそのまま残っているため、鮮やかな青紫色に変色しました！");
    } else {
      if (hasSaliva) setStatus("【だ液あり＋ベネジクト液加熱】デンプンが麦芽糖などに分解されたため、赤褐色（黄褐色）の沈殿が生じました！");
      else setStatus("【水＋ベネジクト液加熱】糖が生じていないため、青色のままで変化しません。");
    }
  }

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const tx = w/2 - 30, ty = h/2 - 70, tw = 60, th = 140;
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 4;
    ctx.strokeRect(tx, ty, tw, th);

    let liquidColor = "rgba(226,232,240,0.5)";
    if (reagent === 'iodine') {
      liquidColor = hasSaliva ? "#fef08a" : "#1e1b4b";
    } else if (reagent === 'benedict') {
      liquidColor = hasSaliva ? "#b45309" : "#0284c7";
    }
    ctx.fillStyle = liquidColor;
    ctx.fillRect(tx+2, ty+th/2, tw-4, th/2-2);

    animId = requestAnimationFrame(render);
  }
  render();

  return { destroy: () => cancelAnimationFrame(animId) };
}

// 電流と磁界 (中2・エネルギー)
function initC2Magnet(canvas) {

  controls.innerHTML = `
    <div class="ctrl-group">

      <button class="btn-action secondary" id="bPole">磁石を反転 (${nOnTop?'上がN極':'上がS極'})</button>
    </div>
  `;

  document.getElementById('bCurrent').onclick = () => {
    currentDir *= -1;
    document.getElementById('bCurrent').textContent = `電流を反転 (${currentDir>0?'手前→奥':'奥→手前'})`;
    updateStatus();
  };
  document.getElementById('bPole').onclick = () => {

    document.getElementById('bPole').textContent = `磁石を反転 (${nOnTop?'上がN極':'上がS極'})`;
    updateStatus();
  };

  function updateStatus() {
    const force = currentDir * (nOnTop ? 1 : -1);
    setStatus(`【フレミングの左手の法則】導線ブランコに【${force>0?'右向き':'左向き'}】の力が働き、大きく振れました！`);
  }

  function render() {
    const force = currentDir * (nOnTop ? 1 : -1);
    const swingX = force * 45;

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2;

    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 30, cy - 80);
    ctx.lineTo(cx + swingX, cy);
    ctx.lineTo(cx + 30, cy - 80);
    ctx.stroke();

    animId = requestAnimationFrame(render);
  }
  render();

  return { destroy: () => cancelAnimationFrame(animId) };
}

// 前線と天気の変化 (中2・地球)
function initC2Front(canvas) {
  const ctx = canvas.getContext('2d');
  let type = "cold";
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; gap:10px;">
      <button class="btn-action ${type==='cold'?'':'secondary'}" id="bCold">寒冷前線 (寒気が暖気を急激に押し上げる)</button>
      <button class="btn-action ${type==='warm'?'':'secondary'}" id="bWarm">温暖前線 (暖気が寒気の上に這い上がる)</button>
    </div>
  `;

  document.getElementById('bCold').onclick = () => { type='cold'; updateBtns(); };
  document.getElementById('bWarm').onclick = () => { type='warm'; updateBtns(); };

  function updateBtns() {
    document.getElementById('bCold').className = `btn-action ${type==='cold'?'':'secondary'}`;
    document.getElementById('bWarm').className = `btn-action ${type==='warm'?'':'secondary'}`;
    if (type==='cold') {
      setStatus("【寒冷前線】寒気が暖気の下に潜り込み急激に押し上げます。積乱雲が発達し、狭い範囲に短時間の強い雨を降らせます。通過後は気温が下がります。");
    } else {
      setStatus("【温暖前線】暖気が寒気の上に緩やかに這い上がります。乱層雲など広範囲の雲が広がり、長時間のしとしとした雨を降らせます。通過後は気温が上がります。");
    }
  }
  updateBtns();

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const groundY = h - 40;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, groundY, w, 40);

    if (type === 'cold') {
      ctx.fillStyle = "rgba(59, 130, 246, 0.4)";
      ctx.beginPath();
      ctx.moveTo(0, 50);
      ctx.quadraticCurveTo(w*0.4, 60, w*0.5, groundY);
      ctx.lineTo(0, groundY);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.ellipse(w*0.45, groundY - 140, 50, 90, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      for (let i=0; i<8; i++) {
        ctx.beginPath();
        ctx.moveTo(w*0.42 + i*8, groundY - 40);
        ctx.lineTo(w*0.40 + i*8, groundY);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = "rgba(244, 63, 94, 0.35)";
      ctx.beginPath();
      ctx.moveTo(0, groundY - 120);
      ctx.lineTo(w*0.8, groundY);
      ctx.lineTo(0, groundY);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.fillRect(w*0.2, groundY - 100, 240, 30);
    }

    animId = requestAnimationFrame(render);
  }
  render();

  return { destroy: () => cancelAnimationFrame(animId) };
}

// ダニエル電池 (中3・物質)
function initC3Daniel(canvas) {
  const ctx = canvas.getContext('2d');
  let motorRun = true;
  let t = 0;
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group" style="grid-column: 1 / -1;">
      <label>回路スイッチ:</label>

    </div>
  `;

  document.getElementById('bMotor').onclick = () => {
    motorRun = !motorRun;
    document.getElementById('bMotor').textContent = motorRun ? '回路を切断する' : '回路を接続する (発電)';
    document.getElementById('bMotor').className = `btn-action ${motorRun?'':'secondary'}`;
    if (motorRun) {
      setStatus("【発電中】亜鉛板でZn→Zn²⁺+2e⁻（溶解）、銅板でCu²⁺+2e⁻→Cu（析出）。電子が導線を通ってモーターが回転します！");
    } else {
      setStatus("回路を切断しました。電子の移動が止まりました。");
    }
  };
  setStatus("【ダニエル電池】負極の亜鉛板から正極の銅板へと電子が流れ、プロペラが勢いよく回っています！");

  function loop() {
    if (motorRun) t += 0.2;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2;
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 3;
    ctx.strokeRect(cx - 130, cy - 30, 110, 90);
    ctx.strokeRect(cx + 20, cy - 30, 110, 90);

    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(cx - 90, cy - 60, 24, 90);
    ctx.fillStyle = "#f97316";
    ctx.fillRect(cx + 66, cy - 60, 24, 90);

    ctx.save();
    ctx.translate(cx, cy - 90);
    ctx.rotate(t);
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-25, 0); ctx.lineTo(25, 0);
    ctx.stroke();
    ctx.restore();

    animId = requestAnimationFrame(loop);
  }
  loop();

  return { destroy: () => cancelAnimationFrame(animId) };
}

// 力学的エネルギー (中3・エネルギー)
function initC3Motion(canvas) {
  const ctx = canvas.getContext('2d');
  let height = 30;
  let isRunning = false;
  let cartX = 40;
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>斜面のスタート高: <span id="hVal" class="ctrl-val">${height} cm</span></label>
      <input type="range" id="hRange" min="10" max="50" value="${height}">
    </div>
    <div class="ctrl-group">
      <label>台車を発進:</label>
      <button class="btn-action" id="bRun">手をはなす 🚗</button>
    </div>
  `;

  document.getElementById('hRange').oninput = (e) => {
    height = parseInt(e.target.value);
    document.getElementById('hVal').textContent = `${height} cm`;
  };
  document.getElementById('bRun').onclick = () => {
    isRunning = true;
    cartX = 40;
    const speed = Math.sqrt(height * 2).toFixed(1);
    setStatus(`【力学的エネルギー保存】位置エネルギーが運動エネルギーに変換され、最下点での速度は約 ${speed} m/s に達しました！`);
  };

  function loop() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const slopeStartX = 40, slopeStartY = h - 50 - height*2;
    const slopeEndX = 250, slopeEndY = h - 50;

    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(slopeStartX, slopeStartY);
    ctx.lineTo(slopeEndX, slopeEndY);
    ctx.lineTo(w - 30, slopeEndY);
    ctx.stroke();

    if (isRunning) {
      cartX += 6;
      if (cartX > w - 80) isRunning = false;
    }
    const curY = cartX < slopeEndX ? slopeStartY + (cartX - slopeStartX)*((slopeEndY - slopeStartY)/(slopeEndX - slopeStartX)) : slopeEndY;

    ctx.fillStyle = "#ef4444";
    ctx.fillRect(cartX - 15, curY - 20, 30, 20);

    animId = requestAnimationFrame(loop);
  }
  loop();

  return { destroy: () => cancelAnimationFrame(animId) };
}

// 月の満ち欠け (中3・地球)
function initC3Moon(canvas) {
  const ctx = canvas.getContext('2d');
  let angle = 0;
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group" style="grid-column: 1 / -1;">
      <label>月の公転位置（地球の周りをドラッグ）: <span id="mVal" class="ctrl-val">${angle}°</span></label>
      <input type="range" id="mRange" min="0" max="360" value="${angle}">
    </div>
  `;

  document.getElementById('mRange').oninput = (e) => {
    angle = parseInt(e.target.value);
    document.getElementById('mVal').textContent = `${angle}°`;
    updateMoonDesc();
  };

  function updateMoonDesc() {
    if (angle < 20 || angle > 340) setStatus("【新月】太陽と同じ方向にあり、地球からは影の面を向けるため見えません。");
    else if (angle >= 70 && angle <= 110) setStatus("【上弦の月】右半分が輝く半月が、夕方南の空に見えます。");
    else if (angle >= 160 && angle <= 200) setStatus("【満月】太陽の正面に位置し、全面が輝いて真夜中に南中します。");
    else if (angle >= 250 && angle <= 290) setStatus("【下弦の月】左半分が輝く半月が、夜中に東の空から昇ります。");
    else setStatus(`月の公転角度: ${angle}°。地球から見た月の光る面積が変化しています。`);
  }
  updateMoonDesc();

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#020617";
    ctx.fillRect(0, 0, w, h);

    const cx = w/2 - 80, cy = h/2;
    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI*2);
    ctx.fill();

    const rad = angle * Math.PI / 180;
    const mx = cx + Math.cos(rad) * 90;
    const my = cy + Math.sin(rad) * 90;

    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(mx, my, 12, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 2;
    for (let i=-2; i<=2; i++) {
      ctx.beginPath();
      ctx.moveTo(w-20, cy + i*30);
      ctx.lineTo(w-80, cy + i*30);
      ctx.stroke();
    }

    animId = requestAnimationFrame(render);
  }
  render();

  return { destroy: () => cancelAnimationFrame(animId) };
}

    plant += 30;
    carnivore = Math.max(2, carnivore - 5);
    setStatus("【草食動物の減少】食べられる植物が増加し、エサ不足になった肉食動物が減少しました。");
  };
  document.getElementById('bHerbInc').onclick = () => {
    herbivore += 20;
    plant = Math.max(20, plant - 30);
    carnivore += 5;
    setStatus("【草食動物の増加】植物が激減し、それをエサとする肉食動物が一時的に増加しました。");
  };
  setStatus("【生態系ピラミッド】生産者（植物）＞ 一次消費者（草食）＞ 二次消費者（肉食）の数量バランスを観察しましょう。");

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2;
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(cx - plant, cy + 40, plant*2, 35);
    ctx.fillStyle = "#eab308";
    ctx.fillRect(cx - herbivore, cy, herbivore*2, 35);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(cx - carnivore*2, cy - 40, carnivore*4, 35);

    animId = requestAnimationFrame(render);
  }
  render();

  return { destroy: () => cancelAnimationFrame(animId) };
}
</script>
</body>
</html>
