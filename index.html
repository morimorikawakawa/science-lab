    let modal = document.getElementById('daniellResultModal');
    if (modal) modal.remove();

    modal = document.createElement('div');
    modal.id = 'daniellResultModal';
    modal.style.position = 'fixed';
    modal.style.top = '0';
    modal.style.left = '0';
    modal.style.width = '100vw';
    modal.style.height = '100vh';
    modal.style.backgroundColor = 'rgba(0, 0, 0, 0.88)';
    modal.style.zIndex = '9999';
    modal.style.display = 'flex';
    modal.style.flexDirection = 'column';
    modal.style.justifyContent = 'center';
    modal.style.alignItems = 'center';
    modal.style.padding = '20px';
    modal.style.cursor = 'pointer';

    const card = document.createElement('div');
    card.style.background = '#0f172a';
    card.style.border = '2px solid #ea580c';
    card.style.borderRadius = '14px';
    card.style.maxWidth = '640px';
    card.style.width = '92%';
    card.style.maxHeight = '90vh';
    card.style.overflowY = 'auto';
    card.style.padding = '22px';
    card.style.boxShadow = '0 0 40px rgba(234, 88, 12, 0.6)';
    card.style.textAlign = 'center';
    card.style.color = '#ffffff';

    const h2 = document.createElement('h2');
    h2.textContent = '🔬 【実験結果】放電後の金属電極と化学変化の全貌';
    h2.style.color = '#f97316';
    h2.style.fontSize = '18px';
    h2.style.marginBottom = '12px';
    card.appendChild(h2);

    if (electrodeImg.complete && electrodeImg.naturalWidth !== 0) {
      const img = document.createElement('img');
      img.src = electrodeImg.src;
      img.style.maxWidth = '100%';
      img.style.maxHeight = '230px';
      img.style.borderRadius = '8px';
      img.style.marginBottom = '12px';
      img.style.boxShadow = '0 4px 12px rgba(0,0,0,0.5)';
      card.appendChild(img);
    }

    const desc = document.createElement('div');
    desc.style.fontSize = '13px';
    desc.style.lineHeight = '1.7';
    desc.style.textAlign = 'left';
    desc.style.background = '#1e293b';
    desc.style.padding = '14px';
    desc.style.borderRadius = '8px';
    desc.style.color = '#f1f5f9';
    desc.innerHTML = `
      <strong style="color:#38bdf8;">① 亜鉛板（負極）：質量減少（20.0g ➔ 15.0g）</strong><br>
      亜鉛はイオン化傾向が大きいため、電子を2個放出して Zn<sup>2+</sup> となって水溶液へ溶け出します。そのため表面が虫食い状にボロボロに削れ、薄く軽くなります。<br>
      <span style="color:#93c5fd; font-weight:bold;">式：Zn ➔ Zn<sup>2+</sup> ＋ 2e<sup>−</sup></span><br><br>

      <strong style="color:#f43f5e;">② 銅板（正極）：質量増加（20.0g ➔ 25.0g）</strong><br>
      導線を通ってきた電子を、水溶液中の Cu<sup>2+</sup> が受け取って金属の銅（Cu）に戻ります。銅板の表面に赤褐色の銅がびっしりと析出して厚く重くなります。<br>
      <span style="color:#fca5a5; font-weight:bold;">式：Cu<sup>2+</sup> ＋ 2e<sup>−</sup> ➔ Cu</span><br><br>

      <strong style="color:#facc15;">③ 硫酸銅水溶液の青色が透明になった理由：</strong><br>
      青色の正体である Cu<sup>2+</sup>（銅イオン）が次々と金属の銅として析出して減少し、最終的に水溶液中から銅イオンがほぼいなくなったため、無色透明になりました。
    `;
    card.appendChild(desc);

    const tip = document.createElement('p');
    tip.textContent = 'クリックすると閉じて実験室に戻ります';
    tip.style.fontSize = '12px';
    tip.style.color = '#94a3b8';
    tip.style.marginTop = '12px';
    card.appendChild(tip);

    modal.appendChild(card);
    modal.onclick = () => modal.remove();
    document.body.appendChild(modal);
  }

  renderControls();
  updateStatus();

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    const isWorking = isConnected && hasSeparator && dischargeProgress < 100.0;

    if (isWorking) {
      propellerAngle += 0.28 * (1.0 - dischargeProgress / 120);
      electronTick += 0.5;
      dischargeProgress = Math.min(100.0, dischargeProgress + 0.02);

      const prgEl = document.getElementById('progRange');
      const valEl = document.getElementById('progVal');
      if (prgEl && Math.random() < 0.05) {
        prgEl.value = Math.round(dischargeProgress);
        valEl.textContent = `${dischargeProgress.toFixed(0)}%`;
        if (dischargeProgress >= 100.0) {
          renderControls();
          updateStatus();
        }
      }
    }

    const leftW = w - 240;

    // 1. 実験ベンチ
    drawDaniellBench(leftW, h, isWorking);

    // 2. 右側パネル
    const rightX = w - 230, rightW = 215;
    drawElectrodePhotoBox(rightX, 15, rightW, 140);
    drawDaniellSummaryTable(rightX, 165, rightW, h - 180);

    animId = requestAnimationFrame(render);
  }
  render();

  function drawDaniellBench(bw, bh, isWorking) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(15, 15, bw - 20, bh - 30);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(15, 15, bw - 20, bh - 30);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🔋 ダニエル電池の仕組みとイオン・電子の移動", 28, 28);

    const { vesselX, vesselY, vesselW, vesselH, cx } = getVesselBounds(bw);

    // 水槽背景
    // 左室（硫酸亜鉛）：無色透明
    ctx.fillStyle = "rgba(148, 163, 184, 0.18)";
    ctx.fillRect(vesselX + 3, vesselY + 25, vesselW / 2 - 3, vesselH - 28);

    // 右室（硫酸銅）：青色（放電で退色）
    const blueAlpha = Math.max(0.04, 0.55 * (1.0 - dischargeProgress / 100.0));
    ctx.fillStyle = !hasSeparator ? "rgba(59, 130, 246, 0.35)" : `rgba(14, 165, 233, ${blueAlpha})`;
    ctx.fillRect(vesselX + vesselW / 2, vesselY + 25, vesselW / 2 - 3, vesselH - 28);

    // 水槽枠
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 3;
    ctx.strokeRect(vesselX, vesselY, vesselW, vesselH);

    // 素焼き板仕切り
    if (hasSeparator) {
      ctx.fillStyle = "#d97706";
      ctx.fillRect(cx - 3, vesselY + 5, 6, vesselH - 8);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - 3, vesselY + 5, 6, vesselH - 8);

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("素焼き板", cx, vesselY - 6);
    } else {
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = "#ef4444";
      ctx.beginPath();
      ctx.moveTo(cx, vesselY + 5);
      ctx.lineTo(cx, vesselY + vesselH - 5);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#ef4444";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("仕切りなし(短絡)", cx, vesselY - 6);
    }

    // --- 電極の描画 ---
    const plateTopY = vesselY - 35;
    const plateH = 135;

    // 1. 亜鉛板（負極）
    const znX = vesselX + 42;
    const znThick = Math.max(4, 15 * (1.0 - (dischargeProgress / 100.0) * 0.65));
    ctx.fillStyle = !hasSeparator ? "#1e293b" : "#94a3b8";
    ctx.fillRect(znX - znThick / 2, plateTopY, znThick, plateH);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.strokeRect(znX - znThick / 2, plateTopY, znThick, plateH);

    if (dischargeProgress > 20 && hasSeparator) {
      ctx.fillStyle = "#0f172a";
      for (let i = 0; i < 4; i++) {
        ctx.fillRect(znX - znThick / 2 - 1, plateTopY + 50 + i * 18, 3, 4);
        ctx.fillRect(znX + znThick / 2 - 2, plateTopY + 58 + i * 18, 3, 4);
      }
    }

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("−極: 亜鉛板(Zn)", znX, plateTopY - 14);
    const znMass = (20.0 - (dischargeProgress * 0.05)).toFixed(1);
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "9px sans-serif";
    ctx.fillText(`${znMass}g (溶解↓)`, znX, plateTopY - 3);

    // 2. 銅板（正極）
    const cuX = vesselX + vesselW - 42;
    const cuThick = 13 + (dischargeProgress / 100.0) * 12;
    ctx.fillStyle = "#b45309";
    ctx.fillRect(cuX - 6, plateTopY, 12, plateH);

    if (dischargeProgress > 8) {
      ctx.fillStyle = "#ea580c";
      ctx.fillRect(cuX - cuThick / 2, plateTopY + 38, cuThick, plateH - 38);
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(cuX - cuThick / 2 - 2, plateTopY + 45 + i * 16, 3, 4);
        ctx.fillRect(cuX + cuThick / 2 - 1, plateTopY + 52 + i * 16, 3, 4);
      }
    }
    ctx.strokeStyle = "#f97316";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(cuX - cuThick / 2, plateTopY, cuThick, plateH);

    ctx.fillStyle = "#f43f5e";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("＋極: 銅板(Cu)", cuX, plateTopY - 14);
    const cuMass = (20.0 + (dischargeProgress * 0.05)).toFixed(1);
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "9px sans-serif";
    ctx.fillText(`${cuMass}g (析出↑)`, cuX, plateTopY - 3);

    // --- 導線・電圧計・モーター ---
    const wireY = 52;
    ctx.strokeStyle = isWorking ? "#facc15" : "#475569";
    ctx.lineWidth = 2.5;

    // 導線
    ctx.beginPath();
    ctx.moveTo(znX, plateTopY);
    ctx.lineTo(znX, wireY);
    ctx.lineTo(cuX, wireY);
    ctx.lineTo(cuX, plateTopY);
    ctx.stroke();

    // 電圧計
    drawVoltmeter(znX + 28, wireY - 15, 34, 30, isWorking ? 1.10 : 0.0);

    // モーター ＆ プロペラ
    const motorX = cuX - 32;
    drawMotorPropeller(motorX, wireY, propellerAngle, isWorking);

    // 電子と電流の向きラベル
    const midWireX = (znX + cuX) / 2 + 5;
    if (isWorking) {
      ctx.fillStyle = "#facc15";
      for (let i = 0; i < 6; i++) {
        const span = (cuX - znX);
        const p = ((electronTick * 2.8 + i * 35) % span);
        ctx.beginPath();
        ctx.arc(znX + p, wireY, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("電子(e⁻)の移動 ➔", midWireX, wireY - 7);
      ctx.fillStyle = "#f43f5e";
      ctx.fillText("⬅ 電流の向き(＋➔−)", midWireX, wireY + 18);
    }

    // --- 水溶液中のイオンモデル ---
    ions.forEach(ion => {
      ion.x += ion.vx;
      ion.y += ion.vy;

      // 外壁バウンド
      if (ion.x < vesselX + 10) { ion.x = vesselX + 10; ion.vx *= -1; }
      if (ion.x > vesselX + vesselW - 10) { ion.x = vesselX + vesselW - 10; ion.vx *= -1; }
      if (ion.y < vesselY + 30) { ion.y = vesselY + 30; ion.vy *= -1; }
      if (ion.y > vesselY + vesselH - 12) { ion.y = vesselY + vesselH - 12; ion.vy *= -1; }

      // 素焼き板の境界
      if (hasSeparator) {
        if (ion.type.startsWith("SO4")) {
          if (isWorking && ion.type === "SO4_R" && ion.x < cx) {
            ion.type = "SO4_L";
          }
        } else {
          if (ion.x > cx - 6 && ion.x < cx + 6) ion.vx *= -1;
        }
      }

      drawIon(ion.x, ion.y, ion.type);
    });

    // 下部：両極の化学反応式
    drawDaniellFormulaBar(25, bh - 60, bw - 45, 42);
  }

  function drawIon(x, y, type) {
    ctx.save();
    let col = "#ffffff";
    let text = "";

    if (type === "Zn2") {
      col = "#94a3b8"; text = "Zn²⁺";
    } else if (type === "Cu2") {
      col = "#38bdf8"; text = "Cu²⁺";
    } else {
      col = "#c084fc"; text = "SO₄²⁻";
    }

    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = type === "Zn2" ? "#000000" : "#ffffff";
    ctx.font = "bold 7px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(text, x, y + 2.5);
    ctx.restore();
  }

  function drawVoltmeter(x, y, w, h, val) {
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("電圧計", x + w / 2, y + 9);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px monospace";
    ctx.fillText(`${val.toFixed(2)}V`, x + w / 2, y + 22);
  }

  function drawMotorPropeller(mx, my, angle, isWorking) {
    ctx.fillStyle = "#334155";
    ctx.beginPath();
    ctx.arc(mx, my, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(angle);
    ctx.fillStyle = isWorking ? "#22c55e" : "#64748b";
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, 0, 3.5, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawDaniellFormulaBar(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📝 ダニエル電池の両極の反応式（入試超頻出）：", bx + 8, by + 13);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("【−極(Zn)】 Zn ➔ Zn²⁺ ＋ 2e⁻ （亜鉛が溶けて電子を放出）", bx + 8, by + 26);

    ctx.fillStyle = "#f43f5e";
    ctx.fillText("【＋極(Cu)】 Cu²⁺ ＋ 2e⁻ ➔ Cu （銅イオンが電子を受け取り銅が析出）", bx + 8, by + 37);
  }

  // ========================================================
  // B. 右上パネル：実写写真枠
  // ========================================================
  function drawElectrodePhotoBox(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📷 実写写真: 反応後の両電極", bx + 8, by + 16);

    if (electrodeImg.complete && electrodeImg.naturalWidth !== 0) {
      ctx.drawImage(electrodeImg, bx + 8, by + 24, bw - 16, bh - 32);
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(bx + 8, by + 24, bw - 16, bh - 32);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("crystal_daniell_electrodes.jpg", bx + bw / 2, by + bh / 2);
      ctx.fillText("実写画像待機中", bx + bw / 2, by + bh / 2 + 15);
    }

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(bx + 8, by + bh - 20, bw - 16, 16);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("左: 溶けた亜鉛板 / 右: 銅が析出した銅板", bx + bw / 2, by + bh - 8);
  }

  // ========================================================
  // C. 右下パネル：入試完璧整理対照表
  // ========================================================
  function drawDaniellSummaryTable(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📋 電極ごとの変化まとめ（テスト必出）", bx + 8, by + 16);

    const rows = [
      { item: "極の種類", zn: "−極 (負極)", cu: "＋極 (正極)" },
      { item: "イオン化傾向", zn: "大 (Zn)", cu: "小 (Cu)" },
      { item: "電極の質量", zn: "減少 ⬇️ (溶ける)", cu: "増加 ⬆️ (析出)" },
      { item: "水溶液の色", zn: "変化なし(無色)", cu: "青色が薄くなる" },
      { item: "電子のやり取り", zn: "電子を失う", cu: "電子を受け取る" }
    ];

    ctx.font = "9px sans-serif";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("項目", bx + 8, by + 34);
    ctx.fillText("亜鉛板(Zn)", bx + 70, by + 34);
    ctx.fillText("銅板(Cu)", bx + 145, by + 34);

    rows.forEach((r, idx) => {
      const iy = by + 48 + idx * 23;
      ctx.fillStyle = "#cbd5e1";
      ctx.textAlign = "left";
      ctx.fillText(r.item, bx + 8, iy);

      ctx.fillStyle = (idx === 2) ? "#38bdf8" : "#e2e8f0";
      ctx.fillText(r.zn, bx + 70, iy);

      ctx.fillStyle = (idx === 2) ? "#f43f5e" : "#e2e8f0";
      ctx.fillText(r.cu, bx + 145, iy);
    });

    const footY = by + bh - 38;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(bx + 6, footY, bw - 12, 32);
    ctx.fillStyle = "#5eead4";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("【素焼き板の記述対策】：", bx + 10, footY + 12);
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("2液の混合を防ぎ、イオンを通すため。", bx + 10, footY + 23);
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
      const modal = document.getElementById('daniellResultModal');
      if (modal) modal.remove();
    }
  };
}

// 【究極覚醒版】メンデルの遺伝の規則性とサヤ割り収穫ガチャ (中3・生命)
// ===================================================================
function initC3Mendel(canvas) {
  const ctx = canvas.getContext('2d');

  // --- 実験状態 ---
  let stepMode = 'f2';          // 'p_to_f1'(親➔子), 'f2'(子➔孫), 'test_cross'(検定交配)
  let roundCount = 0;           // 収穫された丸豆の総数
  let wrinkledCount = 0;        // 収穫されたしわ豆の総数
  let flyingBeans = [];         // 飛び出す豆の物理パーティクル
  let podOpenAngle = 0.0;       // サヤが開くアニメーション角度 (0.0〜1.0)
  let animId;
  let tick = 0;

  // 検定交配の隠し親
  let mysteryParent = 'Aa';
  let testCrossHarvest = { round: 0, wrinkled: 0 };

  // 実写写真（丸エンドウとしわエンドウ）
  const peaPhotoImg = new Image();
  peaPhotoImg.src = 'mendel_peas_seeds.jpg';

  const controls = document.getElementById('labControlsArea');

  function renderControls() {
    const total = roundCount + wrinkledCount;
    const ratioText = wrinkledCount > 0 ? (roundCount / wrinkledCount).toFixed(2) + " : 1" : "―";

    controls.innerHTML = `
      <div class="ctrl-group" style="grid-column: 1 / -1;">
        <label>1. 実験・世代モードの選択:</label>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <button class="btn-action ${stepMode==='p_to_f1'?'':'secondary'}" id="bModeF1">
            ① 親(AA×aa) ➔ 子(F1)生成 【優性の法則】
          </button>
          <button class="btn-action ${stepMode==='f2'?'':'secondary'}" id="bModeF2" style="${stepMode==='f2'?'background:#0d9488; border-color:#0d9488;':''}">
            ② 子(Aa×Aa) ➔ 孫(F2)受粉 【分離の法則・3:1 ガチャ】
          </button>
          <button class="btn-action ${stepMode==='test_cross'?'':'secondary'}" id="bModeTest" style="${stepMode==='test_cross'?'background:#ea580c; border-color:#ea580c;':''}">
            🔍 検定交配チャレンジ (丸豆の遺伝子型を暴く)
          </button>
        </div>
      </div>

      ${stepMode === 'f2' ? `
      <div class="ctrl-group">
        <label>2. 孫(F2)のサヤを収穫する (大数の法則ガチャ):</label>
        <div style="display:flex; gap:6px;">
          <button class="btn-action" id="bHarvestOne" style="flex:1; background:#10b981; border-color:#10b981; font-weight:bold; padding:8px 4px; font-size:12px;">サヤを割る！ (4粒) 🫛</button>
          <button class="btn-action" id="bHarvest100" style="flex:1; background:#0284c7; border-color:#0284c7; padding:8px 4px; font-size:12px;">100粒一括受粉 ⚡</button>
          <button class="btn-action" id="bHarvest1000" style="flex:1; background:#7c3aed; border-color:#7c3aed; padding:8px 4px; font-size:12px;">1000粒超受粉 🚀</button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>累計収穫カウント & 理論比率への収束:</label>
        <div style="font-size:12px; line-height:1.6; color:#cbd5e1;">
          収穫累計: <strong style="color:#ffffff; font-size:13px;">${total} 粒</strong> 
          (丸: <span style="color:#4ade80; font-weight:bold;">${roundCount}</span> / 
          しわ: <span style="color:#f59e0b; font-weight:bold;">${wrinkledCount}</span>)<br>
          現在の比率 ➔ <strong style="color:#facc15; font-size:15px; font-family:monospace;">${ratioText}</strong> 
          <small style="color:#94a3b8;">(理論値 3.00 : 1)</small>
        </div>
      </div>
      ` : ''}

      ${stepMode === 'test_cross' ? `
      <div class="ctrl-group" style="grid-column: 1 / -1;">
        <label>丸豆(？) と しわ豆(aa) の交配実験:</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn-action" id="bTestCrossDrip" style="flex:1; background:#0284c7; border-color:#0284c7;">交配して子を100粒収穫する</button>
          <button class="btn-action secondary" id="bNewMystery" style="flex:1;">別の丸豆を選ぶ 🔄</button>
        </div>
        <div style="margin-top:8px; font-size:12px; color:#cbd5e1;">
          子の出現数 ➔ 丸: <strong style="color:#4ade80;">${testCrossHarvest.round}</strong> 粒 ／ しわ: <strong style="color:#f59e0b;">${testCrossHarvest.wrinkled}</strong> 粒
          ${(testCrossHarvest.round + testCrossHarvest.wrinkled > 0) ? `
            <span style="margin-left:10px; font-weight:bold; color:#facc15;">
              判別結果：この丸豆の遺伝子型は【 ${testCrossHarvest.wrinkled > 0 ? 'Aa (雑種)' : 'AA (純系)'} 】確定！
            </span>
          ` : ''}
        </div>
      </div>
      ` : ''}

      <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; gap:8px;">
        <button class="btn-action secondary" id="bResetStats" style="width:100%; font-size:12px; padding:6px;">
          実験カウントをリセット 🔄
        </button>
      </div>
    `;

    document.getElementById('bModeF1').onclick = () => { stepMode = 'p_to_f1'; renderControls(); updateStatus(); };
    document.getElementById('bModeF2').onclick = () => { stepMode = 'f2'; renderControls(); updateStatus(); };
    document.getElementById('bModeTest').onclick = () => {
      stepMode = 'test_cross';
      mysteryParent = Math.random() < 0.5 ? 'AA' : 'Aa';
      testCrossHarvest = { round: 0, wrinkled: 0 };
      renderControls();
      updateStatus();
    };

    if (stepMode === 'f2') {
      document.getElementById('bHarvestOne').onclick = () => harvestF2(4, true);
      document.getElementById('bHarvest100').onclick = () => harvestF2(100, false);
      document.getElementById('bHarvest1000').onclick = () => harvestF2(1000, false);
    }

    if (stepMode === 'test_cross') {
      document.getElementById('bTestCrossDrip').onclick = () => {
        let r = 0, w = 0;
        for (let i = 0; i < 100; i++) {
          if (mysteryParent === 'AA') {
            r++;
          } else {
            Math.random() < 0.5 ? r++ : w++;
          }
        }
        testCrossHarvest.round += r;
        testCrossHarvest.wrinkled += w;
        renderControls();
        updateStatus();
      };
      document.getElementById('bNewMystery').onclick = () => {
        mysteryParent = Math.random() < 0.5 ? 'AA' : 'Aa';
        testCrossHarvest = { round: 0, wrinkled: 0 };
        renderControls();
        updateStatus();
      };
    }

    document.getElementById('bResetStats').onclick = () => {
      roundCount = 0;
      wrinkledCount = 0;
      flyingBeans = [];
      podOpenAngle = 0.0;
      testCrossHarvest = { round: 0, wrinkled: 0 };
      renderControls();
      updateStatus();
    };
  }

  // 収穫処理
  function harvestF2(count, isVisual) {
    let newRound = 0;
    let newWrinkled = 0;

    if (isVisual) {
      podOpenAngle = 1.0; // サヤが開く
    }

    for (let i = 0; i < count; i++) {
      const egg = Math.random() < 0.5 ? 'A' : 'a';
      const pollen = Math.random() < 0.5 ? 'A' : 'a';
      const isRound = !(egg === 'a' && pollen === 'a');

      if (isRound) newRound++;
      else newWrinkled++;

      if (isVisual) {
        flyingBeans.push({
          isRound: isRound,
          x: (canvas.width - 240) / 2 - 45 + (i * 30),
          y: 165,
          vx: (Math.random() - 0.5) * 3.5,
          vy: -4 - Math.random() * 3,
          rot: Math.random() * Math.PI * 2,
          rotV: (Math.random() - 0.5) * 0.2
        });
      }
    }

    roundCount += newRound;
    wrinkledCount += newWrinkled;

    if (flyingBeans.length > 24) flyingBeans.splice(0, flyingBeans.length - 24);

    renderControls();
    updateStatus();
  }

  function updateStatus() {
    if (stepMode === 'p_to_f1') {
      setStatus("【優性の法則 (F1)】丸の純系(AA)としわの純系(aa)を交配すると、子はすべて『Aa』となり、優性の形質である『丸』だけが現れます。しわの形質(a)は消えたのではなく潜伏しています！");
    } else if (stepMode === 'f2') {
      const total = roundCount + wrinkledCount;
      if (total === 0) {
        setStatus("【分離の法則 (F2)】子(Aa)を自家受粉させます。「サヤを割る！」ボタンや一括受粉を押して、豆が飛び出すガチャを回してみましょう！");
      } else {
        const ratio = (wrinkledCount > 0) ? (roundCount / wrinkledCount).toFixed(2) : "―";
        setStatus(`【大数の法則の実証】累計${total}粒収穫中！丸: ${roundCount}個 ／ しわ: ${wrinkledCount}個 ➔ 比率『${ratio} : 1』！受粉数を増やすほど、理論値【 3.00 : 1 】に吸い寄せられていきます！`);
      }
    } else {
      setStatus("【検定交配チャレンジ】見た目は同じ丸豆ですが、遺伝子型が純系(AA)なのか雑種(Aa)なのか判別できますか？しわ(aa)と交配して、子にしわが出るか確かめましょう！");
    }
  }

  renderControls();
  updateStatus();

  // ========================================================
  // メイン描画ループ
  // ========================================================
  function render() {
    tick += 0.04;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    const leftW = w - 240;

    // 1. メイン実験ステージ
    drawMendelStage(leftW, h);

    // 2. 右側パネル（実写写真枠 & ハイエンドプネット方格）
    const rightX = w - 230, rightW = 215;
    drawPeaPhotoBox(rightX, 15, rightW, 140);
    drawPunnettSquarePanel(rightX, 165, rightW, h - 180);

    animId = requestAnimationFrame(render);
  }
  render();

  // ========================================================
  // A. メイン実験ステージ（被りを完全解消した黄金レイアウト）
  // ========================================================
  function drawMendelStage(bw, bh) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(15, 15, bw - 20, bh - 30);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(15, 15, bw - 20, bh - 30);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🫛 メンデルのエンドウ交配実験とサヤ収穫シミュレーター", 28, 28);

    const cx = bw / 2 - 15;

    if (stepMode === 'p_to_f1') {
      drawParentToF1Cross(cx, bh);
    } else if (stepMode === 'f2') {
      drawF2PodHarvest(cx, bh);
    } else {
      drawTestCrossView(cx, bh);
    }

    // 下部：遺伝用語解説バー
    drawMendelTerminologyBar(25, bh - 60, bw - 45, 42);
  }

  // ① 親 ➔ 子 (F1) のグラフィック（重なりをミリ単位で解消）
  function drawParentToF1Cross(cx, bh) {
    // 親世代 (P)
    const pY = 65;
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("【親の代 (P)】 純系同士のかけ合わせ", cx, pY - 8);

    // 親1：丸 (AA)
    drawRealisticPea(cx - 90, pY + 22, 17, true, "AA", "#22c55e");
    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("丸 (純系 AA)", cx - 90, pY + 52);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText("×", cx, pY + 22);

    // 親2：しわ (aa)
    drawRealisticPea(cx + 90, pY + 22, 17, false, "aa", "#f59e0b");
    ctx.fillStyle = "#f59e0b";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("しわ (純系 aa)", cx + 90, pY + 52);

    // 減数分裂の矢印と生殖細胞
    const gameteY = pY + 78;
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx - 90, pY + 58); ctx.lineTo(cx - 35, gameteY);
    ctx.moveTo(cx + 90, pY + 58); ctx.lineTo(cx + 35, gameteY);
    ctx.stroke();

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 9px sans-serif";
    ctx.fillText("生殖細胞: A", cx - 45, gameteY + 4);
    ctx.fillText("生殖細胞: a", cx + 45, gameteY + 4);

    // 受精の矢印
    ctx.beginPath();
    ctx.moveTo(cx - 20, gameteY + 8); ctx.lineTo(cx, gameteY + 28);
    ctx.moveTo(cx + 20, gameteY + 8); ctx.lineTo(cx, gameteY + 28);
    ctx.stroke();

    // 子の代 (F1) - サヤと文字の重なりを完全解消（Y=185とY=220に分離）
    const f1TextY = gameteY + 42;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("【子の代 (F1)】 すべて丸（雑種 Aa）", cx, f1TextY);

    const podY = f1TextY + 38;
    // 美麗なエンドウのサヤ（中身は全てきれいな丸豆 Aa）
    drawRealisticPod(cx - 85, podY, 170, [true, true, true, true], "Aa", 0.0);
  }

  // ② 孫 (F2) のサヤ割りと弾け飛ぶガチャ演出
  function drawF2PodHarvest(cx, bh) {
    const topY = 65;
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("【孫の代 (F2)】 自家受粉サヤ割りガチャ", cx, topY - 8);

    // サヤが開くアニメーション
    if (podOpenAngle > 0.05) podOpenAngle -= 0.03;
    else podOpenAngle = 0.0;

    const podY = topY + 55;
    drawRealisticPod(cx - 95, podY, 190, [true, true, false, true], "Aa", podOpenAngle);

    // 飛び散る豆の物理シミュレーション描画
    flyingBeans.forEach(b => {
      b.y += b.vy;
      b.x += b.vx;
      b.vy += 0.22; // 重力
      b.rot += b.rotV;

      if (b.y > bh - 90) {
        b.y = bh - 90;
        b.vy *= -0.4; // 地面バウンド
        b.vx *= 0.8;
      }

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      drawRealisticPea(0, 0, 11, b.isRound, b.isRound ? "丸" : "しわ", b.isRound ? "#22c55e" : "#f59e0b");
      ctx.restore();
    });

    // 収穫比率バーメーター（ターゲット収束）
    const total = roundCount + wrinkledCount;
    if (total > 0) {
      const meterW = 220, meterH = 16;
      const mx = cx - meterW / 2, my = topY + 115;

      const roundRatio = roundCount / total;
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(mx, my, meterW, meterH);

      // 丸豆（緑）としわ豆（橙）の帯
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(mx, my, meterW * roundRatio, meterH);
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(mx + meterW * roundRatio, my, meterW * (1 - roundRatio), meterH);

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.2;
      ctx.strokeRect(mx, my, meterW, meterH);

      // 理論値 75% (3:1) のインジケーターライン
      const targetX = mx + meterW * 0.75;
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(targetX, my - 6);
      ctx.lineTo(targetX, my + meterH + 6);
      ctx.stroke();

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 9px sans-serif";
      ctx.fillText("理論値 75% (3:1)", targetX, my - 9);

      // 豆の累計数表示
      ctx.fillStyle = "#4ade80";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`丸: ${roundCount}粒 (${(roundRatio * 100).toFixed(1)}%)`, mx, my + meterH + 15);

      ctx.fillStyle = "#f59e0b";
      ctx.textAlign = "right";
      ctx.fillText(`しわ: ${wrinkledCount}粒 (${((1 - roundRatio) * 100).toFixed(1)}%)`, mx + meterW, my + meterH + 15);
    }
  }

  // ③ 検定交配の画面
  function drawTestCrossView(cx, bh) {
    const topY = 70;
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("【検定交配】謎の丸豆の遺伝子型を暴く！", cx, topY - 10);

    // 謎の丸豆
    drawRealisticPea(cx - 80, topY + 30, 19, true, "？", "#22c55e");
    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText("丸豆 (AA か Aa？)", cx - 80, topY + 62);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("×", cx, topY + 30);

    // 判定相手：しわ豆 (aa)
    drawRealisticPea(cx + 80, topY + 30, 19, false, "aa", "#f59e0b");
    ctx.fillStyle = "#f59e0b";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText("しわ豆 (劣性純系 aa)", cx + 80, topY + 62);

    // 判定ロジック解説カード
    const cardY = topY + 80;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(cx - 130, cardY, 260, 52);
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1;
    ctx.strokeRect(cx - 130, cardY, 260, 52);

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("・子にしわ(aa)が1粒でも出る ➔ 親は【 Aa 】確定！", cx - 118, cardY + 20);
    ctx.fillText("・子がすべて丸(Aa)になる ➔ 親は【 AA 】確定！", cx - 118, cardY + 38);
  }

  // 立体的なエンドウ豆（ハイライト・陰影付き）
  function drawRealisticPea(x, y, r, isRound, label, baseColor) {
    ctx.save();

    if (isRound) {
      // 丸豆（球体のグラデーション）
      const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
      grad.addColorStop(0, "#86efac");
      grad.addColorStop(0.5, baseColor);
      grad.addColorStop(1, "#14532d");
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 光沢ハイライト
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.beginPath();
      ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // しわ豆（凹凸・しわの入った多角形）
      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.moveTo(x - r, y - r * 0.3);
      ctx.lineTo(x - r * 0.4, y - r);
      ctx.lineTo(x + r * 0.5, y - r * 0.8);
      ctx.lineTo(x + r, y - r * 0.2);
      ctx.lineTo(x + r * 0.8, y + r * 0.7);
      ctx.lineTo(x - r * 0.1, y + r);
      ctx.lineTo(x - r * 0.9, y + r * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // しわの陰影ライン
      ctx.strokeStyle = "rgba(120, 53, 15, 0.7)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.4, y - r * 0.3);
      ctx.lineTo(x + r * 0.2, y);
      ctx.lineTo(x + r * 0.5, y + r * 0.4);
      ctx.moveTo(x, y - r * 0.5);
      ctx.lineTo(x - r * 0.2, y + r * 0.3);
      ctx.stroke();
    }

    // ラベル
    ctx.fillStyle = isRound ? "#052e16" : "#451a03";
    ctx.font = "bold 8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, x, y + 3);

    ctx.restore();
  }

  // 本物の形状を持つエンドウのサヤ（開閉アニメーション対応）
  function drawRealisticPod(x, y, w, beansBoolArray, label, openRatio) {
    ctx.save();

    const podH = 26;
    const splitOffset = openRatio * 14;

    // サヤ上半分（上へ開く）
    ctx.fillStyle = "#15803d";
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(x, y - splitOffset);
    ctx.quadraticCurveTo(x + w * 0.5, y - podH - splitOffset, x + w, y - splitOffset);
    ctx.lineTo(x + w + 8, y - 4 - splitOffset); // 先端の尖り
    ctx.quadraticCurveTo(x + w * 0.5, y - 4 - splitOffset, x, y - splitOffset);
    ctx.fill();
    ctx.stroke();

    // サヤ下半分（下へ開く）
    ctx.beginPath();
    ctx.moveTo(x, y + splitOffset);
    ctx.quadraticCurveTo(x + w * 0.5, y + podH + splitOffset, x + w, y + splitOffset);
    ctx.lineTo(x + w + 8, y + 4 + splitOffset);
    ctx.quadraticCurveTo(x + w * 0.5, y + 4 + splitOffset, x, y + splitOffset);
    ctx.fill();
    ctx.stroke();

    // サヤのヘタ（左側）
    ctx.fillStyle = "#166534";
    ctx.beginPath();
    ctx.moveTo(x - 8, y - 8);
    ctx.lineTo(x + 4, y);
    ctx.lineTo(x - 8, y + 8);
    ctx.closePath();
    ctx.fill();

    // 中に並ぶ豆
    if (openRatio < 0.6) {
      const step = w / (beansBoolArray.length + 1);
      beansBoolArray.forEach((isR, idx) => {
        const bx = x + step * (idx + 1);
        drawRealisticPea(bx, y, 10, isR, label, isR ? "#22c55e" : "#f59e0b");
      });
    }

    ctx.restore();
  }

  function drawMendelTerminologyBar(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📝 メンデルの遺伝の重要キーワード（入試必出）：", bx + 8, by + 13);

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "9px sans-serif";
    ctx.fillText("・優性の法則: 対立形質をかけ合わせると、F1には優性の形質(丸)のみが現れる。", bx + 8, by + 25);
    ctx.fillText("・分離の法則: 対になる遺伝子は減数分裂で分かれて別の生殖細胞に入る (F2比率 3:1)。", bx + 8, by + 36);
  }

  // ========================================================
  // B. 右上パネル：実写写真枠
  // ========================================================
  function drawPeaPhotoBox(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📷 実写写真: エンドウの丸豆としわ豆", bx + 8, by + 16);

    if (peaPhotoImg.complete && peaPhotoImg.naturalWidth !== 0) {
      ctx.drawImage(peaPhotoImg, bx + 8, by + 24, bw - 16, bh - 32);
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(bx + 8, by + 24, bw - 16, bh - 32);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("mendel_peas_seeds.jpg", bx + bw / 2, by + bh / 2);
      ctx.fillText("実写画像待機中", bx + bw / 2, by + bh / 2 + 15);
    }

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(bx + 8, by + bh - 20, bw - 16, 16);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("左: 丸(優性) / 右: しわ(劣性)", bx + bw / 2, by + bh - 8);
  }

  // ========================================================
  // C. 右下パネル：ハイエンド・プネット方格（四角い交配表）
  // ========================================================
  function drawPunnettSquarePanel(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📋 孫(F2)のプネット方格 (交配表)", bx + 8, by + 16);

    const gx = bx + 45, gy = by + 34;
    const cw = 65, ch = 38;

    // 表頭
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("精子＼卵", gx - 20, gy - 6);
    ctx.fillText("A", gx + cw / 2, gy - 6);
    ctx.fillText("a", gx + cw * 1.5, gy - 6);
    ctx.fillText("A", gx - 14, gy + ch * 0.6);
    ctx.fillText("a", gx - 14, gy + ch * 1.6);

    // 4マス (AA, Aa, Aa, aa)
    const cells = [
      { r: 0, c: 0, gene: "AA", isR: true,  col: "#14532d" },
      { r: 0, c: 1, gene: "Aa", isR: true,  col: "#166534" },
      { r: 1, c: 0, gene: "Aa", isR: true,  col: "#166534" },
      { r: 1, c: 1, gene: "aa", isR: false, col: "#78350f" }
    ];

    cells.forEach(cell => {
      const cx = gx + cell.c * cw;
      const cy = gy + cell.r * ch;

      ctx.fillStyle = cell.col;
      ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 1.2;
      ctx.strokeRect(cx, cy, cw, ch);

      ctx.fillStyle = cell.isR ? "#4ade80" : "#facc15";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(cell.gene, cx + cw / 2, cy + 17);
      ctx.font = "9px sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(cell.isR ? "(丸)" : "(しわ★)", cx + cw / 2, cy + 30);
    });

    // 比率まとめ
    const footY = by + bh - 40;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(bx + 6, footY, bw - 12, 34);
    ctx.fillStyle = "#5eead4";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("【比率の超頻出ポイント】", bx + 10, footY + 12);
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("・遺伝子型比 ➔ AA : Aa : aa ＝ 1 : 2 : 1", bx + 10, footY + 22);
    ctx.fillText("・表現型(見た目) ➔ 丸 : しわ ＝ 3 : 1", bx + 10, footY + 31);
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
    }
  };
}





































































// ===================================================================
// 【車輪接地＆グラフ完全吸着修正版】力学的エネルギー (中3・エネルギー)
// ===================================================================
function initC3Motion(canvas) {
  const ctx = canvas.getContext('2d');

  // --- 実験パラメータ ---
  let startHeight = 20;         // スタート高さ (cm: 10〜40)
  let cartMassMultiplier = 1;   // 台車の重さ (1:標準, 2:おもり2倍)
  let isRunning = false;        // 走行中フラグ
  let animId;

  // 物理状態
  let cartProgress = 0.0;       // レール上の位置 (0.0:スタート 〜 1.0:斜面終点)
  let cartSpeed = 0.0;          // 現在の速さ (m/s)
  let bottomSpeed = 0.0;        // 最下点通過時の速さ (m/s)
  let woodBlockX = 0.0;         // 木片の押し出し移動距離 (cm)
  let woodSlideVelocity = 0.0;  // 木片のスライド速度

  const controls = document.getElementById('labControlsArea');

  function renderControls() {
    controls.innerHTML = `
      <div class="ctrl-group">
        <label>1. スタートの高さ: <span id="hVal" class="ctrl-val">${startHeight} cm</span></label>
        <input type="range" id="hRange" min="10" max="40" step="5" value="${startHeight}" ${isRunning?'disabled':''}>
      </div>

      <div class="ctrl-group">
        <label>2. 台車の質量 (おもりの追加):</label>
        <div style="display:flex; gap:6px;">
          <button class="btn-action ${cartMassMultiplier===1?'':'secondary'}" id="bMass1" ${isRunning?'disabled':''}>標準 (台車のみ)</button>
          <button class="btn-action ${cartMassMultiplier===2?'':'secondary'}" id="bMass2" style="${cartMassMultiplier===2?'background:#ea580c; border-color:#ea580c;':''}" ${isRunning?'disabled':''}>おもり搭載 (質量2倍) 🏋️</button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>3. 発進操作:</label>
        <button class="btn-action" id="bLaunch" style="background:#10b981; border-color:#10b981; font-size:14px; font-weight:bold; width:100%;" ${isRunning?'disabled':''}>
          🚀 手をはなす（滑走＆衝突実験！）
        </button>
      </div>

      <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; gap:8px;">
        <button class="btn-action secondary" id="bResetMotion" style="width:100%; font-size:12px; padding:6px;">
          実験台をリセット 🔄
        </button>
      </div>
    `;

    document.getElementById('hRange').oninput = (e) => {
      startHeight = parseInt(e.target.value);
      document.getElementById('hVal').textContent = `${startHeight} cm`;
      resetPhysics();
      updateStatus();
    };

    document.getElementById('bMass1').onclick = () => {
      cartMassMultiplier = 1;
      renderControls();
      resetPhysics();
      updateStatus();
    };

    document.getElementById('bMass2').onclick = () => {
      cartMassMultiplier = 2;
      renderControls();
      resetPhysics();
      updateStatus();
    };

    document.getElementById('bLaunch').onclick = () => {
      if (!isRunning) {
        isRunning = true;
        cartProgress = 0.0;
        woodBlockX = 0.0;
        woodSlideVelocity = 0.0;
        bottomSpeed = 0.0;
        renderControls();
        updateStatus();
      }
    };

    document.getElementById('bResetMotion').onclick = () => {
      resetPhysics();
      renderControls();
      updateStatus();
    };
  }

  function resetPhysics() {
    isRunning = false;
    cartProgress = 0.0;
    cartSpeed = 0.0;
    bottomSpeed = 0.0;
    woodBlockX = 0.0;
    woodSlideVelocity = 0.0;
  }

  // 木片移動距離の理論値 (cm)
  function getTheoreticalDistance() {
    return (startHeight / 40.0) * cartMassMultiplier * 20.0;
  }

  // 最下点速度の理論値 (m/s)
  function getTheoreticalSpeed() {
    return Math.sqrt(2 * 9.8 * (startHeight / 100.0));
  }

  function updateStatus() {
    if (!isRunning && woodBlockX === 0) {
      setStatus(`【発進前】高さ ${startHeight}cm / 質量 ${cartMassMultiplier}倍。斜面を下るにつれて位置エネルギーが運動エネルギーへとすべて変換されます。「手をはなす」ボタンを押してください。`);
      return;
    }

    if (isRunning && cartProgress < 1.0) {
      setStatus(`【滑降中！】位置エネルギーが減少し、その分だけ運動エネルギー（速さ）が増加中！力学的エネルギーの総和は常に一定に保たれています。`);
      return;
    }

    if (woodSlideVelocity > 0 || (woodBlockX > 0 && !isRunning)) {
      setStatus(`【衝突・仕事の測定完了！】最下点速度: ${bottomSpeed.toFixed(2)} m/s ➔ 木片移動距離: 【 ${woodBlockX.toFixed(1)} cm 】！★高さが2倍になれば距離も2倍、質量が2倍になれば距離も2倍に比例します！`);
    }
  }

  renderControls();
  updateStatus();

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    if (isRunning) {
      if (cartProgress < 1.0) {
        const accel = 0.012 * Math.sqrt(startHeight / 20);
        cartProgress = Math.min(1.0, cartProgress + accel * (1 + cartProgress * 1.5));
        cartSpeed = getTheoreticalSpeed() * Math.sqrt(cartProgress);

        if (cartProgress >= 1.0) {
          bottomSpeed = getTheoreticalSpeed();
          cartSpeed = bottomSpeed;
          woodSlideVelocity = 0.45 * Math.sqrt(getTheoreticalDistance());
        }
      } else {
        if (woodSlideVelocity > 0) {
          woodBlockX += woodSlideVelocity * 0.4;
          woodSlideVelocity *= 0.94;
          const targetDist = getTheoreticalDistance();

          if (woodBlockX >= targetDist || woodSlideVelocity < 0.02) {
            woodBlockX = targetDist;
            woodSlideVelocity = 0.0;
            isRunning = false;
            renderControls();
            updateStatus();
          }
        }
      }
    }

    const rightPanelW = 250;
    const mainTrackW = w - rightPanelW - 35;

    // 1. 左側メイン：実験コース
    drawMotionTrack(15, 15, mainTrackW, h - 30);

    // 2. 右側パネル：2大比例グラフ
    drawPhysicsGraphs(w - rightPanelW - 15, 15, rightPanelW, h - 30);

    animId = requestAnimationFrame(render);
  }
  render();

  function drawMotionTrack(bx, by, bw, bh) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🏎️ 斜面台車の滑走と木片衝突実験", bx + 12, by + 20);

    drawEnergyConservationBar(bx + 12, by + 30, bw - 24, 24);

    const groundY = by + bh - 55;
    const slopeStartX = bx + 35;
    const slopeEndX = bx + bw * 0.42;
    const slopeStartY = groundY - (startHeight * 3.0);

    // レール
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(slopeStartX, slopeStartY);
    ctx.lineTo(slopeEndX, groundY);
    ctx.lineTo(bx + bw - 15, groundY);
    ctx.stroke();

    // 支柱
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(slopeStartX, slopeStartY);
    ctx.lineTo(slopeStartX, groundY);
    ctx.stroke();

    // 高さの矢印
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 1.5;
    drawArrow(slopeStartX - 10, groundY, slopeStartX - 10, slopeStartY, 4);
    drawArrow(slopeStartX - 10, slopeStartY, slopeStartX - 10, groundY, 4);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(`${startHeight}cm`, slopeStartX - 14, (slopeStartY + groundY) / 2 + 3);

    // 光電管（スピード測定器）
    const sensorX = slopeEndX + 12;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(sensorX - 6, groundY - 28, 12, 28);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(sensorX - 6, groundY - 28, 12, 28);

    ctx.strokeStyle = isRunning && cartProgress >= 0.95 ? "#ef4444" : "rgba(56, 189, 248, 0.4)";
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(sensorX, groundY - 24);
    ctx.lineTo(sensorX, groundY);
    ctx.stroke();
    ctx.setLineDash([]);

    // 速度デジタル表示板
    ctx.fillStyle = "#020617";
    ctx.fillRect(sensorX - 22, groundY - 58, 44, 20);
    ctx.strokeStyle = "#334155";
    ctx.strokeRect(sensorX - 22, groundY - 58, 44, 20);
    ctx.fillStyle = bottomSpeed > 0 ? "#4ade80" : "#64748b";
    ctx.font = "bold 10px monospace";
    ctx.textAlign = "center";
    ctx.fillText(bottomSpeed > 0 ? `${bottomSpeed.toFixed(2)}m/s` : "0.00m/s", sensorX, groundY - 44);

    // 台車の位置計算と描画（レール接地面のオフセットを完全調整）
    let cartX, cartY, cartAngle;
    if (cartProgress < 1.0) {
      cartX = slopeStartX + (slopeEndX - slopeStartX) * cartProgress;
      cartY = slopeStartY + (groundY - slopeStartY) * cartProgress;
      cartAngle = Math.atan2(groundY - slopeStartY, slopeEndX - slopeStartX);
    } else {
      const pushPixels = (woodBlockX / 40.0) * (bw * 0.42);
      cartX = slopeEndX + 45 + pushPixels;
      cartY = groundY;
      cartAngle = 0;
    }

    drawCart(cartX, cartY, cartAngle, cartMassMultiplier);

    // 木片
    const initialWoodX = slopeEndX + 50;
    const woodPx = (woodBlockX / 40.0) * (bw * 0.42);
    const currentWoodX = initialWoodX + woodPx;
    const woodW = 26, woodH = 20;

    ctx.fillStyle = "#b45309";
    ctx.fillRect(currentWoodX, groundY - woodH, woodW, woodH);
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(currentWoodX, groundY - woodH, woodW, woodH);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("木片", currentWoodX + woodW / 2, groundY - 7);

    // ものさし
    const rulerY = groundY + 8;
    const rulerW = bw * 0.48;
    ctx.fillStyle = "#fef08a";
    ctx.fillRect(initialWoodX, rulerY, rulerW, 12);
    ctx.strokeStyle = "#ca8a04";
    ctx.lineWidth = 1;
    ctx.strokeRect(initialWoodX, rulerY, rulerW, 12);

    ctx.fillStyle = "#78350f";
    ctx.font = "8px monospace";
    for (let cm = 0; cm <= 40; cm += 5) {
      const rx = initialWoodX + (cm / 40.0) * (bw * 0.42);
      if (rx <= initialWoodX + rulerW) {
        ctx.beginPath();
        ctx.moveTo(rx, rulerY);
        ctx.lineTo(rx, rulerY + (cm % 10 === 0 ? 6 : 3));
        ctx.stroke();
        if (cm % 10 === 0) {
          ctx.textAlign = "center";
          ctx.fillText(`${cm}`, rx, rulerY + 11);
        }
      }
    }

    // 移動距離の寸法線
    if (woodBlockX > 0) {
      const measureY = groundY - woodH - 18;
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(initialWoodX, measureY);
      ctx.lineTo(currentWoodX, measureY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(initialWoodX, measureY - 3); ctx.lineTo(initialWoodX, measureY + 3);
      ctx.moveTo(currentWoodX, measureY - 3); ctx.lineTo(currentWoodX, measureY + 3);
      ctx.stroke();

      ctx.fillStyle = "#ef4444";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`移動距離: ${woodBlockX.toFixed(1)} cm`, (initialWoodX + currentWoodX) / 2, measureY - 5);
    }
  }

  // 台車の描画（車輪がレールにぴったり乗るように接地Y座標を補正）
  function drawCart(x, y, angle, massMult) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    const cW = 38, cH = 18;
    const wheelR = 5;

    // レール表面（y=0）の上に車輪の最下点がぴったり来るよう、中心を -wheelR に持ち上げる
    ctx.translate(0, -wheelR);

    // 車体
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(-cW, -cH, cW, cH);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(-cW, -cH, cW, cH);

    // おもり
    if (massMult === 2) {
      ctx.fillStyle = "#ea580c";
      ctx.fillRect(-cW + 4, -cH - 12, cW - 8, 12);
      ctx.strokeStyle = "#f97316";
      ctx.strokeRect(-cW + 4, -cH - 12, cW - 8, 12);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 8px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("おもり", -cW / 2, -cH - 3);
    }

    // 車輪（レール表面 y=0 に接する）
    ctx.fillStyle = "#1e293b";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1;
    [-cW + 9, -9].forEach(wx => {
      ctx.beginPath();
      ctx.arc(wx, 0, wheelR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    ctx.restore();
  }

  function drawEnergyConservationBar(x, y, w, h) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x, y, w, h);

    const uRatio = cartProgress < 1.0 ? (1.0 - cartProgress) : 0.0;
    const kRatio = 1.0 - uRatio;

    const barW = w - 145;
    const barX = x + 135;

    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(barX, y + 3, barW * uRatio, h - 6);

    ctx.fillStyle = "#f43f5e";
    ctx.fillRect(barX + barW * uRatio, y + 3, barW * kRatio, h - 6);

    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillStyle = "#facc15";
    ctx.fillText("力学的エネルギー保存:", x + 8, y + 16);

    ctx.fillStyle = "#ffffff";
    ctx.fillText(`位置:${(uRatio * 100).toFixed(0)}%`, barX + 6, y + 16);

    ctx.textAlign = "right";
    ctx.fillText(`運動:${(kRatio * 100).toFixed(0)}%`, barX + barW - 6, y + 16);
  }

  function drawPhysicsGraphs(gx, gy, gw, gh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(gx, gy, gw, gh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(gx, gy, gw, gh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📊 2大比例関係グラフ", gx + 10, gy + 16);

    const graphAreaH = gh - 35;
    const halfH = graphAreaH / 2;

    // 上段：高さ vs 移動距離
    drawGraph1(gx + 32, gy + 38, gw - 46, halfH - 32);

    // 下段：速さ vs 移動距離
    drawGraph2(gx + 32, gy + halfH + 28, gw - 46, halfH - 36);
  }

  // グラフ1：高さ vs 移動距離（プロット点を線上に吸着）
  function drawGraph1(x, y, w, h) {
    ctx.strokeStyle = "rgba(51, 65, 85, 0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h);
    ctx.stroke();

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("【比例】高さ vs 木片移動距離", x, y - 6);

    // 理論直線（原点 (x, y+h) から (x+w, y) へ）
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + w, y);
    ctx.stroke();

    // プロット点：直線上の正規化座標 (ratio = h / 40.0)
    const ratio = startHeight / 40.0;
    const px = x + ratio * w;
    const py = y + h - ratio * h; // 直線にぴったり一致

    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(px, py, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = "#94a3b8";
    ctx.font = "8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("高さ(cm)", x + w / 2, y + h + 10);
  }

  // グラフ2：速さ vs 移動距離（プロット点を放物線上に吸着）
  function drawGraph2(x, y, w, h) {
    ctx.strokeStyle = "rgba(51, 65, 85, 0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h);
    ctx.stroke();

    ctx.fillStyle = "#f43f5e";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("【2乗比例】速さ vs 木片移動距離", x, y - 6);

    // 2乗放物線：原点 (x, y+h) から (x+w, y) へ
    ctx.strokeStyle = "#f97316";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 30; i++) {
      const r = i / 30.0;
      const gx = x + r * w;
      const gy = y + h - (r * r) * h;
      if (i === 0) ctx.moveTo(gx, gy);
      else ctx.lineTo(gx, gy);
    }
    ctx.stroke();

    // プロット点：放物線上の正規化座標 (vMax = sqrt(40cm) = 2.8m/s)
    const curSpeed = getTheoreticalSpeed();
    const maxSpeed = Math.sqrt(2 * 9.8 * 0.40); // 40cmでの最大速度
    const rSpeed = Math.min(1.0, curSpeed / maxSpeed);

    const px = x + rSpeed * w;
    const py = y + h - (rSpeed * rSpeed) * h; // 放物線にぴったり一致

    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(px, py, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = "#94a3b8";
    ctx.font = "8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("速さ(m/s)", x + w / 2, y + h + 10);
  }

  function drawArrow(x1, y1, x2, y2, size) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle - Math.PI / 6), y2 - size * Math.sin(angle - Math.PI / 6));
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle + Math.PI / 6), y2 - size * Math.sin(angle + Math.PI / 6));
    ctx.stroke();
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
    }
  };
}



































































































// ===================================================================
// 【教科書・正解図完全準拠版】月の満ち欠けと天体の位置関係 (中3・地球)
// ===================================================================
function initC3Moon(canvas) {
  const ctx = canvas.getContext('2d');

  // --- 実験パラメータ ---
  let moonAngle = 90;             // 現在の月の角度 (0°〜360°)
  let targetMoonAngle = null;     // 目標角度（ボタンクリック時のスムーズ移動用）
  let observerTime = 18;          // 観測時刻 (12:昼, 18:夕方, 0:真夜中, 6:明け方)
  let isAutoOrbit = false;        // 自動公転
  let eclipseMode = 'none';       // 'none', 'solar', 'lunar'
  let animId;

  const controls = document.getElementById('labControlsArea');

  // 初回のみコントロールのHTMLを構築（スライダー操作が途切れないようにするため）
  function initControls() {
    controls.innerHTML = `
      <div class="ctrl-group" style="grid-column: 1 / -1;">
        <label>1. 代表的な月の形（月相）へジャンプ:</label>
        <div id="phaseBtns" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap:6px;">
          <button class="btn-action secondary" data-deg="0" style="padding:6px; font-size:11px;">新月 (0°)</button>
          <button class="btn-action secondary" data-deg="45" style="padding:6px; font-size:11px;">三日月 (45°)</button>
          <button class="btn-action secondary" data-deg="90" style="padding:6px; font-size:11px;">上弦 (90°)</button>
          <button class="btn-action secondary" data-deg="135" style="padding:6px; font-size:11px;">上弦〜満月 (135°)</button>
          <button class="btn-action secondary" data-deg="180" style="padding:6px; font-size:11px;">満月 (180°)</button>
          <button class="btn-action secondary" data-deg="225" style="padding:6px; font-size:11px;">満月〜下弦 (225°)</button>
          <button class="btn-action secondary" data-deg="270" style="padding:6px; font-size:11px;">下弦 (270°)</button>
          <button class="btn-action secondary" data-deg="315" style="padding:6px; font-size:11px;">有明月 (315°)</button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>2. 月の公転位置: <span id="mDegVal" class="ctrl-val">90°</span></label>
        <input type="range" id="mRange" min="0" max="360" step="1" value="90" style="width:100%; cursor:pointer;">
      </div>

      <div class="ctrl-group">
        <label>3. 地上の観測時刻（地球の自転）:</label>
        <div id="timeBtns" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px;">
          <button class="btn-action secondary" data-time="12" style="padding:6px 2px; font-size:11px;">昼(12時)</button>
          <button class="btn-action secondary" data-time="18" style="padding:6px 2px; font-size:11px;">夕方(18時)</button>
          <button class="btn-action secondary" data-time="0" style="padding:6px 2px; font-size:11px;">真夜中(0時)</button>
          <button class="btn-action secondary" data-time="6" style="padding:6px 2px; font-size:11px;">明け方(6時)</button>
        </div>
      </div>

      <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn-action" id="bAutoOrbit" style="flex:1.2;">公転アニメーション再生 ▶️</button>
        <button class="btn-action secondary" id="bSolar" style="flex:1;">日食モード 🌑</button>
        <button class="btn-action secondary" id="bLunar" style="flex:1;">月食モード 🌕</button>
        <button class="btn-action secondary" id="bResetMoon" style="flex:1;">リセット 🔄</button>
      </div>
    `;

    // スライダー操作（DOMを再構築せず値だけ即座に反映）
    const mRange = document.getElementById('mRange');
    mRange.addEventListener('input', (e) => {
      targetMoonAngle = null; // スライダー操作時は目標移動をキャンセル
      isAutoOrbit = false;
      eclipseMode = 'none';
      moonAngle = parseFloat(e.target.value);
      syncControlUI();
      updateStatus();
    });

    // 月相ジャンプボタン（スムーズに目標角度へ移動）
    document.querySelectorAll('#phaseBtns button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const deg = parseInt(btn.dataset.deg, 10);
        setPhaseSmooth(deg);
      });
    });

    // 観測時刻ボタン
    document.querySelectorAll('#timeBtns button').forEach((btn) => {
      btn.addEventListener('click', () => {
        observerTime = parseInt(btn.dataset.time, 10);
        syncControlUI();
        updateStatus();
      });
    });

    // 自動公転ボタン
    document.getElementById('bAutoOrbit').addEventListener('click', () => {
      isAutoOrbit = !isAutoOrbit;
      if (isAutoOrbit) targetMoonAngle = null;
      syncControlUI();
    });

    // 日食モード
    document.getElementById('bSolar').addEventListener('click', () => {
      setPhaseSmooth(0);
      observerTime = 12;
      eclipseMode = 'solar';
      syncControlUI();
      updateStatus();
    });

    // 月食モード
    document.getElementById('bLunar').addEventListener('click', () => {
      setPhaseSmooth(180);
      observerTime = 0;
      eclipseMode = 'lunar';
      syncControlUI();
      updateStatus();
    });

    // リセット
    document.getElementById('bResetMoon').addEventListener('click', resetLab);

    syncControlUI();
  }

  // UIの表示状態（スライダー値・ボタン色）だけを軽量更新
  function syncControlUI() {
    const curAngle = ((Math.round(moonAngle) % 360) + 360) % 360;
    const activeDeg = targetMoonAngle !== null ? targetMoonAngle : curAngle;

    const mRange = document.getElementById('mRange');
    const mDegVal = document.getElementById('mDegVal');
    if (mRange && document.activeElement !== mRange) {
      mRange.value = curAngle;
    }
    if (mDegVal) {
      mDegVal.textContent = `${curAngle}°`;
    }

    // 月相ボタンのハイライト更新
    document.querySelectorAll('#phaseBtns button').forEach((btn) => {
      const d = parseInt(btn.dataset.deg, 10);
      const isSelected = (d === activeDeg);
      btn.classList.toggle('secondary', !isSelected);
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';

      if (isSelected) {
        if (d === 90 || d === 270) {
          btn.style.background = '#0d9488';
          btn.style.borderColor = '#0d9488';
        } else if (d === 180) {
          btn.style.background = '#eab308';
          btn.style.borderColor = '#eab308';
          btn.style.color = '#000';
        }
      }
    });

    // 観測時刻ボタンのハイライト更新
    document.querySelectorAll('#timeBtns button').forEach((btn) => {
      const t = parseInt(btn.dataset.time, 10);
      const isSelected = (t === observerTime);
      btn.classList.toggle('secondary', !isSelected);
      btn.style.background = '';
      btn.style.borderColor = '';

      if (isSelected) {
        if (t === 18) { btn.style.background = '#ea580c'; btn.style.borderColor = '#ea580c'; }
        if (t === 0)  { btn.style.background = '#1e1b4b'; btn.style.borderColor = '#818cf8'; }
        if (t === 6)  { btn.style.background = '#0284c7'; btn.style.borderColor = '#0284c7'; }
      }
    });

    // 自動公転・日食・月食ボタン更新
    const bAuto = document.getElementById('bAutoOrbit');
    bAuto.classList.toggle('secondary', isAutoOrbit);
    bAuto.style.background = !isAutoOrbit ? '#10b981' : '';
    bAuto.style.borderColor = !isAutoOrbit ? '#10b981' : '';
    bAuto.textContent = isAutoOrbit ? '公転停止 ⏸️' : '公転アニメーション再生 ▶️';

    const bSolar = document.getElementById('bSolar');
    bSolar.classList.toggle('secondary', eclipseMode !== 'solar');
    bSolar.style.background = eclipseMode === 'solar' ? '#ef4444' : '';
    bSolar.style.borderColor = eclipseMode === 'solar' ? '#ef4444' : '';

    const bLunar = document.getElementById('bLunar');
    bLunar.classList.toggle('secondary', eclipseMode !== 'lunar');
    bLunar.style.background = eclipseMode === 'lunar' ? '#b91c1c' : '';
    bLunar.style.borderColor = eclipseMode === 'lunar' ? '#b91c1c' : '';
  }

  // 目標角度へスムーズに移動させる
  function setPhaseSmooth(deg) {
    targetMoonAngle = ((deg % 360) + 360) % 360;
    isAutoOrbit = false;
    eclipseMode = 'none';
    syncControlUI();
  }

  function resetLab() {
    setPhaseSmooth(90);
    observerTime = 18;
    syncControlUI();
    updateStatus();
  }

  // ==========================================
  // 月の形・方角判定ロジック
  // ==========================================
  function getMoonInfo() {
    const deg = ((moonAngle % 360) + 360) % 360;
    let name = "月";
    let desc = "";

    if (deg >= 345 || deg <= 15) {
      name = "新月（朔）";
      desc = "太陽と同じ方向にあり、影の面を地球に向けているため肉眼では見えません。";
    } else if (deg > 15 && deg < 75) {
      name = "三日月";
      desc = "夕方に西の空に見え、右側が細く光る弓状の月です。日没後まもなく沈みます。";
    } else if (deg >= 75 && deg <= 105) {
      name = "上弦の月（半月）";
      desc = "夕方に南中し、右半分が輝く半月です。真夜中（0時）に西の地平線へ沈みます。";
    } else if (deg > 105 && deg < 165) {
      name = "上弦〜満月（太った月）";
      desc = "夕方、東〜南東の空から昇り、夜遅くまで空を明るく照らします。";
    } else if (deg >= 165 && deg <= 195) {
      name = "満月（望）";
      desc = "太陽の真反対に位置し、全面が輝きます。夕方東から昇り、真夜中南中し、明け方西に沈みます。";
    } else if (deg > 195 && deg < 255) {
      name = "満月〜下弦（太った月）";
      desc = "夜遅く東の空から昇り、午前中の西の青空にも白く残ります。";
    } else if (deg >= 255 && deg <= 285) {
      name = "下弦の月（半月）";
      desc = "真夜中に東から昇り、明け方に南中します。左半分が光る半月です。";
    } else {
      name = "有明月（逆三日月）";
      desc = "明け方の東の空に左側が細く光って昇る月です。まもなく夜明けを迎えます。";
    }

    const obsAngle = ((observerTime - 12) / 24) * 360;
    let diff = deg - obsAngle;
    while (diff > 180) diff -= 360;
    while (diff < -180) diff += 360;

    let visibility = "見えない（地平線の下）";
    if (diff >= -90 && diff <= 90) {
      if (diff < -20) {
        visibility = "西の空（沈みかけている）";
      } else if (diff > 20) {
        visibility = "東の空（昇ってきた）";
      } else {
        visibility = "南の空（南中！）";
      }
    }

    return { name, desc, visibility, deg, relAngle: diff };
  }

  function updateStatus() {
    const info = getMoonInfo();
    const timeLabel = { 12: "昼(12時)", 18: "夕方(18時)", 0: "真夜中(0時)", 6: "明け方(6時)" }[observerTime];

    if (eclipseMode === 'solar') {
      setStatus("【日食発生！】新月のとき、太陽・月・地球が一直線に並び、月が太陽を隠します。地球上の狭い地域で太陽が欠けて見えます！");
      return;
    }
    if (eclipseMode === 'lunar') {
      setStatus("【月食発生！】満月のとき、太陽・地球・月が一直線に並び、地球の影の中に月がすっぽり入ります。月が赤黒く（赤銅色に）光ります！");
      return;
    }

    setStatus(`【${info.name}】現在時刻『${timeLabel}』➔ 観測結果：【 ${info.visibility} 】！${info.desc}`);
  }

  initControls();
  updateStatus();

  // ==========================================
  // メイン描画ループ
  // ==========================================
  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    // 1. 自動公転アニメーション
    if (isAutoOrbit) {
      moonAngle = (moonAngle + 0.4) % 360;
      syncControlUI();
      if (Math.random() < 0.08) updateStatus();
    }

    // 2. ボタンクリック時のスムーズ移動（イージング処理）
    if (targetMoonAngle !== null) {
      // 最短の回転方向（-180° 〜 +180°）を計算
      let diff = ((targetMoonAngle - moonAngle + 540) % 360) - 180;

      if (Math.abs(diff) < 0.3) {
        // 目標角度に到達したらピタッと止める
        moonAngle = targetMoonAngle;
        targetMoonAngle = null;
        syncControlUI();
        updateStatus();
      } else {
        // 差分の12%ずつ近づける（減速しながら滑らかに移動）
        moonAngle = (moonAngle + diff * 0.12 + 360) % 360;
        syncControlUI();
        updateStatus();
      }
    }

    const halfW = (w - 30) / 2;
    drawCosmicView(15, 15, halfW, h - 30);
    drawEarthSkyView(15 + halfW + 10, 15, halfW, h - 30);

    animId = requestAnimationFrame(render);
  }
  render();

  // ----------------------------------------------------
  // 左画面：宇宙からの俯瞰図
  // ----------------------------------------------------
  function drawCosmicView(bx, by, bw, bh) {
    ctx.fillStyle = "#090d16";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🔭 宇宙から見下ろした図（常に右半分が光る）", bx + 12, by + 22);

    const cx = bx + bw * 0.45;
    const cy = by + bh / 2 + 10;
    const orbitR = Math.min(bw * 0.35, bh * 0.35);

    const sunColor = eclipseMode === 'solar' ? "rgba(239, 68, 68, 0.4)" : "rgba(250, 204, 21, 0.35)";
    ctx.strokeStyle = sunColor;
    ctx.lineWidth = 1.5;
    for (let i = -3; i <= 3; i++) {
      const ly = cy + i * 28;
      ctx.beginPath();
      ctx.moveTo(bx + bw - 10, ly);
      ctx.lineTo(bx + bw - 60, ly);
      ctx.stroke();
      drawArrow(bx + bw - 10, ly, bx + bw - 55, ly, 4);
    }
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("太陽光 ⬅", bx + bw - 10, cy - 95);

    ctx.strokeStyle = "rgba(100, 116, 139, 0.45)";
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    drawOrbitArrow(cx, cy, orbitR, -Math.PI * 0.25);
    drawOrbitArrow(cx, cy, orbitR, -Math.PI * 1.25);

    const earthR = 24;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, earthR, 0, Math.PI * 2);
    ctx.fillStyle = "#0284c7";
    ctx.fill();
    ctx.clip();

    ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
    ctx.fillRect(cx - earthR, cy - earthR, earthR, earthR * 2);
    ctx.restore();

    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, earthR, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("北極", cx, cy + 3);

    drawObserverOnEarth(cx, cy, earthR);

    const rad = (moonAngle * Math.PI) / 180;
    const mx = cx + Math.cos(rad) * orbitR;
    const my = cy - Math.sin(rad) * orbitR;
    const moonR = 12;

    if (eclipseMode === 'lunar') {
      ctx.fillStyle = "rgba(220, 38, 38, 0.25)";
      ctx.beginPath();
      ctx.moveTo(cx, cy - earthR);
      ctx.lineTo(cx - orbitR - 30, cy - earthR * 1.5);
      ctx.lineTo(cx - orbitR - 30, cy + earthR * 1.5);
      ctx.lineTo(cx, cy + earthR);
      ctx.fill();
    }

    drawCosmicMoonBall(mx, my, moonR);

    ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawCosmicMoonBall(x, y, r) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "#1e293b";
    ctx.fill();
    ctx.clip();

    ctx.fillStyle = eclipseMode === 'lunar' ? "#b91c1c" : "#fef08a";
    ctx.fillRect(x, y - r, r, r * 2);
    ctx.restore();

    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawObserverOnEarth(cx, cy, r) {
    const timeRad = (((observerTime - 12) / 24) * 360 * Math.PI) / 180;
    const ox = cx + Math.cos(timeRad) * (r + 4);
    const oy = cy - Math.sin(timeRad) * (r + 4);

    ctx.fillStyle = "#f43f5e";
    ctx.beginPath();
    ctx.arc(ox, oy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(-timeRad);

    ctx.strokeStyle = "rgba(74, 222, 128, 0.7)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(0, 18);
    ctx.stroke();

    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("南", 12, 3);
    ctx.fillText("東", 0, -20);
    ctx.fillText("西", 0, 25);
    ctx.restore();
  }

  function drawOrbitArrow(cx, cy, r, angle) {
    const ax = cx + Math.cos(angle) * r;
    const ay = cy + Math.sin(angle) * r;
    const tanAngle = angle - Math.PI / 2;
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 6 * Math.cos(tanAngle - 0.4), ay - 6 * Math.sin(tanAngle - 0.4));
    ctx.lineTo(ax - 6 * Math.cos(tanAngle + 0.4), ay - 6 * Math.sin(tanAngle + 0.4));
    ctx.fill();
  }

  // ----------------------------------------------------
  // 右画面：地球から見上げた実際の月
  // ----------------------------------------------------
  function drawEarthSkyView(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    const info = getMoonInfo();

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("👁️ 地球から見上げた実際の月", bx + 12, by + 22);

    const mcx = bx + bw / 2;
    const mcy = by + 90;
    const mr = 44;

    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    for (let i = 0; i < 15; i++) {
      const sx = bx + 15 + ((i * 37) % (bw - 30));
      const sy = by + 35 + ((i * 23) % 110);
      ctx.fillRect(sx, sy, 1.2, 1.2);
    }

    drawPhaseMoon(mcx, mcy, mr, info.deg);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(info.name, mcx, by + 155);

    drawObserverNavBoard(bx + 10, by + 168, bw - 20, bh - 178, info);
  }

 // 地球から見た満ち欠けの描画（反転バグ完全解消版）
  function drawPhaseMoon(cx, cy, r, deg) {
    ctx.save();

    // 1. 月全体のベース（影側）
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = "#0f172a";
    ctx.fill();
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const normDeg = ((deg % 360) + 360) % 360;
    const brightColor = eclipseMode === 'lunar' ? "#b91c1c" : (eclipseMode === 'solar' ? "#0f172a" : "#fef08a");
    ctx.fillStyle = brightColor;

    // 新月(0°) または 日食
    if (normDeg === 0 || eclipseMode === 'solar') {
      ctx.restore();
      return;
    }

    // 満月(180°)
    if (normDeg === 180) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }

    const cosVal = Math.cos((normDeg * Math.PI) / 180);
    const absW = Math.abs(cosVal) * r;

    ctx.beginPath();

    if (normDeg > 0 && normDeg < 180) {
      // ■ 0°〜180°: 右半分が基本光る（三日月・上弦・凸月）
      // 12時 → 6時 へ右半円を描く
      ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2, false);

      if (normDeg < 90) {
        // 【三日月 (0°〜90°)】
        // 境界線を右側へくぼませて「細い三日月」にする (true: 反時計回り)
        ctx.ellipse(cx, cy, absW, r, 0, Math.PI / 2, -Math.PI / 2, true);
      } else {
        // 【上弦〜満月 (90°〜180°)】
        // 境界線を左側へ膨らませて「太った凸月」にする (false: 時計回り)
        ctx.ellipse(cx, cy, absW, r, 0, Math.PI / 2, -Math.PI / 2, false);
      }
    } else {
      // ■ 180°〜360°: 左半分が基本光る（凸月・下弦・有明月）
      // 6時 → 12時 へ左半円を描く
      ctx.arc(cx, cy, r, Math.PI / 2, -Math.PI / 2, false);

      if (normDeg < 270) {
        // 【満月〜下弦 (180°〜270°)】
        // 境界線を右側へ膨らませて「太った凸月」にする (false: 時計回り)
        ctx.ellipse(cx, cy, absW, r, 0, -Math.PI / 2, Math.PI / 2, false);
      } else {
        // 【有明月 (270°〜360°)】
        // 境界線を左側へくぼませて「細い逆三日月」にする (true: 反時計回り)
        ctx.ellipse(cx, cy, absW, r, 0, -Math.PI / 2, Math.PI / 2, true);
      }
    }

    ctx.closePath();
    ctx.fill();

    if (eclipseMode === 'lunar') {
      ctx.fillStyle = "rgba(185, 28, 28, 0.6)";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawObserverNavBoard(x, y, w, h, info) {
    ctx.fillStyle = "#090d16";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x, y, w, h);

    const timeLabel = { 12: "昼(12時)", 18: "夕方(18時)", 0: "真夜中(0時)", 6: "明け方(6時)" }[observerTime];

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`📍 観測時刻：${timeLabel} の空`, x + 8, y + 15);

    ctx.font = "bold 11px sans-serif";
    ctx.fillStyle = info.visibility.includes("南中") ? "#facc15" : (info.visibility.includes("空") ? "#4ade80" : "#64748b");
    ctx.fillText(`見える方角 ➔ 【 ${info.visibility} 】`, x + 8, y + 33);

    const riseHour = (Math.round((info.deg / 15) + 6) % 24);
    const southHour = (Math.round((info.deg / 15) + 12) % 24);
    const setHour = (Math.round((info.deg / 15) + 18) % 24);

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "9px sans-serif";
    ctx.fillText(`・月の出（東）: 約 ${riseHour} 時ごろ`, x + 8, y + 50);
    ctx.fillText(`・南中（南） : 約 ${southHour} 時ごろ（最高高度）`, x + 8, y + 64);
    ctx.fillText(`・月の入り（西）: 約 ${setHour} 時ごろ`, x + 8, y + 78);
  }

  function drawArrow(x1, y1, x2, y2, size) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle - Math.PI / 6), y2 - size * Math.sin(angle - Math.PI / 6));
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle + Math.PI / 6), y2 - size * Math.sin(angle + Math.PI / 6));
    ctx.stroke();
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
    }
  };
}









































































































// ===================================================================
// 【密集防止＆適正ピラミッド調整版】生態系と食物連鎖 (中3・環境)
// ===================================================================
function initC3Foodweb(canvas) {
  const ctx = canvas.getContext('2d');

  // --- ゲーム＆生態系状態 ---
  let isRunning = true;
  let clickTool = 'rabbit';
  let ecoScore = 0;
  let ecoStatusTitle = "調和のとれた草原";
  let tick = 0;
  let animId;

  const plants = [];
  const herbivores = [];
  const carnivores = [];
  const decomposers = [];
  const deadRemains = [];
  const co2Particles = [];

  const history = [];
  const maxHistory = 140;

  function getFieldBounds(bw, bh) {
    return {
      fx: 25,
      fy: 48,
      fw: bw - 50,
      fh: bh - 120
    };
  }

  function spawnPlant(count = 1, atPos = null) {
    const { fx, fy, fw, fh } = getFieldBounds(canvas.width - 260, canvas.height);
    for (let i = 0; i < count; i++) {
      const px = atPos ? atPos.x + (Math.random() - 0.5) * 20 : fx + 15 + Math.random() * (fw - 30);
      const py = atPos ? atPos.y + (Math.random() - 0.5) * 20 : fy + 15 + Math.random() * (fh - 30);
      plants.push({
        x: Math.max(fx + 10, Math.min(fx + fw - 10, px)),
        y: Math.max(fy + 10, Math.min(fy + fh - 10, py)),
        size: 3.5
      });
    }
  }

  function spawnRabbit(count = 1, atPos = null) {
    const { fx, fy, fw, fh } = getFieldBounds(canvas.width - 260, canvas.height);
    for (let i = 0; i < count; i++) {
      const rx = atPos ? atPos.x : fx + 25 + Math.random() * (fw - 50);
      const ry = atPos ? atPos.y : fy + 25 + Math.random() * (fh - 50);
      herbivores.push({
        x: Math.max(fx + 10, Math.min(fx + fw - 10, rx)),
        y: Math.max(fy + 10, Math.min(fy + fh - 10, ry)),
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        energy: 110,
        panic: 0,
        age: 0
      });
    }
  }

  function spawnFox(count = 1, atPos = null) {
    const { fx, fy, fw, fh } = getFieldBounds(canvas.width - 260, canvas.height);
    for (let i = 0; i < count; i++) {
      // 画面全体に散らしてスポーン（左上集中を回避）
      const fxPos = atPos ? atPos.x : fx + 40 + Math.random() * (fw - 80);
      const fyPos = atPos ? atPos.y : fy + 40 + Math.random() * (fh - 80);
      carnivores.push({
        x: Math.max(fx + 10, Math.min(fx + fw - 10, fxPos)),
        y: Math.max(fy + 10, Math.min(fy + fh - 10, fyPos)),
        vx: (Math.random() - 0.5) * 0.6,
