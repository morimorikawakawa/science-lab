        const restX = (fx + fw) - curX;
        ctx.lineTo(fx + fw, curY + (dy / 40) * restX);
        break;
      }
      curX += stepX;
      curY = targetY;
      ctx.lineTo(curX, curY);
      dy *= -1; // 全反射で向き反転
    }
    ctx.stroke();

    // 光源
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(startX, startY, 8, 0, Math.PI * 2);
    ctx.fill();

    setStatus("【光ファイバーの全反射】管の内側の壁で『光が100%全反射をくり返す』ため、光が外に漏れずエネルギーを保ったまま遠くまで届きます。内視鏡（胃カメラ）や高速インターネット通信の心臓部です！");
  }

  // --- 4. 浮き上がるコインモード（身近な屈折現象） ---
  function drawCoinMode(w, h) {
    const cx = w / 2, cy = h / 2 + 10;
    const tw = 260, th = 150;
    const tx = cx - tw / 2, ty = cy - th / 2;

    // ビーカーと水
    ctx.fillStyle = "rgba(14, 165, 233, 0.22)";
    ctx.fillRect(tx, ty + 30, tw, th - 30);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 4;
    ctx.strokeRect(tx, ty, tw, th);

    // 水面
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx, ty + 30); ctx.lineTo(tx + tw, ty + 30); ctx.stroke();
    ctx.fillStyle = "#38bdf8";
    ctx.font = "12px sans-serif";
    ctx.fillText("水面", tx + 10, ty + 25);

    // 本物のコイン（底）
    const realCoinX = cx - 40;
    const realCoinY = ty + th - 12;
    ctx.fillStyle = "#eab308";
    ctx.beginPath();
    ctx.ellipse(realCoinX, realCoinY, 22, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ca8a04";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.fillText("実際のコイン（水底）", realCoinX - 55, realCoinY + 20);

    // 目の位置（右斜め上）
    const eyeX = tx + tw + 35;
    const eyeY = ty - 40;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText("👁️ 目", eyeX - 10, eyeY - 10);

    // 水面での屈折点
    const refrPointX = cx + 25;
    const refrPointY = ty + 30;

    // 実光線（コイン → 水面屈折点 → 目）
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(realCoinX, realCoinY);
    ctx.lineTo(refrPointX, refrPointY);
    ctx.lineTo(eyeX, eyeY);
    ctx.stroke();

    // 脳が錯覚する見かけの直線（破線）
    const dx = eyeX - refrPointX;
    const dy = eyeY - refrPointY;
    const apparentCoinX = refrPointX - dx * 0.55;
    const apparentCoinY = refrPointY - dy * 0.55;

    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "#a855f7";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(eyeX, eyeY);
    ctx.lineTo(apparentCoinX, apparentCoinY);
    ctx.stroke();
    ctx.setLineDash([]);

    // 浮き上がって見える見かけのコイン（虚像）
    ctx.fillStyle = "rgba(250, 204, 21, 0.6)";
    ctx.beginPath();
    ctx.ellipse(apparentCoinX, apparentCoinY, 22, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d8b4fe";
    ctx.stroke();

    ctx.fillStyle = "#d8b4fe";
    ctx.fillText("浮き上がって見える位置（虚像）", apparentCoinX - 80, apparentCoinY - 14);

    setStatus("【なぜ水中の物は浅く見える？】コインから出た光が水面で折れ曲がって（屈折して）目に届きます。しかし人間の脳は『光はまっすぐ直進してくる』と錯覚するため、光線の延長線上の浅い位置に像（虚像）が浮き上がって見えます！");
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
      canvas.onmousedown = null;
      window.onmousemove = null;
      window.onmouseup = null;
    }
  };
}









// ========================================================
// 【本格光学台＆4大改良版】凸レンズの光学ベンチ (中1・エネルギー)
// ========================================================
function initC1Lens(canvas) {
  const ctx = canvas.getContext('2d');
  
  // 実験パラメータ
  const f = 15;             // 焦点距離 (15cm)
  let objDist = 30;         // 光源とレンズの距離 (初期値: 2f = 30cm)
  let screenDist = 30;      // レンズとスクリーンの距離 (手動調整)
  let coverHalf = false;    // レンズ上半分を覆うか
  let showRays = true;      // 光線表示の切り替え
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>1. 光源（Fの文字）とレンズの距離: <span id="distVal" class="ctrl-val">${objDist} cm</span> (焦点 f = ${f} cm)</label>
      <input type="range" id="distRange" min="5" max="45" value="${objDist}">
    </div>
    <div class="ctrl-group">
      <label>2. スクリーンを動かしてピントを合わせる: <span id="scrVal" class="ctrl-val">${screenDist} cm</span></label>
      <input type="range" id="scrRange" min="10" max="50" value="${screenDist}">
    </div>
    <div class="ctrl-group" style="grid-column: 1 / -1;">
      <label>3. 発展検証・表示設定:</label>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn-action ${coverHalf?'':'secondary'}" id="bCover">${coverHalf?'厚紙を外す':'レンズの上半分を黒い厚紙で覆う 📄'}</button>
        <button class="btn-action ${showRays?'':'secondary'}" id="bRay">${showRays?'光線を隠す':'光線を表示する 💡'}</button>
      </div>
    </div>
  `;

  document.getElementById('distRange').oninput = (e) => {
    objDist = parseInt(e.target.value);
    document.getElementById('distVal').textContent = `${objDist} cm`;
  };
  document.getElementById('scrRange').oninput = (e) => {
    screenDist = parseInt(e.target.value);
    document.getElementById('scrVal').textContent = `${screenDist} cm`;
  };
  document.getElementById('bCover').onclick = () => {
    coverHalf = !coverHalf;
    document.getElementById('bCover').className = `btn-action ${coverHalf?'':'secondary'}`;
    document.getElementById('bCover').textContent = coverHalf ? '厚紙を外す' : 'レンズの上半分を黒い厚紙で覆う 📄';
  };
  document.getElementById('bRay').onclick = () => {
    showRays = !showRays;
    document.getElementById('bRay').className = `btn-action ${showRays?'':'secondary'}`;
    document.getElementById('bRay').textContent = showRays ? '光線を隠す' : '光線を表示する 💡';
  };

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const cy = h / 2 - 20; // 光軸の高さ
    const cx = w / 2 - 40; // レンズの位置
    const scale = 5.5;      // 1cmあたりのpxスケール

    // 光軸（水平ライン）
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(20, cy);
    ctx.lineTo(w - 20, cy);
    ctx.stroke();

    // 焦点 F, 2F の目印
    ctx.fillStyle = "#facc15";
    ctx.font = "11px sans-serif";
    [-f, f].forEach(df => {
      ctx.beginPath();
      ctx.arc(cx + df * scale, cy, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillText("F", cx + df * scale - 4, cy + 18);
    });
    [-2 * f, 2 * f].forEach(df => {
      ctx.beginPath();
      ctx.arc(cx + df * scale, cy, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillText("2F", cx + df * scale - 7, cy + 18);
    });

    // 凸レンズの描画
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 90);
    ctx.lineTo(cx, cy + 90);
    ctx.stroke();

    // レンズ上半分を覆う厚紙
    if (coverHalf) {
      ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
      ctx.fillRect(cx - 8, cy - 90, 16, 90);
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.strokeRect(cx - 8, cy - 90, 16, 90);
      ctx.fillStyle = "#ef4444";
      ctx.font = "10px sans-serif";
      ctx.fillText("厚紙", cx - 12, cy - 95);
    }

    // 光源（Fの文字）の配置
    const objX = cx - objDist * scale;
    const objH = 40; // 光源の高さ
    drawLetterF(objX, cy, objH, false, false, 1.0);

    // 結像計算
    const isReal = objDist > f;
    const isFocus = objDist === f;
    let perfectImgDist = 0;
    let magRatio = 1;

    if (isReal) {
      perfectImgDist = (f * objDist) / (objDist - f);
      magRatio = perfectImgDist / objDist;
    }

    // スクリーンの描画（白い縦板）
    const scrX = cx + screenDist * scale;
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(scrX - 3, cy - 95, 6, 190);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px sans-serif";
    ctx.fillText("スクリーン", scrX - 25, cy + 110);

    // --- 光線の描画（showRaysが有効な場合） ---
    if (showRays && !isFocus) {
      ctx.lineWidth = 1.5;
      if (isReal) {
        const pImgX = cx + perfectImgDist * scale;
        const pImgH = objH * magRatio;

        // 1. 光軸に平行な光線（覆われていなければ表示）
        if (!coverHalf) {
          ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
          ctx.beginPath();
          ctx.moveTo(objX, cy - objH);
          ctx.lineTo(cx, cy - objH);
          ctx.lineTo(pImgX, cy + pImgH);
          ctx.stroke();
        }
        // 2. レンズの中心を通る光線（厚紙で覆われても通過する）
        ctx.strokeStyle = "rgba(56, 189, 248, 0.6)";
        ctx.beginPath();
        ctx.moveTo(objX, cy - objH);
        ctx.lineTo(cx, cy);
        ctx.lineTo(pImgX, cy + pImgH);
        ctx.stroke();

        // 3. 手前の焦点を通って平行になる光線
        ctx.strokeStyle = "rgba(34, 197, 94, 0.5)";
        ctx.beginPath();
        ctx.moveTo(objX, cy - objH);
        ctx.lineTo(cx, cy + (objH * (f / (objDist - f))));
        ctx.lineTo(pImgX, cy + pImgH);
        ctx.stroke();
      } else {
        // 虚像の光線追跡
        const vImgDist = (f * objDist) / (f - objDist);
        const vMag = vImgDist / objDist;
        const vImgX = cx - vImgDist * scale;
        const vImgH = objH * vMag;

        // 実光線（右へ拡散）
        ctx.strokeStyle = "rgba(250, 204, 21, 0.4)";
        ctx.beginPath();
        if (!coverHalf) {
          ctx.moveTo(objX, cy - objH);
          ctx.lineTo(cx, cy - objH);
          ctx.lineTo(cx + 100, cy - objH + (100 / f) * (objH));
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
        ctx.beginPath();
        ctx.moveTo(objX, cy - objH);
        ctx.lineTo(cx + 100, cy + (100 / objDist) * (objH));
        ctx.stroke();

        // 虚像への延長線（破線）
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "rgba(168, 85, 247, 0.5)";
        ctx.beginPath();
        ctx.moveTo(cx, cy - objH);
        ctx.lineTo(vImgX, cy - vImgH);
        ctx.moveTo(cx, cy);
        ctx.lineTo(vImgX, cy - vImgH);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // --- スクリーン上の像／虚像モードの判定と表示 ---
    const blurDist = isReal ? Math.abs(screenDist - perfectImgDist) : 999;
    const isFocused = isReal && (blurDist < 1.2);
    const alpha = coverHalf ? 0.45 : 0.95; // 厚紙で覆うと明るさが半分になる！

    // スクリーン投影のプレビュー枠（左下）
    drawScreenMonitor(w - 170, h - 150, 140, 130, isReal, isFocused, blurDist, magRatio, alpha);

    // ステータス更新 & ガイダンス
    if (isFocus) {
      setStatus("【焦点上 (15cm)】光線が平行に進むため、スクリーンをどこに置いても像は結ばれず、レンズを覗いても像は見えません。");
    } else if (isReal) {
      if (isFocused) {
        let sizeDesc = Math.abs(objDist - 2*f) < 1 ? "実物と同じ大きさ" : (objDist > 2*f ? "実物より小さい" : "実物より大きい");
        let coverDesc = coverHalf ? "（★レンズを半分隠しても像は欠けず、暗くなるだけ！）" : "";
        setStatus(`【ピント合致！】スクリーンに上下左右が逆さの『倒立実像』がくっきり映りました！(${sizeDesc}) ${coverDesc}`);
      } else {
        const dir = screenDist < perfectImgDist ? "遠ざけて" : "近づけて";
        setStatus(`ピントが合っていません（像がぼやけています）。スクリーンを${dir}、くっきり映る位置（約${perfectImgDist.toFixed(1)}cm）を探しましょう。`, true);
      }
    } else {
      // 虚像（虫メガネ）
      setStatus("【焦点の内側】光が広がってしまうためスクリーンには像が映りません。右側ののぞき枠からレンズを覗くと、拡大された『正立虚像』が見えます！（虫メガネの原理）");
      drawMagnifierView(w - 170, 20, 140, 130, objDist, f, coverHalf);
    }

    animId = requestAnimationFrame(render);
  }

  // 光源「F」を描く関数
  function drawLetterF(x, baselineY, height, flipH, flipV, alpha) {
    ctx.save();
    ctx.translate(x, baselineY);
    ctx.scale(flipH ? -1 : 1, flipV ? 1 : -1);
    ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`;
    ctx.strokeStyle = `rgba(254, 202, 202, ${alpha})`;
    ctx.lineWidth = 1.5;

    // Fの文字棒
    ctx.fillRect(-4, 0, 8, height);
    ctx.strokeRect(-4, 0, 8, height);
    // 上の横棒
    ctx.fillRect(0, height - 7, height * 0.45, 7);
    ctx.strokeRect(0, height - 7, height * 0.45, 7);
    // 中央の横棒
    ctx.fillRect(0, height * 0.5 - 3, height * 0.3, 6);
    ctx.strokeRect(0, height * 0.5 - 3, height * 0.3, 6);

    ctx.restore();
  }

  // スクリーンに映る像のモニター（右下）
  function drawScreenMonitor(bx, by, bw, bh, isReal, isFocused, blurDist, magRatio, alpha) {
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = isFocused ? "#22c55e" : "#64748b";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText("スクリーン上の見え方", bx + 12, by + 16);

    if (!isReal) {
      ctx.fillStyle = "#64748b";
      ctx.font = "12px sans-serif";
      ctx.fillText("（像は映りません）", bx + 18, by + bh / 2 + 5);
      return;
    }

    // 実像（上下反転かつ左右反転）
    const blur = Math.min(16, blurDist * 1.5);
    ctx.save();
    ctx.filter = `blur(${blur}px)`;
    // 上下左右が反転した「F」を描画
    drawLetterF(bx + bw / 2, by + bh / 2 + (20 * magRatio), 40 * magRatio, true, true, alpha);
    ctx.filter = "none";
    ctx.restore();
  }

  // 虚像用の虫メガネのぞき窓（右上）
  function drawMagnifierView(bx, by, bw, bh, dist, focal, isCovered) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#a855f7";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#d8b4fe";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText("👁️ レンズを右からのぞく", bx + 8, by + 16);

    const mag = (focal / (focal - dist));
    const alpha = isCovered ? 0.45 : 0.95;

    // 正立のまま大きく見える「F」
    drawLetterF(bx + bw / 2 - 10, by + bh - 20, Math.min(bh - 40, 35 * mag), false, false, alpha);
  }

  render();
  return { destroy: () => cancelAnimationFrame(animId) };
}






// ========================================================
// 【自由組み合わせ＆本格検証版】気体の発生と性質 (中1・物質)
// ========================================================
function initC1Gas(canvas) {
  const ctx = canvas.getContext('2d');
  
  // 選択中の試薬
  let selectedSolid = "none";   // none, limestone, mno2, zinc
  let selectedLiquid = "none";  // none, hcl, h2o2, water
  let activeGas = null;         // null, co2, o2, h2
  let testAction = null;        // null, senko, match, lime
  let bubbleTick = 0;
  let animId;

  // 固体の表示名
  const solidNames = {
    none: "（なし）",
    limestone: "石灰石",
    mno2: "二酸化マンガン",
    zinc: "亜鉛"
  };

  // 液体の表示名
  const liquidNames = {
    none: "（なし）",
    hcl: "うすい塩酸",
    h2o2: "過酸化水素水",
    water: "水"
  };

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>1. 試験管に入れる固体:</label>
      <select id="solidSelect" class="search-input" style="padding:6px;">
        <option value="none">（なし）</option>
        <option value="limestone">石灰石</option>
        <option value="mno2">二酸化マンガン</option>
        <option value="zinc">亜鉛</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>2. 注ぎ入れる液体:</label>
      <select id="liquidSelect" class="search-input" style="padding:6px;">
        <option value="none">（なし）</option>
        <option value="hcl">うすい塩酸</option>
        <option value="h2o2">過酸化水素水</option>
        <option value="water">水</option>
      </select>
    </div>
    <div class="ctrl-group" style="grid-column: 1 / -1;">
      <label>3. 発生した気体を調べる実験:</label>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn-action secondary" id="btnSenko">火のついた線香を入れる</button>
        <button class="btn-action secondary" id="btnMatch">マッチの火を近づける 🔥</button>
        <button class="btn-action secondary" id="btnLime">石灰水を通す</button>
        <button class="btn-action secondary" id="btnResetG">試験管を洗う（リセット）</button>
      </div>
    </div>
  `;

  document.getElementById('solidSelect').onchange = (e) => {
    selectedSolid = e.target.value;
    checkReaction();
  };
  document.getElementById('liquidSelect').onchange = (e) => {
    selectedLiquid = e.target.value;
    checkReaction();
  };

  document.getElementById('btnSenko').onclick = () => { testAction = 'senko'; updateTestResult(); };
  document.getElementById('btnMatch').onclick = () => { testAction = 'match'; updateTestResult(); };
  document.getElementById('btnLime').onclick = () => { testAction = 'lime'; updateTestResult(); };
  document.getElementById('btnResetG').onclick = () => {
    selectedSolid = "none";
    selectedLiquid = "none";
    activeGas = null;
    testAction = null;
    document.getElementById('solidSelect').value = "none";
    document.getElementById('liquidSelect').value = "none";
    setStatus("試験管をきれいに洗いました。固体と液体を選んで反応させてみましょう。");
  };

  // 組み合わせ判定ロジック
  function checkReaction() {
    testAction = null;
    
    // 二酸化炭素
    if (selectedSolid === 'limestone' && selectedLiquid === 'hcl') {
      activeGas = 'co2';
      setStatus("【反応開始！】シュワシュワと激しく泡立ち、無色・無臭の気体が発生しています！どんな気体か調べてみましょう。（集め方：水に少し溶け空気より重いので「水上置換」または「下方置換」）");
    }
    // 酸素
    else if (selectedSolid === 'mno2' && selectedLiquid === 'h2o2') {
      activeGas = 'o2';
      setStatus("【反応開始！】二酸化マンガンが触媒となり、過酸化水素水から勢いよく気泡が発生しています！（集め方：水に溶けにくいため「水上置換」）");
    }
    // 水素
    else if (selectedSolid === 'zinc' && selectedLiquid === 'hcl') {
      activeGas = 'h2';
      setStatus("【反応開始！】金属（亜鉛）が塩酸にとけて細かな泡がたくさん発生しています！（集め方：水に溶けにくく空気より極めて軽いので「水上置換」）");
    }
    // それ以外の組み合わせ
    else {
      activeGas = null;
      if (selectedSolid !== 'none' && selectedLiquid !== 'none') {
        setStatus(`【${solidNames[selectedSolid]}】と【${liquidNames[selectedLiquid]}】を混ぜましたが、化学反応は起こらず気体は発生しませんでした。別の組み合わせを試してみましょう。`, true);
      } else {
        setStatus("固体と液体の両方を試験管に入れてください。");
      }
    }
  }

  // 検証実験の結果判定
  function updateTestResult() {
    if (!activeGas) {
      setStatus("気体が発生していません。先に反応が起きる組み合わせを見つけて気体を溜めましょう。", true);
      return;
    }

    if (testAction === 'senko') {
      if (activeGas === 'o2') {
        setStatus("【火のついた線香】線香が『パッ』と激しく炎を上げて燃え上がりました！（酸素の助燃性）");
      } else if (activeGas === 'co2') {
        setStatus("【火のついた線香】線香の火が試験管に入れた瞬間にスッと消えました！（二酸化炭素に物を燃やすはたらきはありません）");
      } else if (activeGas === 'h2') {
        setStatus("【火のついた線香】試験管の口で線香を入れた瞬間、気体に引火してポンと音が鳴りました。");
      }
    } else if (testAction === 'match') {
      if (activeGas === 'h2') {
        setStatus("【マッチの火】『ポンッ！』と爆発音を立てて気体が激しく燃え、試験管の内側にわずかな水滴がつきました！（水素の可燃性）");
      } else if (activeGas === 'o2') {
        setStatus("【マッチの火】マッチの炎が一段と大きく明るく燃え上がりました！");
      } else if (activeGas === 'co2') {
        setStatus("【マッチの火】マッチの火が一瞬で消えてしまいました。");
      }
    } else if (testAction === 'lime') {
      if (activeGas === 'co2') {
        setStatus("【石灰水】気体を通すと、無色透明だった石灰水が『白く濁り』ました！（炭酸カルシウムの沈殿生成。二酸化炭素の確実な検出法です）");
      } else {
        setStatus("【石灰水】気体を通しても石灰水に変化はなく、透明なままでした。");
      }
    }
  }

  function loop() {
    bubbleTick++;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const tx = w / 2 - 40, ty = h / 2 - 80, tw = 80, th = 170;

   // 試験管のガラス外枠（垂直で整った形）
    const r = tw / 2; // 底部の半径
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tx, ty);                         // 左上の口
    ctx.lineTo(tx, ty + th - r);                // 左の縦線（まっすぐ下ろす）
    ctx.arc(tx + r, ty + th - r, r, Math.PI, 0, true); // 底の丸み（きれいな半円）
    ctx.lineTo(tx + tw, ty);                    // 右の縦線（まっすぐ上げる）
    ctx.stroke();

    // 液体の描画
    if (selectedLiquid !== 'none') {
      ctx.fillStyle = testAction === 'lime' && activeGas === 'co2' 
        ? "rgba(255, 255, 255, 0.85)" 
        : "rgba(56, 189, 248, 0.25)";
      ctx.beginPath();
      ctx.moveTo(tx + 2, ty + th / 2);
      ctx.lineTo(tx + 2, ty + th - r);
      ctx.arc(tx + r, ty + th - r, r - 2, Math.PI, 0, true);
      ctx.lineTo(tx + tw - 2, ty + th / 2);
      ctx.closePath();
      ctx.fill();
    }

    // 固体の描画（底に沈む）
    if (selectedSolid !== 'none') {
      const by = ty + th - 15;
      if (selectedSolid === 'limestone') {
        ctx.fillStyle = "#e2e8f0"; // 白い小石
        [-15, 0, 15].forEach(dx => {
          ctx.beginPath();
          ctx.ellipse(tx + tw/2 + dx, by, 8, 6, 0, 0, Math.PI*2);
          ctx.fill();
        });
      } else if (selectedSolid === 'mno2') {
        ctx.fillStyle = "#1e293b"; // 黒い粉末
        ctx.fillRect(tx + 15, by - 6, tw - 30, 12);
      } else if (selectedSolid === 'zinc') {
        ctx.fillStyle = "#94a3b8"; // 灰色の金属粒
        [-12, 12].forEach(dx => {
          ctx.fillRect(tx + tw/2 + dx - 6, by - 8, 12, 8);
        });
      }
    }

    // 気泡アニメーション（反応中）
    if (activeGas) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      const bSpeed = activeGas === 'h2' ? 3 : 2;
      for (let i = 0; i < 6; i++) {
        const bx = tx + 16 + (i * 10);
        const by = (ty + th - 20 - ((bubbleTick * bSpeed + i * 20) % (th / 2)));
        ctx.beginPath();
        ctx.arc(bx, by, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 検証ツールの描画
    if (testAction === 'senko') {
      const sx = tx + tw / 2, sy = ty + 35;
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sx + 35, sy - 50);
      ctx.lineTo(sx, sy);
      ctx.stroke();

      if (activeGas === 'o2') {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(sx, sy, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(sx, sy, 9, 0, Math.PI * 2);
        ctx.fill();
      } else if (activeGas === 'co2') {
        ctx.fillStyle = "#64748b";
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(sx, sy, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (testAction === 'match') {
      const mx = tx + tw / 2, my = ty + 10;
      ctx.strokeStyle = "#ca8a04";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(mx + 40, my - 30);
      ctx.lineTo(mx, my);
      ctx.stroke();

      if (activeGas === 'h2') {
        // ポンと爆発炎
        ctx.fillStyle = "rgba(56, 189, 248, 0.8)";
        ctx.beginPath();
        ctx.arc(mx, my, 26, 0, Math.PI * 2);
        ctx.fill();
      } else if (activeGas === 'o2') {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(mx, my, 20, 0, Math.PI * 2);
        ctx.fill();
      } else if (activeGas === 'co2') {
        ctx.fillStyle = "#475569";
        ctx.beginPath();
        ctx.arc(mx, my, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    animId = requestAnimationFrame(loop);
  }
  loop();

  return { destroy: () => cancelAnimationFrame(animId) };
}















// ==========================================
// 【完全版】溶解度と再結晶 (中1・物質)
// ==========================================
function initC1Solubility(canvas) {
  const ctx = canvas.getContext('2d');
  
  let temp = 60;
  let solute = "kno3";
  let isEvaporating = false; // 水の蒸発モード
  let showFiltration = false; // ろ過器具の図解モード
  let animId;

  const crystalImages = { kno3: new Image(), alum: new Image(), nacl: new Image() };
  crystalImages.kno3.src = 'crystal_kno3.jpg';
  crystalImages.alum.src = 'crystal_alum.jpg';
  crystalImages.nacl.src = 'crystal_nacl.jpg';

  const soluteData = {
    kno3: { name: "硝酸カリウム", added: 60, calcSol: (t) => 13.3 + (t * t) / 58 },
    alum: { name: "ミョウバン",     added: 40, calcSol: (t) => 5.7 + (t * t) / 120 },
    nacl: { name: "食塩 (NaCl)",   added: 40, calcSol: (t) => 35.8 + t * 0.03 }
  };

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>1. 物質の選択:</label>
      <select id="soluteSelect" class="search-input" style="padding:6px;">
        <option value="kno3">硝酸カリウム (冷却再結晶に向く)</option>
        <option value="alum">ミョウバン (冷却再結晶に向く)</option>
        <option value="nacl">食塩 (水を蒸発させて再結晶)</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>2. ビーカー水温: <span id="tVal" class="ctrl-val">${temp} ℃</span></label>
      <input type="range" id="tRange" min="10" max="80" value="${temp}">
    </div>
    <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; gap:8px;">
      <button class="btn-action secondary" id="bEvap">🔥 水を蒸発させて再結晶する (蒸発皿加熱)</button>
      <button class="btn-action secondary" id="bFilter">🧪 ろ過の正しい器具の配置を確認する</button>
    </div>
  `;

  document.getElementById('soluteSelect').onchange = (e) => {
    solute = e.target.value;
    isEvaporating = false;
    showFiltration = false;
    updateStatus();
  };
  document.getElementById('tRange').oninput = (e) => {
    temp = parseInt(e.target.value);
    document.getElementById('tVal').textContent = `${temp} ℃`;
    isEvaporating = false;
    showFiltration = false;
    updateStatus();
  };
  document.getElementById('bEvap').onclick = () => {
    isEvaporating = true;
    showFiltration = false;
    setStatus(`【蒸発による再結晶】水溶液を加熱して水を蒸発させました！水に溶けていられなくなった【${soluteData[solute].name}】の結晶が蒸発皿一面にびっしりと析出しました！食塩はこの方法で取り出します。`);
  };
  document.getElementById('bFilter').onclick = () => {
    showFiltration = !showFiltration;
    setStatus("【ろ過の最重要ポイント】①ガラス棒に液を伝わらせて静かに注ぐ。②ろうとの足のとがった方をビーカーの壁面にぴったりつける（液の飛び散り防止と流速UP）。");
  };

  function updateStatus() {
    const s = soluteData[solute];
    const maxSol = s.calcSol(temp);
    const precip = Math.max(0, s.added - maxSol);

    if (precip > 0) {
      if (solute === 'nacl') {
        setStatus(`【冷やす方法では困難】食塩は温度を下げても溶解度がほとんど減りません（約${precip.toFixed(1)}gしか出ない）。上の「水を蒸発させる」ボタンを試してみましょう！`);
      } else {
        setStatus(`【冷却再結晶！】水温${temp}℃で約${precip.toFixed(1)}gの結晶が析出しました！右の顕微鏡窓で結晶の形を確認しましょう。`);
      }
    } else {
      setStatus(`水温${temp}℃では全て溶けています。温度を下げるか水を蒸発させてみましょう。`);
    }
  }
  updateStatus();

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    if (showFiltration) {
      // ろ過器具の正しい配置図
      const cx = w / 2, cy = h / 2;
      ctx.fillStyle = "#cbd5e1"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("【ろ過の正しい器具配置（テスト頻出！）】", cx, 30);

      // ビーカーとろうと
      ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3;
      ctx.strokeRect(cx - 50, cy + 10, 100, 90); // 受けるビーカー

      // ろうとの足（ビーカーの壁につける！）
      ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx - 35, cy - 40); ctx.lineTo(cx + 35, cy - 40); // ろうと上
      ctx.lineTo(cx + 5, cy);
      ctx.lineTo(cx + 46, cy + 70); // 壁面につける足
      ctx.stroke();

      // ガラス棒
      ctx.strokeStyle = "#facc15"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx - 60, cy - 90); ctx.lineTo(cx - 5, cy - 35); ctx.stroke();

      ctx.fillStyle = "#ef4444"; ctx.font = "12px sans-serif";
      ctx.fillText("← ガラス棒を伝わらせて注ぐ", cx - 75, cy - 65);
      ctx.fillText("← 足のとがった方をビーカーの壁につける！", cx + 130, cy + 65);
      animId = requestAnimationFrame(render);
      return;
    }

    const s = soluteData[solute];
    const maxSol = s.calcSol(temp);
    const precip = isEvaporating ? s.added * 0.85 : Math.max(0, s.added - maxSol);

    // ビーカー描画
    const bx = w * 0.25 - 60, by = h / 2 - 75, bw = 120, bh = 145;
    ctx.fillStyle = `rgba(56, 189, 248, ${0.15 + (temp / 180)})`;
    ctx.fillRect(bx + 4, by + 30, bw - 8, bh - 32);
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 4; ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(`水温: ${temp} ℃`, bx - 10, by - 12);
    ctx.fillText(`析出量: 約${precip.toFixed(1)} g`, bx - 10, by + bh + 22);

    if (precip > 0) {
      ctx.fillStyle = "#f8fafc";
      const pH = Math.min(bh - 35, precip * 1.5);
      ctx.beginPath();
      ctx.moveTo(bx + 6, by + bh - 2); ctx.lineTo(bx + bw / 2, by + bh - pH); ctx.lineTo(bx + bw - 6, by + bh - 2);
      ctx.fill();
    }

    // 顕微鏡ビュー
    const mx = w * 0.72, my = h / 2, mr = Math.min(w, h) * 0.33;
    ctx.save();
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = "#020617"; ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);

    const img = crystalImages[solute];
    if (precip > 0) {
      ctx.globalAlpha = Math.min(1.0, 0.3 + (precip / 15) * 0.7);
      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, mx - mr * 1.15, my - mr * 1.15, mr * 2.3, mr * 2.3);
      } else {
        ctx.fillStyle = "#94a3b8"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(`crystal_${solute}.jpg を保存`, mx, my);
      }
      ctx.globalAlpha = 1.0;
    } else {
      ctx.fillStyle = "#94a3b8"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("【全量溶解中】", mx, my);
    }
    ctx.restore();

    ctx.strokeStyle = precip > 0 ? "#38bdf8" : "#475569"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(mx, my, mr + 3, 0, Math.PI * 2); ctx.stroke();

    animId = requestAnimationFrame(render);
  }
  render();

  return { destroy: () => cancelAnimationFrame(animId) };
}












// ========================================================
// 【実音発音＆オシロスコープ方眼版】モノコードと音 (中1・エネルギー)
// ========================================================
function initC1Sound(canvas) {
  const ctx = canvas.getContext('2d');

  // 音の条件パラメータ
  let stringThickness = "thin"; // "thin"(細い) または "thick"(太い)
  let stringLength = 50;        // 弦の長さ % (20〜100%)
  let stringTension = 50;       // 弦の張り % (20〜100%)
  let pluckStrength = 50;       // はじく強さ (音の大きさ: 振幅)

  let isPlucked = false;
  let isMuted = false;
  let animTime = 0;
  let animId;

  // 基準波形（比較用：初期状態を保存）
  let savedBaseline = { freq: 440, amp: 35 };

  // Web Audio API の初期化（ユーザー操作時に生成）
  let audioCtx = null;

  function playTone(freq, gainValue) {
    if (isMuted) return;
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle'; // 弦楽器に近い温かみのある三角波
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // 弦をはじいたときの減衰音（アタック〜ディケイ）
      const now = audioCtx.currentTime;
      const peakGain = Math.min(0.8, (gainValue / 100) * 0.5);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(peakGain, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.25);
    } catch (e) {
      console.warn("Web Audio API not supported", e);
    }
  }

  // 物理計算（振動数と振幅）
  function calcSoundPhysics() {
    // 基準周波数: 440 Hz (ラ・A4)
    // 振動数 f ∝ 1/L * √(T/ρ)
    const thicknessFactor = stringThickness === "thin" ? 1.0 : 0.7; // 太い弦は低い
    const lengthFactor = 50 / stringLength;                         // 短いほど高い
    const tensionFactor = Math.sqrt(stringTension / 50);            // 強く張るほど高い

    const frequency = Math.round(440 * thicknessFactor * lengthFactor * tensionFactor);
    const amplitude = Math.round((pluckStrength / 50) * 35); // ピクセルの振幅

    return { frequency, amplitude };
  }

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>1. 弦の太さ:</label>
      <div style="display:flex; gap:8px;">
        <button class="btn-action ${stringThickness==='thin'?'':'secondary'}" id="bThin">細い弦（高音）</button>
        <button class="btn-action ${stringThickness==='thick'?'':'secondary'}" id="bThick">太い弦（低音）</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>2. ことじの位置（弦の長さ）: <span id="lenVal" class="ctrl-val">${stringLength}%</span></label>
      <input type="range" id="lenRange" min="25" max="100" value="${stringLength}">
    </div>
    <div class="ctrl-group">
      <label>3. 弦の張り（おもりの重さ）: <span id="tenVal" class="ctrl-val">${stringTension}%</span></label>
      <input type="range" id="tenRange" min="20" max="100" value="${stringTension}">
    </div>
    <div class="ctrl-group">
      <label>4. はじく強さ（音の大きさ）: <span id="strVal" class="ctrl-val">${pluckStrength}%</span></label>
      <input type="range" id="strRange" min="20" max="100" value="${pluckStrength}">
    </div>
    <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:8px;">
      <button class="btn-action" id="btnPluck" style="flex: 2; font-size:15px;">🎵 弦をはじいて音を鳴らす！</button>
      <button class="btn-action secondary" id="btnSetBase" style="flex: 1;">現在の波形を基準に保存</button>
      <button class="btn-action secondary" id="btnMute" style="flex: 1;">${isMuted?'🔇 ミュート中':'🔊 音声ON'}</button>
    </div>
  `;

  document.getElementById('bThin').onclick = () => {
    stringThickness = "thin";
    updateButtons();
    updateStatus();
  };
  document.getElementById('bThick').onclick = () => {
    stringThickness = "thick";
    updateButtons();
    updateStatus();
  };
  document.getElementById('lenRange').oninput = (e) => {
    stringLength = parseInt(e.target.value);
    document.getElementById('lenVal').textContent = `${stringLength}%`;
    updateStatus();
  };
  document.getElementById('tenRange').oninput = (e) => {
    stringTension = parseInt(e.target.value);
    document.getElementById('tenVal').textContent = `${stringTension}%`;
    updateStatus();
  };
  document.getElementById('strRange').oninput = (e) => {
    pluckStrength = parseInt(e.target.value);
    document.getElementById('strVal').textContent = `${pluckStrength}%`;
    updateStatus();
  };

  document.getElementById('btnPluck').onclick = () => {
    isPlucked = true;
    const { frequency, amplitude } = calcSoundPhysics();
    playTone(frequency, pluckStrength);
    setTimeout(() => { isPlucked = false; }, 1200);
    updateStatus();
  };

  document.getElementById('btnSetBase').onclick = () => {
    const { frequency, amplitude } = calcSoundPhysics();
    savedBaseline = { freq: frequency, amp: amplitude };
    setStatus(`【基準波形を更新】振動数 ${frequency} Hz / 振幅 ${amplitude} を黄色の破線で保存しました。他の条件と波の数や高さを比べてみましょう！`);
  };

  document.getElementById('btnMute').onclick = () => {
    isMuted = !isMuted;
    const btn = document.getElementById('btnMute');
    btn.textContent = isMuted ? '🔇 ミュート中' : '🔊 音声ON';
    btn.className = `btn-action ${isMuted?'secondary':''}`;
  };

  function updateButtons() {
    document.getElementById('bThin').className = `btn-action ${stringThickness==='thin'?'':'secondary'}`;
    document.getElementById('bThick').className = `btn-action ${stringThickness==='thick'?'':'secondary'}`;
  }

  function updateStatus() {
    const { frequency, amplitude } = calcSoundPhysics();
    const pitchDesc = frequency >= 550 ? "【高い音】" : (frequency <= 350 ? "【低い音】" : "【中くらいの音】");
    const volDesc = amplitude >= 40 ? "【大きい音】" : "【小さい音】";

    let ruleNotes = [];
    if (stringThickness === "thin") ruleNotes.push("弦が細い");
    if (stringLength <= 40) ruleNotes.push("弦が短い");
    if (stringTension >= 70) ruleNotes.push("張りが強い");

    let ruleMsg = ruleNotes.length > 0 ? `（高音の条件: ${ruleNotes.join('・')}）` : "";

    setStatus(`振動数: ${frequency} Hz ${pitchDesc} ／ 振幅: ${amplitude} ${volDesc} ${ruleMsg}。オシロスコープの「波の数（振動数）」と「波の高さ（振幅）」を確認しましょう！`);
  }
  updateStatus();

  function render() {
    animTime += 0.25;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0a0f1d";
    ctx.fillRect(0, 0, w, h);

    const { frequency, amplitude } = calcSoundPhysics();

    // ========================================================
    // 上半分：モノコード本体（木製共鳴箱、弦、ことじ、おもり）
    // ========================================================
    const monoX = 50, monoY = 25, monoW = w - 100, monoH = 65;

    // 木の共鳴箱
    ctx.fillStyle = "#78350f";
    ctx.fillRect(monoX, monoY + 15, monoW, monoH - 15);
    ctx.fillStyle = "#92400e";
    ctx.fillRect(monoX + 4, monoY + 19, monoW - 8, monoH - 23);

    // 左端の固定具（ピラー）
    ctx.fillStyle = "#334155";
    ctx.fillRect(monoX + 8, monoY + 2, 12, 25);

    // 右端の滑車
    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.arc(monoX + monoW - 15, monoY + 15, 12, 0, Math.PI * 2);
    ctx.fill();

    // 移動することじ（駒）
    // stringLength (25〜100%) に応じてX位置が変化
    const usableWidth = monoW - 90;
    const bridgeX = monoX + 25 + (usableWidth * (stringLength / 100));
    const bridgeY = monoY + 14;

    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.moveTo(bridgeX, bridgeY - 12);
    ctx.lineTo(bridgeX - 10, bridgeY + 8);
    ctx.lineTo(bridgeX + 10, bridgeY + 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "10px sans-serif";
    ctx.fillText("ことじ", bridgeX - 12, bridgeY + 20);

    // 弦（左端 〜 ことじ 〜 右端滑車）
    const stringThickPx = stringThickness === "thin" ? 2 : 4.5;
    const vibrateOffset = isPlucked ? Math.sin(animTime * 3) * (pluckStrength * 0.08) : 0;

    // 振動する部分（左端〜ことじ）
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = stringThickPx;
    ctx.beginPath();
    ctx.moveTo(monoX + 14, monoY + 6);
    ctx.lineTo((monoX + 14 + bridgeX) / 2, monoY + 6 + vibrateOffset);
    ctx.lineTo(bridgeX, monoY + 2);
    ctx.stroke();

    // 振動しない部分（ことじ〜滑車）
    ctx.beginPath();
    ctx.moveTo(bridgeX, monoY + 2);
    ctx.lineTo(monoX + monoW - 15, monoY + 6);
    // 滑車からぶら下がる弦とおもり
    ctx.lineTo(monoX + monoW - 3, monoY + 15);
    ctx.lineTo(monoX + monoW - 3, monoY + 65);
    ctx.stroke();

    // 弦の張りを表すおもり（重さに応じて個数や大きさが変化）
    const weightCount = Math.max(1, Math.round(stringTension / 25));
    ctx.fillStyle = "#475569";
    for (let i = 0; i < weightCount; i++) {
      ctx.fillRect(monoX + monoW - 13, monoY + 65 + i * 14, 20, 11);
      ctx.strokeStyle = "#1e293b";
      ctx.strokeRect(monoX + monoW - 13, monoY + 65 + i * 14, 20, 11);
    }
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "10px sans-serif";
    ctx.fillText(`おもり×${weightCount}`, monoX + monoW - 48, monoY + 80);

    // ========================================================
    // 下半分：オシロスコープ画面（マス目方眼＆波形描画）
    // ========================================================
    const oscX = 50, oscY = monoY + monoH + 45;
    const oscW = w - 100, oscH = h - oscY - 20;
    const oscCenterY = oscY + oscH / 2;

    // オシロスコープ外枠
    ctx.fillStyle = "#020617";
    ctx.fillRect(oscX, oscY, oscW, oscH);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 3;
    ctx.strokeRect(oscX, oscY, oscW, oscH);

    // 方眼目盛り（グリッド線：横軸時間、縦軸振幅）
    ctx.strokeStyle = "rgba(51, 65, 85, 0.45)";
    ctx.lineWidth = 1;
    const gridSize = 24;
    for (let x = oscX; x <= oscX + oscW; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, oscY);
      ctx.lineTo(x, oscY + oscH);
      ctx.stroke();
    }
    for (let y = oscY; y <= oscY + oscH; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(oscX, y);
      ctx.lineTo(oscX + oscW, y);
      ctx.stroke();
    }

    // 中心軸（基準ライン）
    ctx.strokeStyle = "rgba(100, 116, 139, 0.7)";
    ctx.beginPath();
    ctx.moveTo(oscX, oscCenterY);
    ctx.lineTo(oscX + oscW, oscCenterY);
    ctx.stroke();

    // 画面見出し
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("📊 オシロスコープ波形（横軸: 時間 ／ 縦軸: 振幅）", oscX + 12, oscY + 18);

    // 波形の描画倍率計算
    // 振動数が高いほど1画面あたりの波の数が増える
    const waveFreqScale = (frequency / 440) * 0.045;
    const curAmp = isPlucked ? amplitude : Math.max(4, amplitude * 0.15); // 非発音時もかすかに波形表示

    // 1. 基準波形（保存されたベースライン：黄色の破線）
    if (savedBaseline) {
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = "rgba(250, 204, 21, 0.6)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      const baseFreqScale = (savedBaseline.freq / 440) * 0.045;
      for (let x = 0; x < oscW; x += 3) {
        const y = oscCenterY + Math.sin(x * baseFreqScale) * savedBaseline.amp;
        if (x === 0) ctx.moveTo(oscX + x, y);
        else ctx.lineTo(oscX + x, y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(250, 204, 21, 0.8)";
      ctx.font = "11px sans-serif";
      ctx.fillText(`基準: ${savedBaseline.freq}Hz (振幅${savedBaseline.amp})`, oscX + oscW - 170, oscY + 18);
    }

    // 2. 現在のリアルタイム波形（エメラルドグリーン）
    ctx.strokeStyle = isPlucked ? "#10b981" : "rgba(16, 185, 129, 0.4)";
    ctx.lineWidth = isPlucked ? 3.5 : 2;
    ctx.beginPath();
    for (let x = 0; x < oscW; x += 3) {
      // isPluckedのときは波が右へ流れるアニメーション
      const phase = isPlucked ? animTime * 2 : 0;
      const y = oscCenterY + Math.sin((x * waveFreqScale) + phase) * curAmp;
      if (x === 0) ctx.moveTo(oscX + x, y);
      else ctx.lineTo(oscX + x, y);
    }
    ctx.stroke();

    animId = requestAnimationFrame(render);
  }
  render();

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
    }
  };
}


















// ===================================================================
// 【極限こだわり完全版】地震の波・走時曲線・媒質振動・緊急地震速報 (中1・地球)
// ===================================================================
function initC1Earthquake(canvas) {
  const ctx = canvas.getContext('2d');

  // 物理定数（スケール: 1px = 1km）
  const vP = 7.0;  // P波速度: 7.0 km/s (縦波)
  const vS = 3.8;  // S波速度: 3.8 km/s (横波)
  const omoriK = (vP * vS) / (vP - vS); // 大森係数 k ≈ 8.31

  // 震源座標（地下深さ）
  const focus = { x: 45, y: 155, depth: 35 }; // 地表は y=85

  // 観測地点（地表 y=85 上）
  const stationA = { name: "地点A (近)", x: 180, y: 85 };
  const stationB = { name: "地点B (遠)", x: 330, y: 85 };

  // シミュレーション状態
  let isQuakeActive = false;
  let quakeTime = 0;       // 地震発生からの経過秒数 (s)
  let animId;

  // 地盤格子の粒子（縦波・横波の可視化用）
  const groundGrid = [];
  const gridRows = 6;
  const gridCols = 32;
  for (let r = 0; r < gridRows; r++) {
    for (let c = 0; c < gridCols; c++) {
      groundGrid.push({
        baseX: 30 + c * 13,
        baseY: 98 + r * 14,
        x: 30 + c * 13,
        y: 98 + r * 14
      });
    }
  }

  // 地震計波形記録バッファ
  const seismogramA = [];
  const seismogramB = [];

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>1. 地震トリガー & 防災:</label>
      <div style="display:flex; gap:6px;">
        <button class="btn-action" id="bQuake" style="flex:2; font-size:14px; background:#ef4444; border-color:#ef4444;">💥 地震を発生させる！</button>
        <button class="btn-action secondary" id="bReset" style="flex:1;">リセット 🔄</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>2. 観測地点A (近距離): <span id="distAVal" class="ctrl-val">-- km</span></label>
      <input type="range" id="rangeA" min="110" max="230" value="${stationA.x}">
    </div>
    <div class="ctrl-group">
      <label>3. 観測地点B (遠距離): <span id="distBVal" class="ctrl-val">-- km</span></label>
      <input type="range" id="rangeB" min="250" max="420" value="${stationB.x}">
    </div>
    <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:12px; font-size:12px; background:#0f172a; padding:10px; border-radius:6px; border:1px solid #334155;">
      <div><span style="color:#38bdf8; font-weight:bold;">● P波 (縦波)</span>: 速度 ${vP.toFixed(1)} km/s（進行方向に伸縮・初期微動）</div>
      <div><span style="color:#f87171; font-weight:bold;">● S波 (横波)</span>: 速度 ${vS.toFixed(1)} km/s（進行と直角に揺れる・主要動）</div>
      <div><span style="color:#facc15; font-weight:bold;">● 大森公式</span>: 距離 $D = k \\times t$ （大森係数 $k \\approx ${omoriK.toFixed(1)}$）</div>
    </div>
  `;

  function getDistance(st) {
    const dx = st.x - focus.x;
    const dy = st.y - focus.y;
    return Math.round(Math.sqrt(dx * dx + dy * dy));
  }

  function updateDistances() {
    const dA = getDistance(stationA);
    const dB = getDistance(stationB);
    document.getElementById('distAVal').textContent = `${dA} km`;
    document.getElementById('distBVal').textContent = `${dB} km`;
  }
  updateDistances();

  document.getElementById('rangeA').oninput = (e) => {
    stationA.x = parseInt(e.target.value);
    updateDistances();
    if (!isQuakeActive) resetQuake();
  };
  document.getElementById('rangeB').oninput = (e) => {
    stationB.x = parseInt(e.target.value);
    updateDistances();
    if (!isQuakeActive) resetQuake();
  };

  document.getElementById('bQuake').onclick = () => {
    resetQuake();
    isQuakeActive = true;
    setStatus("【地震発生！】P波（青・縦波）が地盤を伸縮させながら先行し、遅れてS波（赤・横波）が大きな上下動を起こします。右の「走時曲線」と下の「地震計」の連動に注目！");
  };

  document.getElementById('bReset').onclick = () => {
    resetQuake();
    setStatus("リセットしました。地点A・Bのピンやスライダーを動かして「地震を発生させる」を押してください。");
  };

  function resetQuake() {
    isQuakeActive = false;
    quakeTime = 0;
    seismogramA.length = 0;
    seismogramB.length = 0;
    groundGrid.forEach(p => { p.x = p.baseX; p.y = p.baseY; });
  }

  function updateStatusLive() {
    const dA = getDistance(stationA);
    const dB = getDistance(stationB);
    const durA = (dA / vS - dA / vP).toFixed(1);
    const durB = (dB / vS - dB / vP).toFixed(1);
    setStatus(`【観測解析】地点A（${dA}km）初期微動継続時間: ${durA}秒 ／ 地点B（${dB}km）初期微動継続時間: ${durB}秒。★走時曲線グラフの2本の直線幅（横の開き）が、そのまま初期微動継続時間と一致します！`);
  }
  updateStatusLive();

  // マウスドラッグで地点ピン操作
  let draggingStation = null;
  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    if (Math.hypot(mx - stationA.x, my - stationA.y) < 18) draggingStation = stationA;
    else if (Math.hypot(mx - stationB.x, my - stationB.y) < 18) draggingStation = stationB;
  };
  window.onmousemove = (e) => {
    if (!draggingStation) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    draggingStation.x = Math.max(90, Math.min(430, mx));
    if (draggingStation === stationA) document.getElementById('rangeA').value = stationA.x;
    if (draggingStation === stationB) document.getElementById('rangeB').value = stationB.x;
    updateDistances();
  };
  window.onmouseup = () => {
    if (draggingStation) {
      draggingStation = null;
      if (!isQuakeActive) updateStatusLive();
    }
  };

  // ========================================================
  // メイン描画ループ
  // ========================================================
  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    if (isQuakeActive) {
      quakeTime += 0.08;
    }

    const groundY = 85;
    const dA = getDistance(stationA);
    const dB = getDistance(stationB);
    const tP_A = dA / vP, tS_A = dA / vS;
    const tP_B = dB / vP, tS_B = dB / vS;

    const curRP = quakeTime * vP;
    const curRS = quakeTime * vS;

    // ==========================================
    // 1. 左上エリア：地層断面＆媒質格子振動
    // ==========================================
    const secW = 460;
    // 地下ブロック
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, groundY, secW, 105);

    // 地表（芝）
    ctx.fillStyle = "#15803d";
    ctx.fillRect(0, groundY - 4, secW, 5);

    // 空
    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    ctx.fillRect(0, 0, secW, groundY - 4);

    // 地盤格子の物理振動（P波: 縦波疎密 / S波: 横波上下）
    groundGrid.forEach(pt => {
      const dist = Math.hypot(pt.baseX - focus.x, pt.baseY - focus.y);
      const angle = Math.atan2(pt.baseY - focus.y, pt.baseX - focus.x);

      let dx = 0, dy = 0;
      if (isQuakeActive) {
        // S波到達後：進行方向と直角（横方向）に大きくうねる
        if (curRS >= dist && curRS <= dist + 90) {
          const sPhase = (curRS - dist) * 0.28;
          const sAmp = Math.sin(sPhase) * 5.5;
          // 進行方向と垂直なベクトル (-sin, cos)
          dx += -Math.sin(angle) * sAmp;
          dy += Math.cos(angle) * sAmp;
        }
        // P波到達後：進行方向に沿って伸縮（疎密波）
        else if (curRP >= dist && curRP <= dist + 70) {
          const pPhase = (curRP - dist) * 0.45;
          const pAmp = Math.sin(pPhase) * 3.2;
          // 進行方向に沿ったベクトル (cos, sin)
          dx += Math.cos(angle) * pAmp;
          dy += Math.sin(angle) * pAmp;
        }
      }

      pt.x = pt.baseX + dx;
      pt.y = pt.baseY + dy;

      ctx.fillStyle = (curRS >= dist) ? "#f87171" : ((curRP >= dist) ? "#38bdf8" : "#475569");
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    });

    // 震央点
    ctx.setLineDash([2, 3]);
    ctx.strokeStyle = "#94a3b8";
    ctx.beginPath();
    ctx.moveTo(focus.x, groundY);
    ctx.lineTo(focus.x, focus.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("震央", focus.x, groundY - 10);

    // 震源
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(focus.x, focus.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("震源", focus.x, focus.y + 18);

    // 波面の同心円
    if (isQuakeActive) {
      // P波
      ctx.strokeStyle = "rgba(56, 189, 248, 0.85)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(focus.x, focus.y, curRP, 0, Math.PI * 2);
      ctx.stroke();

      // S波
      ctx.strokeStyle = "rgba(248, 113, 113, 0.9)";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(focus.x, focus.y, curRS, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 観測点ピン
    function drawPin(st, color, name, dist) {
      ctx.setLineDash([2, 3]);
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.beginPath();
      ctx.moveTo(focus.x, focus.y);
      ctx.lineTo(st.x, st.y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(st.x, st.y - 10, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(st.x, st.y - 2);
      ctx.lineTo(st.x - 3, st.y - 10);
      ctx.lineTo(st.x + 3, st.y - 10);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(name, st.x, st.y - 22);
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "9px sans-serif";
      ctx.fillText(`${dist}km`, st.x, st.y - 12);
    }
    drawPin(stationA, "#38bdf8", "地点A", dA);
    drawPin(stationB, "#facc15", "地点B", dB);

    // ==========================================
    // 2. 緊急地震速報（EEW）アラートボックス
    // ==========================================
    const eewX = 10, eewY = 10, eewW = 240, eewH = 65;
    ctx.fillStyle = "#020617";
    ctx.fillRect(eewX, eewY, eewW, eewH);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(eewX, eewY, eewW, eewH);

    ctx.textAlign = "left";
    if (isQuakeActive && quakeTime >= tP_A) {
      // 速報発令中
      const remainB = Math.max(0, tS_B - quakeTime).toFixed(1);
      ctx.fillStyle = "#ea580c";
      ctx.fillRect(eewX, eewY, eewW, 20);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText("🚨 緊急地震速報（警報）", eewX + 8, eewY + 14);

      ctx.font = "bold 12px sans-serif";
      ctx.fillStyle = "#facc15";
      ctx.fillText(`地点B（主要動まで）: あと ${remainB} 秒`, eewX + 8, eewY + 38);
      ctx.font = "10px sans-serif";
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("※地点AのP波検知により即時発令", eewX + 8, eewY + 54);
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(eewX, eewY, eewW, 20);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText("🛡️ 緊急地震速報システム", eewX + 8, eewY + 14);
      ctx.font = "10px sans-serif";
      ctx.fillText("震源直近の観測点がP波を検知すると", eewX + 8, eewY + 38);
      ctx.fillText("遠方へS波到着前のカウントダウンを開始", eewX + 8, eewY + 52);
    }

    // ==========================================
    // 3. 右上エリア：入試頻出「走時曲線グラフ」
    // ==========================================
    const graphX = secW + 20, graphY = 15;
    const graphW = w - graphX - 20, graphH = 175;

    ctx.fillStyle = "#020617";
    ctx.fillRect(graphX, graphY, graphW, graphH);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(graphX, graphY, graphW, graphH);

    // グラフ方眼目盛り
    ctx.strokeStyle = "rgba(51, 65, 85, 0.45)";
    ctx.lineWidth = 1;
    const maxT = 60;   // 横軸: 最大60秒
    const maxD = 450;  // 縦軸: 最大450km

    for (let t = 0; t <= maxT; t += 10) {
      const gx = graphX + (t / maxT) * graphW;
      ctx.beginPath(); ctx.moveTo(gx, graphY); ctx.lineTo(gx, graphY + graphH); ctx.stroke();
      ctx.fillStyle = "#64748b"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(`${t}s`, gx, graphY + graphH + 12);
    }
    for (let d = 0; d <= maxD; d += 100) {
      const gy = graphY + graphH - (d / maxD) * graphH;
      ctx.beginPath(); ctx.moveTo(graphX, gy); ctx.lineTo(graphX + graphW, gy); ctx.stroke();
      ctx.fillStyle = "#64748b"; ctx.textAlign = "right";
      ctx.fillText(`${d}`, graphX - 4, gy + 3);
    }

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📈 走時曲線（そうじきょくせん）", graphX + 8, graphY + 16);

    // P波ライン (青)
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(graphX, graphY + graphH);
    const endPxX = graphX + Math.min(graphW, ((maxD / vP) / maxT) * graphW);
    const endPxY = graphY + graphH - (maxD / maxD) * graphH;
    ctx.lineTo(endPxX, endPxY);
    ctx.stroke();

    // S波ライン (赤)
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(graphX, graphY + graphH);
    const endSxX = graphX + Math.min(graphW, ((maxD / vS) / maxT) * graphW);
    const endSxY = graphY + graphH - (maxD / maxD) * graphH;
    ctx.lineTo(endSxX, endSxY);
    ctx.stroke();

    ctx.fillStyle = "#38bdf8"; ctx.font = "10px sans-serif"; ctx.fillText("P波ライン", endPxX - 45, endPxY + 15);
    ctx.fillStyle = "#f87171"; ctx.fillText("S波ライン", endSxX - 45, endSxY + 15);

    // 地点A・Bの水平ガイドラインと初期微動継続時間
    function drawGraphStation(st, color, d, name) {
      const gy = graphY + graphH - (d / maxD) * graphH;
      const gxP = graphX + ((d / vP) / maxT) * graphW;
      const gxS = graphX + ((d / vS) / maxT) * graphW;

      // 水平線
      ctx.setLineDash([2, 3]);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(graphX, gy);
      ctx.lineTo(gxS, gy);
      ctx.stroke();
      ctx.setLineDash([]);

      // P波・S波交点マーカー
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath(); ctx.arc(gxP, gy, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f87171";
      ctx.beginPath(); ctx.arc(gxS, gy, 3.5, 0, Math.PI * 2); ctx.fill();

      // 初期微動継続時間の両矢印（この2線の幅が継続時間！）
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gxP, gy); ctx.lineTo(gxS, gy); ctx.stroke();

      const dur = (d / vS - d / vP).toFixed(1);
      ctx.fillStyle = "#facc15";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${name}: ${dur}s`, (gxP + gxS) / 2, gy - 4);
    }
    drawGraphStation(stationA, "#38bdf8", dA, "A");
    drawGraphStation(stationB, "#facc15", dB, "B");

    // 現在時間バーのスイープ
    if (isQuakeActive && quakeTime <= maxT) {
      const curBarX = graphX + (quakeTime / maxT) * graphW;
      ctx.strokeStyle = "rgba(250, 204, 21, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(curBarX, graphY); ctx.lineTo(curBarX, graphY + graphH); ctx.stroke();
    }

    // ==========================================
    // 4. 下段エリア：2地点のリアルタイム地震計
    // ==========================================
    const scopeX = 30, scopeW = w - 60;
    const scopeH = 80;

    // 地震計A
    drawSeismoMonitor(scopeX, 215, scopeW, scopeH, "地点Aの地震計（近距離）", stationA, dA, seismogramA, "#38bdf8");

    // 地震計B
    drawSeismoMonitor(scopeX, 310, scopeW, scopeH, "地点Bの地震計（遠距離）", stationB, dB, seismogramB, "#facc15");

    animId = requestAnimationFrame(render);
  }

  function drawSeismoMonitor(bx, by, bw, bh, title, station, dist, arr, themeColor) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    // 方眼目盛り（1秒＝11px）
    const timeScale = 11;
    ctx.strokeStyle = "rgba(51, 65, 85, 0.35)";
    ctx.lineWidth = 1;
    for (let x = bx + 55; x <= bx + bw; x += timeScale * 5) {
      ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + bh); ctx.stroke();
    }
    const centerY = by + bh / 2;
    ctx.strokeStyle = "rgba(100, 116, 139, 0.5)";
    ctx.beginPath(); ctx.moveTo(bx, centerY); ctx.lineTo(bx + bw, centerY); ctx.stroke();

    ctx.fillStyle = themeColor;
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`📊 ${title} [震源距離: ${dist} km]`, bx + 10, by + 16);

    const tP = dist / vP;
    const tS = dist / vS;

    if (isQuakeActive) {
      let disp = 0;
      if (quakeTime >= tS) {
        // 主要動 (S波): 振幅大・低周波
        disp = Math.sin(quakeTime * 12) * 26 + (Math.random() - 0.5) * 7;
      } else if (quakeTime >= tP) {
        // 初期微動 (P波): 振幅小・高周波
        disp = Math.sin(quakeTime * 34) * 6.5 + (Math.random() - 0.5) * 3;
      }
      arr.push({ t: quakeTime, val: disp });
    }

    // 波形
    if (arr.length > 1) {
      ctx.beginPath();
      ctx.lineWidth = 2;
      for (let i = 0; i < arr.length; i++) {
        const pt = arr[i];
        const px = bx + 60 + pt.t * timeScale;
        const py = centerY - pt.val;
        if (px > bx + bw - 5) break;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = themeColor;
      ctx.stroke();
    }

    // 到達ライン
    const pxArrival = bx + 60 + tP * timeScale;
    const sxArrival = bx + 60 + tS * timeScale;

    if (pxArrival < bx + bw - 8) {
      ctx.strokeStyle = "#38bdf8";
      ctx.setLineDash([2, 2]);
      ctx.beginPath(); ctx.moveTo(pxArrival, by + 18); ctx.lineTo(pxArrival, by + bh); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#38bdf8"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("P波到達", pxArrival, by + 28);
    }
    if (sxArrival < bx + bw - 8) {
      ctx.strokeStyle = "#f87171";
      ctx.setLineDash([2, 2]);
      ctx.beginPath(); ctx.moveTo(sxArrival, by + 18); ctx.lineTo(sxArrival, by + bh); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#f87171"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("S波到達", sxArrival, by + 28);

      // 初期微動継続時間の矢印
      const dur = (tS - tP).toFixed(1);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pxArrival, by + bh - 14); ctx.lineTo(sxArrival, by + bh - 14); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pxArrival + 3, by + bh - 17); ctx.lineTo(pxArrival, by + bh - 14); ctx.lineTo(pxArrival + 3, by + bh - 11);
      ctx.moveTo(sxArrival - 3, by + bh - 17); ctx.lineTo(sxArrival, by + bh - 14); ctx.lineTo(sxArrival - 3, by + bh - 11);
      ctx.stroke();

      ctx.fillStyle = "#facc15"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(`初期微動継続時間: ${dur}秒`, (pxArrival + sxArrival) / 2, by + bh - 18);
    }
  }

  render();

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
      canvas.onmousedown = null;
      window.onmousemove = null;
      window.onmouseup = null;
    }
  };
}
















// ========================================================
// 【確実堆積版】流水の働きと海洋への堆積 (中1・地球)
// ========================================================
function initC1Sediment(canvas) {
  const ctx = canvas.getContext('2d');

  let weather = "normal";   // 'normal'(平常時), 'heavy_rain'(大雨・洪水)
  let slopeAngle = 18;      // 傾斜 (10〜30度)
  let streamPos = "up";     // 観察する石: 'up', 'mid', 'down'
  let animId;

  // 実写石画像 (PNG)
  const stoneImages = {
    up: new Image(),
    mid: new Image(),
    down: new Image()
  };
  stoneImages.up.src = 'stone_up.png';
  stoneImages.mid.src = 'stone_mid.png';
  stoneImages.down.src = 'stone_down.png';

  // 堆積層の厚みバッファ (px)
  const gravelLayer = new Float32Array(1000); // れき層 (河口)
  const sandLayer   = new Float32Array(1000); // 砂層 (浅瀬)
  const mudLayer    = new Float32Array(1000); // 泥層 (沖合)

  const particles = [];
  const maxParticles = 150;

  function spawnParticle() {
    const isHeavy = weather === "heavy_rain";
    const rand = Math.random();
    let type = "sand";
    if (rand < 0.33) type = "gravel";
    else if (rand > 0.66) type = "mud";

    const flowSpeed = (isHeavy ? 5.5 : 3.2) * (slopeAngle / 16);

    particles.push({
      type: type,
      x: 20 + Math.random() * 20,
      y: 60 + Math.random() * 15,
      vx: flowSpeed + Math.random() * 0.6,
      vy: Math.sin(slopeAngle * Math.PI / 180) * flowSpeed * 0.8,
      radius: type === "gravel" ? 4.0 : (type === "sand" ? 2.3 : 1.4)
    });
  }

  for (let i = 0; i < 50; i++) spawnParticle();

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>1. 天候と水量（川の流れ）:</label>
      <div style="display:flex; gap:8px;">
        <button class="btn-action ${weather==='normal'?'':'secondary'}" id="bNormal">平常時の流れ（穏やか）</button>
        <button class="btn-action ${weather==='heavy_rain'?'':'secondary'}" id="bHeavy" style="${weather==='heavy_rain'?'background:#ea580c; border-color:#ea580c;':''}">⚡ 大雨・洪水時（濁流）</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>2. 河口スロープの傾斜: <span id="slopeVal" class="ctrl-val">${slopeAngle}°</span></label>
      <input type="range" id="slopeRange" min="10" max="30" value="${slopeAngle}">
    </div>
    <div class="ctrl-group" style="grid-column: 1 / -1;">
      <label>3. 石の採取地・形状変化（実写写真 .png）:</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn-action ${streamPos==='up'?'':'secondary'}" id="sUp">上流の石（角張る・巨礫）</button>
        <button class="btn-action ${streamPos==='mid'?'':'secondary'}" id="sMid">中流の石（丸みを帯びる）</button>
        <button class="btn-action ${streamPos==='down'?'':'secondary'}" id="sDown">下流・河口の石（小さく丸い）</button>
        <button class="btn-action secondary" id="bClear" style="margin-left:auto;">堆積をリセット 🔄</button>
      </div>
    </div>
  `;

  document.getElementById('bNormal').onclick = () => { weather = 'normal'; updateControlView(); updateStatus(); };
  document.getElementById('bHeavy').onclick = () => { weather = 'heavy_rain'; updateControlView(); updateStatus(); };
  document.getElementById('slopeRange').oninput = (e) => {
    slopeAngle = parseInt(e.target.value);
    document.getElementById('slopeVal').textContent = `${slopeAngle}°`;
    updateStatus();
  };
  document.getElementById('sUp').onclick = () => { streamPos = 'up'; updateControlView(); updateStatus(); };
  document.getElementById('sMid').onclick = () => { streamPos = 'mid'; updateControlView(); updateStatus(); };
  document.getElementById('sDown').onclick = () => { streamPos = 'down'; updateControlView(); updateStatus(); };
  document.getElementById('bClear').onclick = () => {
    gravelLayer.fill(0);
    sandLayer.fill(0);
    mudLayer.fill(0);
    particles.length = 0;
    setStatus("海底の堆積物をクリアしました。");
  };

  function updateControlView() {
    const bn = document.getElementById('bNormal');
    const bh = document.getElementById('bHeavy');
    bn.className = `btn-action ${weather==='normal'?'':'secondary'}`;
    bh.className = `btn-action ${weather==='heavy_rain'?'':'secondary'}`;
    bh.style = weather === 'heavy_rain' ? 'background:#ea580c; border-color:#ea580c;' : '';

    document.getElementById('sUp').className = `btn-action ${streamPos==='up'?'':'secondary'}`;
    document.getElementById('sMid').className = `btn-action ${streamPos==='mid'?'':'secondary'}`;
    document.getElementById('sDown').className = `btn-action ${streamPos==='down'?'':'secondary'}`;
  }

  function updateStatus() {
    const isHeavy = weather === "heavy_rain";
    const stoneInfo = streamPos === 'up'
      ? "【上流の石】割れたばかりでゴツゴツと角張っており、粒も巨大です。"
      : (streamPos === 'mid' 
        ? "【中流の石】水流で転がり、ぶつかり合って角が削れて丸みを帯び始めます。"
        : "【下流の石・砂】角が完全に取れて丸く滑らかになり、粒も小さくなります。");

    if (isHeavy) {
      setStatus(`【大雨・洪水時】強烈な濁流により、砂やれきが浅瀬を越えて沖合近くまで押し流されています！ ${stoneInfo}`);
    } else {
      setStatus(`【粒度分級の法則】手前（河口）に「れき」、中央（浅瀬）に「砂」、奥（沖合）に「泥」がはっきりと分かれて堆積します！各層の盛り上がりを観察しましょう。 ${stoneInfo}`);
    }
  }
  updateStatus();

  function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    const seaStartX = 170;
    const waterLevelY = 90;
    const seabedBaseY = h - 110;
    const slopeEndY = waterLevelY + (slopeAngle * 2.8);

    // 海底基盤ライン
    function getSeabedY(x) {
      if (x <= seaStartX) return slopeEndY;
      const ratio = (x - seaStartX) / (w - seaStartX);
      return slopeEndY + ratio * (seabedBaseY - slopeEndY);
    }

    // 海水グラデーション
    const seaGrad = ctx.createLinearGradient(seaStartX, waterLevelY, w, seabedBaseY);
    seaGrad.addColorStop(0, "rgba(6, 182, 212, 0.35)");
    seaGrad.addColorStop(0.5, "rgba(14, 116, 144, 0.5)");
    seaGrad.addColorStop(1, "rgba(15, 23, 42, 0.85)");
    ctx.fillStyle = seaGrad;
    ctx.fillRect(seaStartX, waterLevelY, w - seaStartX - 10, seabedBaseY - waterLevelY);

    // 水面波
    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(seaStartX, waterLevelY);
    for (let x = seaStartX; x < w - 10; x += 15) {
      const wy = waterLevelY + Math.sin(x * 0.05 + Date.now() * 0.003) * 1.8;
      ctx.lineTo(x, wy);
    }
    ctx.stroke();

    // 河口スロープ
    ctx.fillStyle = "#334155";
    ctx.beginPath();
    ctx.moveTo(15, waterLevelY - 35);
    ctx.lineTo(seaStartX, slopeEndY);
    ctx.lineTo(seaStartX, seabedBaseY + 40);
    ctx.lineTo(15, seabedBaseY + 40);
    ctx.closePath();
    ctx.fill();

    // 海底岩盤
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.moveTo(seaStartX, slopeEndY);
    ctx.lineTo(w - 10, seabedBaseY);
    ctx.lineTo(w - 10, seabedBaseY + 40);
    ctx.lineTo(seaStartX, seabedBaseY + 40);
    ctx.closePath();
    ctx.fill();

    // ==========================================
    // 3層の堆積層（積み上げ描画）
    // ==========================================
    // 1. 泥の層（暗灰色：一番上まで積もる）
    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(seaStartX, slopeEndY);
    for (let x = seaStartX; x <= w - 10; x += 3) {
      const i = Math.floor(x);
      const totalH = gravelLayer[i] + sandLayer[i] + mudLayer[i];
      ctx.lineTo(x, getSeabedY(x) - totalH);
    }
    ctx.lineTo(w - 10, seabedBaseY);
    ctx.lineTo(seaStartX, slopeEndY);
    ctx.closePath();
    ctx.fill();

    // 2. 砂の層（黄色：れき層＋砂層）
    ctx.fillStyle = "#eab308";
    ctx.beginPath();
    ctx.moveTo(seaStartX, slopeEndY);
    for (let x = seaStartX; x <= w - 10; x += 3) {
      const i = Math.floor(x);
      const gsH = gravelLayer[i] + sandLayer[i];
      ctx.lineTo(x, getSeabedY(x) - gsH);
    }
    ctx.lineTo(w - 10, seabedBaseY);
    ctx.lineTo(seaStartX, slopeEndY);
    ctx.closePath();
    ctx.fill();

    // 3. れきの層（白灰：れき層のみ）
    ctx.fillStyle = "#cbd5e1";
    ctx.beginPath();
    ctx.moveTo(seaStartX, slopeEndY);
    for (let x = seaStartX; x <= w - 10; x += 3) {
      const i = Math.floor(x);
      ctx.lineTo(x, getSeabedY(x) - gravelLayer[i]);
    }
    ctx.lineTo(w - 10, seabedBaseY);
    ctx.lineTo(seaStartX, slopeEndY);
    ctx.closePath();
    ctx.fill();

    // ==========================================
    // 粒子の物理シミュレーションとゾーン着底
    // ==========================================
    if (particles.length < maxParticles) {
      spawnParticle();
      spawnParticle();
    }

    const isHeavy = weather === "heavy_rain";

    // 濁水エフェクト
    ctx.fillStyle = isHeavy ? "rgba(217, 119, 6, 0.45)" : "rgba(56, 189, 248, 0.35)";
    ctx.beginPath();
    ctx.moveTo(15, waterLevelY - 20);
    ctx.lineTo(seaStartX, slopeEndY);
    ctx.lineTo(seaStartX + (isHeavy ? 280 : 160), slopeEndY + 35);
    ctx.lineTo(seaStartX, slopeEndY + 15);
    ctx.closePath();
    ctx.fill();

    // ゾーンの境界X座標
    const zoneGravelEnd = seaStartX + (isHeavy ? 180 : 110);
    const zoneSandEnd   = seaStartX + (isHeavy ? 360 : 250);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      if (p.x < seaStartX) {
        // スロープ上の滑降
        p.x += p.vx;
        p.y += (p.vx * Math.tan(slopeAngle * Math.PI / 180));
      } else {
        // 海中での移動
        if (p.type === "gravel") {
          // れき：河口で急激に落下
          p.vx *= 0.94;
          p.vy += 0.35;
          p.x += Math.max(0.8, p.vx);
          p.y += p.vy;
        } else if (p.type === "sand") {
          // 砂：河口を飛び越え、浅瀬（中間帯）まで水平に伸びてから落ちる
          if (p.x < zoneGravelEnd - 30) {
            p.vy += 0.05; // まだあまり落とさない
            p.x += Math.max(2.4, p.vx * 0.95);
          } else {
            p.vy += 0.22; // 浅瀬に入ったら急降下
            p.vx *= 0.96;
            p.x += Math.max(1.2, p.vx);
          }
          p.y += p.vy;
        } else {
          // 泥：水流と浮力で沖合まで一気に運ばれる
          if (p.x < zoneSandEnd - 20) {
            p.vy = (p.vy * 0.8) + 0.02; // 水面近くを浮遊
            p.x += Math.max(2.8, p.vx);
          } else {
            p.vy += 0.18; // 沖合に入ったら確実に底へ沈殿
            p.vx *= 0.97;
            p.x += Math.max(1.0, p.vx);
          }
          p.y += p.vy;
        }
      }

      // 地面・堆積面との当たり判定
      const curIdx = Math.min(gravelLayer.length - 1, Math.max(0, Math.floor(p.x)));
      const surfaceY = getSeabedY(p.x) - (gravelLayer[curIdx] + sandLayer[curIdx] + mudLayer[curIdx]);

      // 着底判定
      if (p.x >= seaStartX && p.y >= surfaceY) {
        const addWidth = p.type === "gravel" ? 4 : (p.type === "sand" ? 6 : 8);
        const addAmount = p.type === "gravel" ? 1.0 : (p.type === "sand" ? 0.85 : 0.7);

        for (let d = -addWidth; d <= addWidth; d++) {
          const idx = curIdx + d;
          if (idx >= 0 && idx < gravelLayer.length) {
            const factor = 1 - (Math.abs(d) / (addWidth + 1));
            if (p.type === "gravel") {
              if (gravelLayer[idx] < 45) gravelLayer[idx] += addAmount * factor;
            } else if (p.type === "sand") {
              if (sandLayer[idx] < 45) sandLayer[idx] += addAmount * factor;
            } else {
              if (mudLayer[idx] < 45) mudLayer[idx] += addAmount * factor;
            }
          }
        }
        particles.splice(i, 1);
        continue;
      }

      // 最奥（画面端）に到達した泥粒子の着底処理
      if (p.x >= w - 15) {
        const edgeIdx = Math.floor(w - 20);
        if (mudLayer[edgeIdx] < 45) mudLayer[edgeIdx] += 0.8;
        particles.splice(i, 1);
        continue;
      }
      if (p.y > h) {
        particles.splice(i, 1);
        continue;
      }

      // 粒子の描画
      ctx.beginPath();
      if (p.type === "gravel") {
        ctx.fillStyle = "#f8fafc";
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === "sand") {
        ctx.fillStyle = "#facc15";
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#94a3b8";
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ==========================================
    // ゾーンラベルと境界線
    // ==========================================
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";

    // れきラベル
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("【河口付近】", seaStartX + 55, seabedBaseY + 20);
    ctx.fillText("れき層（白灰）", seaStartX + 55, seabedBaseY + 36);

    // 砂ラベル
    ctx.fillStyle = "#facc15";
    ctx.fillText("【浅い海】", (zoneGravelEnd + zoneSandEnd) / 2, seabedBaseY + 20);
    ctx.fillText("砂層（黄）", (zoneGravelEnd + zoneSandEnd) / 2, seabedBaseY + 36);

    // 泥ラベル
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("【深い沖合】", (zoneSandEnd + w - 10) / 2, seabedBaseY + 20);
    ctx.fillText("泥層（暗灰）", (zoneSandEnd + w - 10) / 2, seabedBaseY + 36);

    // 境界点線
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
    ctx.beginPath();
    ctx.moveTo(zoneGravelEnd, waterLevelY);
    ctx.lineTo(zoneGravelEnd, seabedBaseY);
    ctx.moveTo(zoneSandEnd, waterLevelY);
    ctx.lineTo(zoneSandEnd, seabedBaseY);
    ctx.stroke();
    ctx.setLineDash([]);

    // 左下：実写石レンズ (.png)
    drawStoneLens(ctx, 20, h - 90, 68);

    animId = requestAnimationFrame(render);
  }
  render();

  function drawStoneLens(ctx, x, y, r) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x + r, y + 10, r * 0.75, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(x, y - 40, r * 2, r * 2);

    const img = stoneImages[streamPos];
    if (img.complete && img.naturalWidth !== 0) {
      ctx.drawImage(img, x, y - 35, r * 1.5, r * 1.5);
    } else {
      ctx.fillStyle = "#94a3b8";
      ctx.strokeStyle = "#f8fafc";
      ctx.lineWidth = 2;
      const lx = x + r, ly = y + 10;
      ctx.beginPath();
      if (streamPos === "up") {
        ctx.moveTo(lx - 28, ly - 18);
        ctx.lineTo(lx + 15, ly - 22);
        ctx.lineTo(lx + 32, ly + 4);
        ctx.lineTo(lx + 8, ly + 25);
        ctx.lineTo(lx - 25, ly + 14);
      } else if (streamPos === "mid") {
        ctx.ellipse(lx, ly, 28, 19, 0.3, 0, Math.PI * 2);
      } else {
        ctx.ellipse(lx, ly, 22, 14, 0, 0, Math.PI * 2);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(x + r, y + 10, r * 0.75, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    const name = streamPos === 'up' ? "上流（角張る）" : (streamPos === 'mid' ? "中流（やや丸い）" : "下流（丸小石・砂）");
    ctx.fillText(`🔬 ${name}`, x + 5, y - 42);
  }

  return {
    destroy: () => cancelAnimationFrame(animId)
  };
}

















// 炭酸水素ナトリウム熱分解 (中2・物質)
function initC2Heat(canvas) {
  const ctx = canvas.getContext('2d');
  let heating = false;
  let glassTubeInWater = true;
  let temp = 20;
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>ガスバーナー加熱:</label>
      <button class="btn-action ${heating?'':'secondary'}" id="bHeat">${heating?'加熱停止':'加熱開始 🔥'}</button>
    </div>
    <div class="ctrl-group">
      <label>ガラス管の操作 (重要):</label>
      <button class="btn-action ${glassTubeInWater?'secondary':''}" id="bTube">${glassTubeInWater?'石灰水から抜く':'石灰水に入れる'}</button>
    </div>
  `;

  document.getElementById('bHeat').onclick = () => {
    if (heating && glassTubeInWater) {
      setStatus("【危険・逆流注意！】火を消す前に必ずガラス管を石灰水から抜いてください！冷えた試験管に液体が逆流して破損します！", true);
      return;
    }
    heating = !heating;
    document.getElementById('bHeat').className = `btn-action ${heating?'':'secondary'}`;
    document.getElementById('bHeat').textContent = heating ? '加熱停止' : '加熱開始 🔥';
  };

  document.getElementById('bTube').onclick = () => {
    glassTubeInWater = !glassTubeInWater;
    document.getElementById('bTube').textContent = glassTubeInWater ? '石灰水から抜く' : '石灰水に入れる';
  };

  function loop() {
    if (heating && temp < 200) temp += 0.5;
    if (!heating && temp > 20) temp -= 0.3;

    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 4;
    ctx.strokeRect(w/2 - 120, h/2 - 30, 160, 40);

    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(w/2 - 116, h/2 - 10, 50, 16);

    if (heating) {
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(w/2 - 90, h/2 + 25, 12, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.strokeRect(w/2 + 80, h/2 - 10, 60, 70);
    ctx.fillStyle = temp > 80 && glassTubeInWater ? "rgba(255,255,255,0.8)" : "rgba(56,189,248,0.3)";
    ctx.fillRect(w/2 + 82, h/2 + 15, 56, 43);

    if (temp > 80 && glassTubeInWater) {
      setStatus("【熱分解中】二酸化炭素が発生し石灰水が白く濁っています。管口には水滴が付着しています。");
    }

    animId = requestAnimationFrame(loop);
  }
  loop();

  return { destroy: () => cancelAnimationFrame(animId) };
}

// オームの法則 (中2・エネルギー)
function initC2Ohm(canvas) {
  const ctx = canvas.getContext('2d');
  let volt = 4;
  let res = 10;
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
    <div class="ctrl-group">
      <label>電源電圧: <span id="vVal" class="ctrl-val">${volt} V</span></label>
      <input type="range" id="vRange" min="1" max="12" value="${volt}">
    </div>
    <div class="ctrl-group">
      <label>抵抗器の抵抗値: <span id="rVal" class="ctrl-val">${res} Ω</span></label>
      <input type="range" id="rRange" min="2" max="30" value="${res}">
    </div>
  `;

  document.getElementById('vRange').oninput = (e) => {
    volt = parseInt(e.target.value);
    document.getElementById('vVal').textContent = `${volt} V`;
  };
  document.getElementById('rRange').oninput = (e) => {
    res = parseInt(e.target.value);
    document.getElementById('rVal').textContent = `${res} Ω`;
  };

  function render() {
    const current = volt / res;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    const cx = w/2, cy = h/2;
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 3;
    ctx.strokeRect(cx - 120, cy - 70, 240, 140);

    ctx.fillStyle = "#ffffff";
    ctx.font = "18px sans-serif";
    ctx.fillText(`電流 I = ${(current*1000).toFixed(0)} mA (${current.toFixed(2)} A)`, cx - 90, cy - 20);
    ctx.fillText(`電圧 V = ${volt} V`, cx - 90, cy + 15);
    ctx.fillText(`抵抗 R = ${res} Ω`, cx - 90, cy + 45);

    setStatus(`【オームの法則: I = V / R】電圧を上げると電流は比例して増え、抵抗を増やすと電流は反比例して減少します。`);
    animId = requestAnimationFrame(render);
  }
  render();

  return { destroy: () => cancelAnimationFrame(animId) };
}

// デンプンの消化 (中2・生命)
function initC2Digestion(canvas) {
  const ctx = canvas.getContext('2d');
  let reagent = 'iodine';
  let hasSaliva = true;
  let heated = false;
  let animId;

  const controls = document.getElementById('labControlsArea');
  controls.innerHTML = `
