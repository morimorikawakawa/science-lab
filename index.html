        vy: (Math.random() - 0.5) * 0.6,
        energy: 180,
        hunger: 0
      });
    }
  }

  function resetEcosystem() {
    plants.length = 0;
    herbivores.length = 0;
    carnivores.length = 0;
    deadRemains.length = 0;
    co2Particles.length = 0;
    history.length = 0;
    ecoScore = 0;

    spawnPlant(45);
    spawnRabbit(16);
    spawnFox(3); // 初期キツネは3匹でスタート

    const { fx, fy, fw, fh } = getFieldBounds(canvas.width - 260, canvas.height);
    decomposers.length = 0;
    for (let i = 0; i < 8; i++) {
      decomposers.push({
        x: fx + 20 + (i * (fw - 40) / 7),
        y: fy + fh + 18,
        pulse: Math.random() * Math.PI
      });
    }
  }
  resetEcosystem();

  const controls = document.getElementById('labControlsArea');

  function renderControls() {
    controls.innerHTML = `
      <div class="ctrl-group" style="grid-column: 1 / -1;">
        <label>🐾 生き物を直接投入（ボタンを押すと即出現！草原クリックでも配置可能）：</label>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <button class="btn-action" id="tPlant" style="background:#16a34a; border-color:#16a34a; flex:1; font-size:12px; font-weight:bold; padding:8px 4px;">
            🌱 草を植える (+5株)
          </button>
          <button class="btn-action" id="tRabbit" style="background:#0284c7; border-color:#0284c7; flex:1; font-size:12px; font-weight:bold; padding:8px 4px;">
            🐇 ウサギを放つ (+3匹)
          </button>
          <button class="btn-action" id="tFox" style="background:#ea580c; border-color:#ea580c; flex:1; font-size:12px; font-weight:bold; padding:8px 4px;">
            🦊 キツネを放つ (+1匹)
          </button>
        </div>
      </div>

      <div class="ctrl-group" style="grid-column: 1 / -1;">
        <label>⚡ 神の介入イベント（ハプニングを起こして自動調節を観察）：</label>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <button class="btn-action" id="bHunt" style="flex:1; background:#ef4444; border-color:#ef4444; font-size:11px; padding:7px 3px;">🏹 草食乱獲 (激減)</button>
          <button class="btn-action" id="bInvade" style="flex:1; background:#f59e0b; border-color:#f59e0b; font-size:11px; padding:7px 3px;">🐰 外来種大発生</button>
          <button class="btn-action" id="bRain" style="flex:1; background:#0284c7; border-color:#0284c7; font-size:11px; padding:7px 3px;">🌧️ 恵みの雨 (植物増)</button>
          <button class="btn-action" id="bBioAcc" style="flex:1; background:#7c3aed; border-color:#7c3aed; font-size:11px; padding:7px 3px;">☣️ 生物濃縮 (頂点激減)</button>
        </div>
      </div>

      <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; gap:8px;">
        <button class="btn-action secondary" id="bPauseGame" style="flex:1; font-size:12px;">
          ${isRunning ? 'シミュレーション一時停止 ⏸️' : '再開 ▶️'}
        </button>
        <button class="btn-action secondary" id="bResetEco" style="flex:1; font-size:12px;">
          初期バランスに戻す 🔄
        </button>
      </div>
    `;

    document.getElementById('tPlant').onclick = () => {
      clickTool = 'plant';
      spawnPlant(5);
      setStatus("【草を植えました】生産者が+5株増えました！草食動物のエサが豊かになります。");
    };

    document.getElementById('tRabbit').onclick = () => {
      clickTool = 'rabbit';
      spawnRabbit(3);
      setStatus("【ウサギを放ちました】一次消費者が+3匹増えました！草を食べて繁殖を狙います。");
    };

    document.getElementById('tFox').onclick = () => {
      clickTool = 'fox';
      spawnFox(1);
      setStatus("【キツネを放ちました】二次消費者が+1匹投入されました！縄張りを広げます。");
    };

    document.getElementById('bHunt').onclick = () => {
      herbivores.splice(0, Math.floor(herbivores.length * 0.7));
      setStatus("【草食動物の乱獲！】ウサギが激減！➔ 食べられる草が増加し、エサ不足になったキツネが減少を開始。自然の自動調節が始まります。");
    };

    document.getElementById('bInvade').onclick = () => {
      spawnRabbit(18);
      setStatus("【外来種の侵入！】ウサギが大量発生！➔ 草原が食い荒らされて砂漠化寸前になり、キツネが一時的に急増します。");
    };

    document.getElementById('bRain').onclick = () => {
      spawnPlant(25);
      setStatus("【恵みの雨】光合成が活発化し植物が急成長！草食・肉食すべての生物量が増加サイクルに入ります。");
    };

    document.getElementById('bBioAcc').onclick = () => {
      carnivores.splice(0, Math.floor(carnivores.length * 0.75));
      setStatus("【生物濃縮の警鐘！】食物連鎖の上位捕食者（キツネ）に毒素が高濃度に蓄積して倒れました！天敵がいなくなったウサギが増加します。", true);
    };

    document.getElementById('bPauseGame').onclick = () => {
      isRunning = !isRunning;
      renderControls();
    };

    document.getElementById('bResetEco').onclick = () => {
      resetEcosystem();
      renderControls();
      setStatus("生態系を初期の理想バランスにリセットしました。ボタンを押して生き物を追加してみましょう！");
    };
  }

  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const bounds = getFieldBounds(canvas.width - 260, canvas.height);

    if (mx >= bounds.fx && mx <= bounds.fx + bounds.fw && my >= bounds.fy && my <= bounds.fy + bounds.fh) {
      if (clickTool === 'plant') {
        spawnPlant(2, { x: mx, y: my });
      } else if (clickTool === 'rabbit') {
        spawnRabbit(1, { x: mx, y: my });
      } else if (clickTool === 'fox') {
        spawnFox(1, { x: mx, y: my });
      }
    }
  };

  function updateStatus() {
    setStatus("【自然の自動調節機能（動的平衡）】一時的に特定の生物が増減しても、食べる・食べられる関係を通じて長い時間をかけて元のピラミッド比率へと戻っていきます。");
  }

  renderControls();
  updateStatus();

  function loop() {
    tick++;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    const rightPanelW = 255;
    const mainFieldW = w - rightPanelW - 30;
    const bounds = getFieldBounds(mainFieldW, h);

    if (isRunning) {
      const isHealthy = plants.length >= 20 && herbivores.length >= 8 && carnivores.length >= 1 && carnivores.length <= 5;
      if (isHealthy) {
        ecoScore += 1;
        ecoStatusTitle = ecoScore > 1000 ? "🌟 マスター・エコロジスト (完全調和)" : (ecoScore > 300 ? "🌿 豊かな安定草原" : "調和のとれた草原");
      } else {
        ecoStatusTitle = carnivores.length > herbivores.length ? "⚠️ 捕食過多 (ピラミッド崩壊)" : (carnivores.length === 0 ? "⚠️ 肉食不在" : "自然の自律回復中…");
      }

      // --- 連鎖復活ロジック ---
      // 草が豊富（25株以上）なのにウサギが少ない（6匹未満）➔ ウサギがやってくる！
      if (plants.length >= 25 && herbivores.length < 6 && tick % 80 === 0) {
        spawnRabbit(1);
      }

      // ウサギが十分多い（12匹以上）のにキツネが少ない（2匹未満）➔ キツネが1匹やってくる！
      if (herbivores.length >= 12 && carnivores.length < 2 && tick % 150 === 0) {
        spawnFox(1);
      }

      // 1. 植物の繁殖（最大80株）
      if (tick % 40 === 0 && plants.length < 80) {
        if (plants.length > 0 && Math.random() < 0.6) {
          const parent = plants[Math.floor(Math.random() * plants.length)];
          const nx = Math.max(bounds.fx + 10, Math.min(bounds.fx + bounds.fw - 10, parent.x + (Math.random() - 0.5) * 40));
          const ny = Math.max(bounds.fy + 10, Math.min(bounds.fy + bounds.fh - 10, parent.y + (Math.random() - 0.5) * 40));
          plants.push({ x: nx, y: ny, size: 3.5 });
        } else {
          plants.push({ x: bounds.fx + 10 + Math.random() * (bounds.fw - 20), y: bounds.fy + 10 + Math.random() * (bounds.fh - 20), size: 3.5 });
        }
      }

      // 2. ウサギ（草食）AI
      for (let i = herbivores.length - 1; i >= 0; i--) {
        const r = herbivores[i];
        r.age++;
        r.energy -= 0.12;

        // キツネ感知（逃走）
        let threatFox = null;
        let minFoxDist = 60;
        carnivores.forEach(f => {
          const d = Math.hypot(r.x - f.x, r.y - f.y);
          if (d < minFoxDist) { minFoxDist = d; threatFox = f; }
        });

        if (threatFox) {
          r.vx = (r.x - threatFox.x) * 0.035;
          r.vy = (r.y - threatFox.y) * 0.035;
          r.panic = 15;
        } else {
          if (r.panic > 0) r.panic--;
          let nearestP = null;
          let minPDist = 80;
          plants.forEach(p => {
            const d = Math.hypot(r.x - p.x, r.y - p.y);
            if (d < minPDist) { minPDist = d; nearestP = p; }
          });

          if (nearestP) {
            r.vx = (nearestP.x - r.x) * 0.015;
            r.vy = (nearestP.y - r.y) * 0.015;
          } else {
            r.vx += (Math.random() - 0.5) * 0.1;
            r.vy += (Math.random() - 0.5) * 0.1;
          }
        }

        // ウサギ同士の反発（密集回避）
        herbivores.forEach(otherR => {
          if (r !== otherR) {
            const d = Math.hypot(r.x - otherR.x, r.y - otherR.y);
            if (d < 16 && d > 0) {
              r.vx += (r.x - otherR.x) * 0.04;
              r.vy += (r.y - otherR.y) * 0.04;
            }
          }
        });

        const speed = Math.hypot(r.vx, r.vy);
        const maxSpd = r.panic > 0 ? 1.4 : 0.7;
        if (speed > maxSpd) {
          r.vx = (r.vx / speed) * maxSpd;
          r.vy = (r.vy / speed) * maxSpd;
        }

        r.x += r.vx;
        r.y += r.vy;

        if (r.x < bounds.fx + 8) { r.x = bounds.fx + 8; r.vx *= -1; }
        if (r.x > bounds.fx + bounds.fw - 8) { r.x = bounds.fx + bounds.fw - 8; r.vx *= -1; }
        if (r.y < bounds.fy + 8) { r.y = bounds.fy + 8; r.vy *= -1; }
        if (r.y > bounds.fy + bounds.fh - 8) { r.y = bounds.fy + bounds.fh - 8; r.vy *= -1; }

        for (let pIdx = plants.length - 1; pIdx >= 0; pIdx--) {
          const p = plants[pIdx];
          if (Math.hypot(r.x - p.x, r.y - p.y) < 14) {
            plants.splice(pIdx, 1);
            r.energy += 35;
            break;
          }
        }

        // 繁殖（ウサギが多すぎないとき）
        if (r.energy > 150 && herbivores.length < 35) {
          r.energy = 80;
          herbivores.push({
            x: r.x + (Math.random() - 0.5) * 12,
            y: r.y + (Math.random() - 0.5) * 12,
            vx: (Math.random() - 0.5) * 0.7,
            vy: (Math.random() - 0.5) * 0.7,
            energy: 75, panic: 0, age: 0
          });
        }

        if (r.energy <= 0 || r.age > 2500) {
          deadRemains.push({ x: r.x, y: r.y, alpha: 1.0, type: "bone" });
          herbivores.splice(i, 1);
        }
      }

      // 3. キツネ（肉食）AI：縄張りと密集防止
      for (let i = carnivores.length - 1; i >= 0; i--) {
        const f = carnivores[i];
        
        // ウサギが極端に少ない時は飢えやすくなる（ピラミッド維持）
        const hungerRate = herbivores.length < 5 ? 0.35 : 0.16;
        f.energy -= hungerRate;

        let targetH = null;
        let minHDist = 120;
        herbivores.forEach(hA => {
          const d = Math.hypot(f.x - hA.x, f.y - hA.y);
          if (d < minHDist) { minHDist = d; targetH = hA; }
        });

        if (targetH) {
          f.vx = (targetH.x - f.x) * 0.018;
          f.vy = (targetH.y - f.y) * 0.018;
        } else {
          f.vx += (Math.random() - 0.5) * 0.08;
          f.vy += (Math.random() - 0.5) * 0.08;
        }

        // ★キツネ同士の縄張り反発（団子状態の完全解消）
        carnivores.forEach(otherF => {
          if (f !== otherF) {
            const d = Math.hypot(f.x - otherF.x, f.y - otherF.y);
            if (d < 35 && d > 0) { // 35px以内のキツネは強い反発で散らばる
              f.vx += (f.x - otherF.x) * 0.06;
              f.vy += (f.y - otherF.y) * 0.06;
            }
          }
        });

        const fSpeed = Math.hypot(f.vx, f.vy);
        const maxFSpd = targetH ? 1.0 : 0.55;
        if (fSpeed > maxFSpd) {
          f.vx = (f.vx / fSpeed) * maxFSpd;
          f.vy = (f.vy / fSpeed) * maxFSpd;
        }

        f.x += f.vx;
        f.y += f.vy;

        if (f.x < bounds.fx + 10) { f.x = bounds.fx + 10; f.vx *= -1; }
        if (f.x > bounds.fx + bounds.fw - 10) { f.x = bounds.fx + bounds.fw - 10; f.vx *= -1; }
        if (f.y < bounds.fy + 10) { f.y = bounds.fy + 10; f.vy *= -1; }
        if (f.y > bounds.fy + bounds.fh - 10) { f.y = bounds.fy + bounds.fh - 10; f.vy *= -1; }

        // 捕食
        for (let hIdx = herbivores.length - 1; hIdx >= 0; hIdx--) {
          const hA = herbivores[hIdx];
          if (Math.hypot(f.x - hA.x, f.y - hA.y) < 16) {
            deadRemains.push({ x: hA.x, y: hA.y, alpha: 1.0, type: "hunt" });
            herbivores.splice(hIdx, 1);
            f.energy += 80;
            break;
          }
        }

        // 繁殖（★最大でも5匹まで！それ以上は繁殖させずピラミッド崩壊を防ぐ）
        if (f.energy > 300 && carnivores.length < 5 && herbivores.length >= 8) {
          f.energy = 150;
          carnivores.push({
            x: f.x + (Math.random() - 0.5) * 20,
            y: f.y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            energy: 140, hunger: 0
          });
        }

        // 餓死
        if (f.energy <= 0) {
          deadRemains.push({ x: f.x, y: f.y, alpha: 1.0, type: "bone" });
          carnivores.splice(i, 1);
        }
      }

      // 4. 分解者の炭素循環
      for (let i = deadRemains.length - 1; i >= 0; i--) {
        const d = deadRemains[i];
        d.y += 0.1;
        d.alpha -= 0.005;

        if (d.y > bounds.fy + bounds.fh) {
          co2Particles.push({
            x: d.x,
            y: bounds.fy + bounds.fh + 15,
            vy: -0.4 - Math.random() * 0.3,
            alpha: 1.0
          });
          deadRemains.splice(i, 1);
        } else if (d.alpha <= 0) {
          deadRemains.splice(i, 1);
        }
      }

      for (let i = co2Particles.length - 1; i >= 0; i--) {
        const c = co2Particles[i];
        c.y += c.vy;
        c.alpha -= 0.01;
        if (c.alpha <= 0) co2Particles.splice(i, 1);
      }

      if (tick % 10 === 0) {
        history.push({
          plant: plants.length,
          herb: herbivores.length,
          carn: carnivores.length
        });
        if (history.length > maxHistory) history.shift();
      }
    }

    drawLivingField(15, 15, mainFieldW, h - 30, bounds);
    drawEcoAnalyticsPanel(w - rightPanelW - 15, 15, rightPanelW, h - 30);

    animId = requestAnimationFrame(loop);
  }
  loop();

  function drawLivingField(bx, by, bw, bh, bounds) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`🎮 ${ecoStatusTitle}`, bx + 14, by + 22);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "right";
    ctx.fillText(`ECO-SCORE: ${ecoScore}`, bx + bw - 14, by + 22);

    const arenaGrad = ctx.createLinearGradient(bounds.fx, bounds.fy, bounds.fx, bounds.fy + bounds.fh);
    arenaGrad.addColorStop(0, "#166534");
    arenaGrad.addColorStop(1, "#14532d");
    ctx.fillStyle = arenaGrad;
    ctx.fillRect(bounds.fx, bounds.fy, bounds.fw, bounds.fh);
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 2;
    ctx.strokeRect(bounds.fx, bounds.fy, bounds.fw, bounds.fh);

    // 植物
    plants.forEach(p => {
      ctx.fillStyle = "#4ade80";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 4, 2.5, 0.3, 0, Math.PI * 2);
      ctx.ellipse(p.x, p.y, 2.5, 4, -0.3, 0, Math.PI * 2);
      ctx.fill();
    });

    // 死骸
    deadRemains.forEach(d => {
      ctx.save();
      ctx.globalAlpha = d.alpha;
      ctx.fillStyle = "#cbd5e1";
      ctx.beginPath();
      ctx.arc(d.x - 3, d.y, 2, 0, Math.PI * 2);
      ctx.arc(d.x + 3, d.y, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(d.x - 2, d.y - 1, 4, 2);
      ctx.restore();
    });

    // ウサギ
    herbivores.forEach(hA => {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(hA.x, hA.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = hA.panic > 0 ? "#ef4444" : "#94a3b8";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = "#fbcfe8";
      ctx.fillRect(hA.x - 3, hA.y - 9, 2, 5);
      ctx.fillRect(hA.x + 1, hA.y - 9, 2, 5);

      ctx.fillStyle = hA.panic > 0 ? "#ef4444" : "#000000";
      ctx.fillRect(hA.x + (hA.vx > 0 ? 1 : -3), hA.y - 2, 2, 2);
    });

    // キツネ
    carnivores.forEach(cA => {
      ctx.fillStyle = "#ea580c";
      ctx.beginPath();
      ctx.arc(cA.x, cA.y, 8.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fed7aa";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cA.x + (cA.vx > 0 ? 4 : -4), cA.y + 2, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#c2410c";
      ctx.beginPath();
      ctx.arc(cA.x - (cA.vx > 0 ? 8 : -8), cA.y + 2, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    // 地下分解者ゾーン
    const soilY = bounds.fy + bounds.fh;
    const soilH = bh - (soilY - by) - 15;
    ctx.fillStyle = "#27170a";
    ctx.fillRect(bounds.fx, soilY, bounds.fw, soilH);
    ctx.strokeStyle = "#78350f";
    ctx.lineWidth = 2;
    ctx.strokeRect(bounds.fx, soilY, bounds.fw, soilH);

    decomposers.forEach(d => {
      d.pulse += 0.05;
      const wave = Math.sin(d.pulse) * 1.5;
      ctx.fillStyle = "#f43f5e";
      ctx.beginPath();
      ctx.arc(d.x, soilY + 12 + wave, 5, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#fef08a";
      ctx.fillRect(d.x - 1.5, soilY + 12 + wave, 3, 7);
    });

    co2Particles.forEach(c => {
      ctx.save();
      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 8px sans-serif";
      ctx.fillText("CO₂", c.x, c.y);
      ctx.restore();
    });

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🍄 地下の分解者（菌類・細菌）➔ 死骸を有機物からCO₂へ分解し、植物へ還流！", bounds.fx + 8, soilY + soilH - 8);
  }

  function drawEcoAnalyticsPanel(gx, gy, gw, gh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(gx, gy, gw, gh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(gx, gy, gw, gh);

    drawPyramidSection(gx + 10, gy + 15, gw - 20, 115);
    drawHistoryGraphSection(gx + 10, gy + 140, gw - 20, gh - 155);
  }

  function drawPyramidSection(x, y, w, h) {
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🔺 生態系ピラミッド (生物量)", x, y + 2);

    const cx = x + w / 2;
    const baseY = y + h - 6;
    const tierH = 22;

    const plantW = Math.min(w - 10, Math.max(28, plants.length * 2.6));
    const herbW = Math.min(w - 20, Math.max(18, herbivores.length * 5.2));
    const carnW = Math.min(w - 35, Math.max(14, carnivores.length * 18.0));

    // 生産者
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(cx - plantW / 2, baseY - tierH, plantW, tierH);
    ctx.strokeStyle = "#4ade80";
    ctx.strokeRect(cx - plantW / 2, baseY - tierH, plantW, tierH);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`生産者 (植物: ${plants.length})`, cx, baseY - 8);

    // 一次消費者
    ctx.fillStyle = "#ca8a04";
    ctx.fillRect(cx - herbW / 2, baseY - tierH * 2 - 3, herbW, tierH);
    ctx.strokeStyle = "#facc15";
    ctx.strokeRect(cx - herbW / 2, baseY - tierH * 2 - 3, herbW, tierH);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(`一次消費者 (ウサギ: ${herbivores.length})`, cx, baseY - tierH - 11);

    // 二次消費者
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(cx - carnW / 2, baseY - tierH * 3 - 6, carnW, tierH);
    ctx.strokeStyle = "#f87171";
    ctx.strokeRect(cx - carnW / 2, baseY - tierH * 3 - 6, carnW, tierH);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(`二次消費者 (キツネ: ${carnivores.length})`, cx, baseY - tierH * 2 - 14);
  }

  function drawHistoryGraphSection(x, y, w, h) {
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📈 個体数の時間変化 (動的平衡)", x, y + 2);

    const gx = x + 24, gy = y + 16;
    const gw = w - 28, gh = h - 45;

    ctx.strokeStyle = "rgba(51, 65, 85, 0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(gx, gy, gw, gh);

    ctx.font = "8px sans-serif";
    ctx.fillStyle = "#4ade80"; ctx.fillText("― 植物", gx + 6, gy + 11);
    ctx.fillStyle = "#facc15"; ctx.fillText("― 草食", gx + 54, gy + 11);
    ctx.fillStyle = "#f87171"; ctx.fillText("― 肉食", gx + 102, gy + 11);

    if (history.length > 1) {
      ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 1.5; ctx.beginPath();
      history.forEach((pt, i) => {
        const px = gx + (i / maxHistory) * gw;
        const py = gy + gh - Math.min(gh - 2, (pt.plant / 80) * gh);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();

      ctx.strokeStyle = "#facc15"; ctx.lineWidth = 1.5; ctx.beginPath();
      history.forEach((pt, i) => {
        const px = gx + (i / maxHistory) * gw;
        const py = gy + gh - Math.min(gh - 2, (pt.herb / 45) * gh);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();

      ctx.strokeStyle = "#f87171"; ctx.lineWidth = 1.5; ctx.beginPath();
      history.forEach((pt, i) => {
        const px = gx + (i / maxHistory) * gw;
        const py = gy + gh - Math.min(gh - 2, (pt.carn / 14) * gh);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();
    }

    const footY = gy + gh + 14;
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "8px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("※草が増えるとウサギが復活し、ウサギが", x, footY);
    ctx.fillText(" 増えるとキツネが山から戻る自律サイクル！", x, footY + 11);
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
      canvas.onmousedown = null;
    }
  };
}
















































</script>
