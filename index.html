  updateStatus();

  // ========================================================
  // メイン描画ループ
  // ========================================================
  function render() {
    vaporTick += 0.04;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    const leftW = w - 240;

    // 1. 実験フラスコベンチ（左側）
    drawFlaskBench(leftW, h);

    // 2. 右側パネル（実写写真枠 & 気象プロセスまとめ表）
    const rightX = w - 230, rightW = 215;
    drawPhotoPreviewBox(rightX, 15, rightW, 140);
    drawCloudProcessTable(rightX, 165, rightW, h - 180);

    animId = requestAnimationFrame(render);
  }
  render();

  // ========================================================
  // A. 実験フラスコベンチ（位置関係の被りを徹底解消）
  // ========================================================
  function drawFlaskBench(bw, bh) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(15, 15, bw - 20, bh - 30);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(15, 15, bw - 20, bh - 30);

    // 見出し（もっと上の Y=28 に）
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("☁️ 雲のでき方と断熱膨張シミュレーター", 28, 28);

    // フラスコの中心・サイズを下方へシフトしてゆとりを確保
    const flaskCX = bw / 2 - 25;
    const flaskCY = bh / 2 + 10; // 少し下げて上部の余白に
    const flaskR = 65;           // 半径をコンパクトにして重なりを解消

    // フラスコの首 (Y=30のメインロゴに絶対に被らない位置に配置)
    ctx.fillStyle = "rgba(56, 189, 248, 0.08)";
    ctx.fillRect(flaskCX - 18, flaskCY - flaskR - 40, 36, 45);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(flaskCX - 18, flaskCY - flaskR - 40, 36, 45);

    // フラスコ球体
    ctx.beginPath();
    ctx.arc(flaskCX, flaskCY, flaskR, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(56, 189, 248, 0.06)";
    ctx.fill();
    ctx.stroke();

    // 白濁（雲）エフェクト
    if (cloudDensity > 0.02) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(flaskCX, flaskCY, flaskR - 3, 0, Math.PI * 2);
      ctx.clip();

      ctx.fillStyle = `rgba(255, 255, 255, ${cloudDensity})`;
      ctx.fillRect(flaskCX - flaskR, flaskCY - flaskR, flaskR * 2, flaskR * 2);

      ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.75, cloudDensity * 0.85)})`;
      for (let i = 0; i < 7; i++) {
        const cx = flaskCX + Math.sin(vaporTick + i) * 25;
        const cy = flaskCY + Math.cos(vaporTick * 0.8 + i) * 25;
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 底部の水滴
    if (hasWater) {
      ctx.fillStyle = "rgba(14, 165, 233, 0.35)";
      ctx.beginPath();
      ctx.arc(flaskCX, flaskCY, flaskR - 3, Math.PI * 0.25, Math.PI * 0.75);
      ctx.fill();
    }

    // 線香の煙（微小粒子）
    if (hasSmoke && cloudDensity < 0.3) {
      ctx.fillStyle = "rgba(203, 213, 225, 0.45)";
      for (let i = 0; i < 12; i++) {
        const sx = flaskCX - 22 + (i * 12345 % 44);
        const sy = flaskCY - 30 + (i * 54321 % 60);
        ctx.beginPath();
        ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ゴム栓
    const stopperY = flaskCY - flaskR - 50;
    if (!isPopped) {
      ctx.fillStyle = "#334155";
      ctx.fillRect(flaskCX - 17, stopperY, 34, 12);
      ctx.strokeStyle = "#94a3b8";
      ctx.strokeRect(flaskCX - 17, stopperY, 34, 12);
    } else {
      // Y=35のタイトルロゴに被らないよう、飛び出し高さを最大20px程度に制限
      ctx.fillStyle = "#334155";
      ctx.fillRect(flaskCX - 16, stopperY - 14, 32, 10);
      ctx.fillStyle = "#ea580c";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("ポンッ！💨", flaskCX, stopperY - 20);
    }

    // ポンプとホース (美しく横に逃がす)
    const pumpX = 35, pumpY = bh - 72;
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(flaskCX, stopperY + 6);
    ctx.quadraticCurveTo(pumpX + 10, stopperY - 5, pumpX + 22, pumpY);
    ctx.stroke();

    // 簡易空気入れポンプ
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(pumpX, pumpY - 15, 45, 30);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(pumpX, pumpY - 15, 45, 30);
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("空気ポンプ", pumpX + 22, pumpY + 4);

    // デジタル計器パネル（内部温度・気圧：右上に設置）
    const meterX = bw - 135, meterY = 42, meterW = 105, meterH = 100;
    ctx.fillStyle = "#020617";
    ctx.fillRect(meterX, meterY, meterW, meterH);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(meterX, meterY, meterW, meterH);

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("内部計測器", meterX + meterW / 2, meterY + 13);

    // 内部温度
    ctx.fillStyle = temperature <= dewPoint ? "#38bdf8" : (temperature > 22 ? "#ef4444" : "#facc15");
    ctx.font = "bold 14px monospace";
    ctx.fillText(`${temperature.toFixed(1)} ℃`, meterX + meterW / 2, meterY + 38);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "8px sans-serif";
    ctx.fillText(`(露点: ${dewPoint}℃)`, meterX + meterW / 2, meterY + 50);

    // 内部気圧
    ctx.fillStyle = pressure > 1.2 ? "#ea580c" : "#e2e8f0";
    ctx.font = "bold 13px monospace";
    ctx.fillText(`${pressure.toFixed(2)} atm`, meterX + meterW / 2, meterY + 76);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "8px sans-serif";
    ctx.fillText("内部気圧", meterX + meterW / 2, meterY + 86);

    // 下部：断熱膨張ステップ解説バー（見切れを防ぐため２段に分けて描画、マージンにゆとり）
    drawStepGuideBar(35, bh - 68, bw - 60, 42);
  }

  function drawStepGuideBar(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📝 雲発生のプロセス（入試頻出）：", bx + 8, by + 12);

    // 一行あたりの文字数を削減し、左右の衝突・はみ出しを解消
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "9px sans-serif";
    ctx.fillText("①気圧低下（上昇気流） ➔ ②断熱膨張 ➔ ③気温降下", bx + 8, by + 24);
    ctx.fillText("➔ ④露点に達する ➔ ⑤水蒸気が水滴に『凝結』して雲になる", bx + 8, by + 34);
  }

  // ========================================================
  // B. 右上パネル：実写写真枠
  // ========================================================
  function drawPhotoPreviewBox(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📷 実写写真: フラスコ内部", bx + 8, by + 16);

    let targetImg = cloudImages.clear;
    let label = "加圧中（透明・澄んだ空気）";

    if (cloudDensity > 0.6) {
      targetImg = cloudImages.foggy;
      label = "減圧直後（濃い雲の発生）";
    } else if (cloudDensity > 0.1) {
      targetImg = cloudImages.clear;
      label = "凝結核なし（わずかに曇る程度）";
    }

    if (targetImg && targetImg.complete && targetImg.naturalWidth !== 0) {
      ctx.drawImage(targetImg, bx + 8, by + 24, bw - 16, bh - 32);
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(bx + 8, by + 24, bw - 16, bh - 32);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("写真読み込み中...", bx + bw / 2, by + bh / 2 + 5);
    }

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(bx + 8, by + bh - 18, bw - 16, 14);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, bx + bw / 2, by + bh - 8);
  }

  // ========================================================
  // C. 右下パネル：対照実験＆気象まとめ表
  // ========================================================
  function drawCloudProcessTable(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📋 対照実験の結果と記述ポイント", bx + 8, by + 16);

    const rows = [
      { name: "線香の煙あり", result: "真っ白に濃く曇る", note: "凝結核があるため" },
      { name: "線香の煙なし", result: "うっすら曇るのみ", note: "水滴が集まりにくい" },
      { name: "栓を開いた時", result: "温度が急低下",     note: "断熱膨張による" },
      { name: "加圧した時",   result: "曇りが消える",     note: "圧縮昇温による" }
    ];

    ctx.font = "10px sans-serif";
    rows.forEach((r, idx) => {
      const iy = by + 34 + idx * 25;

      ctx.fillStyle = "#e2e8f0";
      ctx.textAlign = "left";
      ctx.fillText(`・${r.name}:`, bx + 6, iy);

      ctx.fillStyle = "#38bdf8";
      ctx.fillText(r.result, bx + 80, iy);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "8px sans-serif";
      ctx.fillText(`(${r.note})`, bx + 10, iy + 10);
      ctx.font = "10px sans-serif";
    });

    // 記述対策ボックス（タイトルの文字切れを防ぐための Y軸 & 囲み 調整）
    const footY = by + bh - 44;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(bx + 6, footY, bw - 12, 38);
    ctx.fillStyle = "#5eead4";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("【記述対策】線香の煙を入れる理由：", bx + 10, footY + 12);
    ctx.fillStyle = "#cbd5e1";
    // 枠内で確実に2行で収める
    ctx.fillText("水蒸気が水滴に変わる際の「核」", bx + 10, footY + 22);
    ctx.fillText("（凝結核）にするため。", bx + 10, footY + 31);
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
      const modal = document.getElementById('stopperWarningModal');
      if (modal) modal.remove();
    }
  };
}


























































// ===================================================================
// 【物理演算・フレミング左手完全修正版】電流と磁界 (中2・エネルギー)
// ===================================================================
function initC2Magnet(canvas) {
  const ctx = canvas.getContext('2d');

  // --- 実験状態 ---
  let currentDir = 1;          // 1: 手前➔奥, -1: 奥➔手前
  let nOnTop = true;           // true: 上がN極(磁界は下向き), false: 上がS極(磁界は上向き)
  let volt = 4.0;              // 電圧 (0.0 〜 10.0 V)
  let magnetStrength = 1;      // 磁石の数: 1 または 2
  let isPowerOn = true;        // 通電スイッチ
  let animId;
  let tick = 0;

  // ブランコの物理シミュレーション（減衰振動）
  let swingPos = 0.0;
  let swingVel = 0.0;

  const controls = document.getElementById('labControlsArea');

  function renderControls() {
    controls.innerHTML = `
      <div class="ctrl-group">
        <label>1. 電源の操作:</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <button class="btn-action ${isPowerOn?'':'secondary'}" id="bPower" style="${isPowerOn?'background:#0d9488; border-color:#0d9488;':''}">
            ${isPowerOn ? '通電中 (ON) ⚡' : 'スイッチOFF'}
          </button>
          <button class="btn-action secondary" id="bCurDir">
            電流反転: ${currentDir > 0 ? '手前 ➔ 奥' : '奥 ➔ 手前'}
          </button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>2. 電圧 (電流の強さ): <span id="vVal" class="ctrl-val" style="color:#38bdf8; font-weight:bold;">${volt.toFixed(1)} V</span></label>
        <input type="range" id="vRange" min="0" max="100" value="${Math.round(volt * 10)}">
      </div>

      <div class="ctrl-group">
        <label>3. U字形磁石の操作:</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <button class="btn-action secondary" id="bPole">
            極反転: ${nOnTop ? '上N / 下S' : '上S / 下N'}
          </button>
          <button class="btn-action secondary" id="bMagCount">
            磁力: ${magnetStrength === 1 ? '磁石1個 (標準)' : '磁石2個 (強力)'}
          </button>
        </div>
      </div>

      <div class="ctrl-group" style="grid-column: 1 / -1;">
        <button class="btn-action secondary" id="bResetMagnet" style="width:100%; font-size:12px; padding:6px;">
          初期設定に戻す 🔄
        </button>
      </div>
    `;

    document.getElementById('bPower').onclick = () => {
      isPowerOn = !isPowerOn;
      renderControls();
      updateStatus();
    };

    document.getElementById('bCurDir').onclick = () => {
      currentDir *= -1;
      renderControls();
      updateStatus();
    };

    document.getElementById('vRange').oninput = (e) => {
      volt = parseInt(e.target.value) / 10;
      document.getElementById('vVal').textContent = `${volt.toFixed(1)} V`;
      updateStatus();
    };

    document.getElementById('bPole').onclick = () => {
      nOnTop = !nOnTop;
      renderControls();
      updateStatus();
    };

    document.getElementById('bMagCount').onclick = () => {
      magnetStrength = magnetStrength === 1 ? 2 : 1;
      renderControls();
      updateStatus();
    };

    document.getElementById('bResetMagnet').onclick = resetLab;
  }

  function resetLab() {
    currentDir = 1;
    nOnTop = true;
    volt = 4.0;
    magnetStrength = 1;
    isPowerOn = true;
    swingPos = 0;
    swingVel = 0;
    renderControls();
    updateStatus();
  }

  // ========================================================
  // ★力の向きの計算（フレミング左手の法則・修正済み）
  // 磁界B: 上N/下S ➔ 下向き (-1)
  // 電流I: 奥➔手前 ➔ 手前向き (-1)
  // ➔ 力F: 【右向き (+1)】
  // ========================================================
  function getForceSign() {
    if (!isPowerOn || volt === 0) return 0;
    const bSign = nOnTop ? -1 : 1; // 上Nなら下向き(-1), 上Sなら上向き(+1)
    const iSign = currentDir;      // 1: 手前➔奥(+1), -1: 奥➔手前(-1)
    
    // 手前(-1) × 下(-1) ➔ 右(+1)
    // 奥(+1) × 下(-1)   ➔ 左(-1)
    return iSign * bSign;
  }

  function updateStatus() {
    if (!isPowerOn || volt === 0) {
      setStatus("【スイッチOFF】電流が流れていないため、導線ブランコに力は働きません。");
      return;
    }

    const fSign = getForceSign();
    const dirText = fSign > 0 ? "【右向き】" : "【左向き】";
    const curText = currentDir > 0 ? "手前 ➔ 奥" : "奥 ➔ 手前";
    const magFieldText = nOnTop ? "上 ➔ 下 (N➔S)" : "下 ➔ 上 (N➔S)";
    const magText = magnetStrength === 2 ? "（磁石2個で磁力2倍！）" : "";

    setStatus(`【フレミングの左手の法則】中指（電流：${curText}）・人さし指（磁界：${magFieldText}）により、親指の向き ${dirText} に電磁気力が発生します！${magText}`);
  }

  renderControls();
  updateStatus();

  function render() {
    tick += 0.05;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    // ブランコの物理シミュレーション
    const targetForce = getForceSign() * (volt / 10.0) * magnetStrength * 36;
    const spring = 0.08;
    const damping = 0.92;
    swingVel += (targetForce - swingPos) * spring;
    swingVel *= damping;
    swingPos += swingVel;

    const leftW = w - 240;

    // 1. 実験ステージ
    drawStage3D(leftW, h);

    // 2. 右側パネル（手の形ナビ & ルール表）
    const rightX = w - 230, rightW = 215;
    drawFlemingHandIllustration(rightX, 15, rightW, 140);
    drawRuleSummaryTable(rightX, 165, rightW, h - 180);

    animId = requestAnimationFrame(render);
  }
  render();

  function drawStage3D(bw, bh) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(15, 15, bw - 20, bh - 30);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(15, 15, bw - 20, bh - 30);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🧲 電流が磁界から受ける力（導線ブランコ実験）", 28, 28);

    const cx = bw / 2 - 15;
    const cy = bh / 2 + 10;

    // 台座
    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.moveTo(cx - 130, cy + 45);
    ctx.lineTo(cx + 35, cy - 20);
    ctx.lineTo(cx + 140, cy + 18);
    ctx.lineTo(cx - 25, cy + 85);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // 支柱フレーム
    const standTopY = cy - 90;
    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(cx - 55, cy + 25);
    ctx.lineTo(cx - 55, standTopY);
    ctx.lineTo(cx + 45, standTopY - 14);
    ctx.stroke();

    // 磁石
    const magX = cx - 10, magY = cy + 10;
    const topColor = nOnTop ? "#ef4444" : "#3b82f6";
    const botColor = nOnTop ? "#3b82f6" : "#ef4444";
    const topText = nOnTop ? "N" : "S";
    const botText = nOnTop ? "S" : "N";

    // 下極
    ctx.fillStyle = botColor;
    drawIsoBlock(magX - 32, magY + 14, 64, 18, botColor);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(botText, magX, magY + 28);

    // 背骨
    ctx.fillStyle = "#334155";
    drawIsoBlock(magX + 22, magY - 40, 16, 54, "#334155");

    // 上極
    ctx.fillStyle = topColor;
    drawIsoBlock(magX - 32, magY - 48, 64, 18, topColor);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(topText, magX, magY - 35);

    // 磁力線 (N極からS極へ)
    ctx.strokeStyle = "rgba(74, 222, 128, 0.7)";
    ctx.lineWidth = magnetStrength === 2 ? 2.8 : 1.8;
    for (let i = -1; i <= 1; i++) {
      const lx = magX + i * 16;
      const startY = nOnTop ? magY - 30 : magY + 12;
      const endY = nOnTop ? magY + 12 : magY - 30;
      drawArrow(lx, startY, lx, endY, 5);
    }
    ctx.fillStyle = "#4ade80";
    ctx.font = "9px sans-serif";
    ctx.fillText("磁界 B (N➔S)", magX + 42, magY - 10);

    // ブランコ
    const pivotX1 = cx - 32, pivotY1 = standTopY - 3;
    const pivotX2 = cx + 22, pivotY2 = standTopY - 11;

    const swingShiftX = swingPos;
    const swingShiftY = -Math.abs(swingPos) * 0.12;

    const pipeX1 = cx - 36 + swingShiftX, pipeY1 = cy + swingShiftY;
    const pipeX2 = cx + 18 + swingShiftX, pipeY2 = cy - 22 + swingShiftY;

    // ワイヤー
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(pivotX1, pivotY1);
    ctx.lineTo(pipeX1, pipeY1);
    ctx.moveTo(pivotX2, pivotY2);
    ctx.lineTo(pipeX2, pipeY2);
    ctx.stroke();

    // 導線パイプ
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(pipeX1, pipeY1);
    ctx.lineTo(pipeX2, pipeY2);
    ctx.stroke();

    // 電流矢印
    if (isPowerOn && volt > 0) {
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2.2;
      if (currentDir > 0) {
        // 手前 ➔ 奥
        drawArrow(pipeX1, pipeY1, pipeX2, pipeY2, 6);
      } else {
        // 奥 ➔ 手前
        drawArrow(pipeX2, pipeY2, pipeX1, pipeY1, 6);
      }
      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 9px sans-serif";
      ctx.fillText("電流 I", (pipeX1 + pipeX2) / 2 - 14, (pipeY1 + pipeY2) / 2 - 8);

      // 力の矢印
      const fSign = getForceSign();
      if (fSign !== 0) {
        const midPX = (pipeX1 + pipeX2) / 2;
        const midPY = (pipeY1 + pipeY2) / 2;
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 3;
        drawArrow(midPX, midPY, midPX + fSign * 32, midPY, 7);
        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 10px sans-serif";
        ctx.fillText("力 F", midPX + fSign * 38, midPY - 5);
      }
    }

    drawStepGuideBar(35, bh - 65, bw - 60, 38);
  }

  function drawIsoBlock(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
  }

  function drawArrow(x1, y1, x2, y2, size) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle - Math.PI / 6), y2 - size * Math.sin(angle - Math.PI / 6));
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle + Math.PI / 6), y2 - size * Math.sin(angle + Math.PI / 6));
    ctx.stroke();
  }

  function drawStepGuideBar(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("💡 定番のテスト対策ルール：", bx + 8, by + 13);

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "9px sans-serif";
    ctx.fillText("① 電流の向きを逆にすると ➔ 力は逆向きになる。", bx + 8, by + 24);
    ctx.fillText("② 電流と磁界の『両方を同時に逆』にすると ➔ 力は同じ向きのまま！", bx + 8, by + 34);
  }

  // ========================================================
  // B. 右上パネル：フレミング左手の法則（イラスト描画）
  // ========================================================
  function drawFlemingHandIllustration(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("🖐️ フレミング左手の法則（定義）", bx + 8, by + 16);

    const cx = bx + bw / 2;
    const cy = by + bh / 2 + 8;

    const bSign = nOnTop ? 1 : -1;  // 1: 下向き(↓), -1: 上向き(↑)
    const iSign = currentDir;        // 1: 奥(↗), -1: 手前(↙)
    const fSign = getForceSign();    // 1: 右(→), -1: 左(←)

    // 1. 人さし指: 磁界 (緑)
    const bLen = 32 * bSign;
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 3;
    drawArrow(cx, cy, cx, cy + bLen, 6);
    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("人: 磁界 (B)", cx + 8, cy + (bSign > 0 ? 22 : -18));

    // 2. 中指: 電流 (青)
    const iLenX = iSign > 0 ? 26 : -26;
    const iLenY = iSign > 0 ? -16 : 16;
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 3;
    drawArrow(cx, cy, cx + iLenX, cy + iLenY, 6);
    ctx.fillStyle = "#38bdf8";
    ctx.fillText("中: 電流 (I)", cx + iLenX + (iSign > 0 ? -18 : -28), cy + iLenY + (iSign > 0 ? -8 : 14));

    // 3. 親指: 力 (赤)
    const fLenX = (fSign !== 0 ? fSign : 1) * 38;
    ctx.strokeStyle = isPowerOn ? "#ef4444" : "#64748b";
    ctx.lineWidth = 3.5;
    drawArrow(cx, cy, cx + fLenX, cy, 7);
    ctx.fillStyle = isPowerOn ? "#ef4444" : "#64748b";
    ctx.fillText("親: 力 (F)", cx + fLenX + (fSign > 0 ? 6 : -48), cy - 6);

    // 中心点
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();

    // ゴロ合わせ
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("【覚え方】中・人・親 ＝「電・磁・力」", bx + bw / 2, by + bh - 8);
  }

  // ========================================================
  // C. 右下パネル：ルールまとめ表
  // ========================================================
  function drawRuleSummaryTable(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📋 磁界から受ける力の規則性", bx + 8, by + 16);

    const fSign = getForceSign();
    const rows = [
      { label: "電流の向き", val: currentDir > 0 ? "手前 ➔ 奥" : "奥 ➔ 手前", col: "#38bdf8" },
      { label: "磁界の向き", val: nOnTop ? "上 ➔ 下 (N➔S)" : "下 ➔ 上 (N➔S)", col: "#4ade80" },
      { label: "受ける力", val: !isPowerOn ? "なし (0N)" : (fSign > 0 ? "右向き" : "左向き"), col: "#ef4444" },
      { label: "力の強さ", val: !isPowerOn ? "0" : `${(volt * magnetStrength * 10).toFixed(0)} %`, col: "#facc15" }
    ];

    ctx.font = "10px sans-serif";
    rows.forEach((r, idx) => {
      const iy = by + 38 + idx * 26;
      ctx.fillStyle = "#cbd5e1";
      ctx.textAlign = "left";
      ctx.fillText(`・${r.label}:`, bx + 8, iy);

      ctx.fillStyle = r.col;
      ctx.font = "bold 10px sans-serif";
      ctx.fillText(r.val, bx + 75, iy);
      ctx.font = "10px sans-serif";
    });

    const footY = by + bh - 44;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(bx + 6, footY, bw - 12, 38);
    ctx.fillStyle = "#5eead4";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("【モーターへの応用】", bx + 10, footY + 13);
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("コイルの両側で逆向きの力を受け回転。", bx + 10, footY + 24);
    ctx.fillText("「整流子」で同じ向きに回り続ける！", bx + 10, footY + 34);
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
    }
  };
}

























































// ===================================================================
// 【完全修正版】前線の通過と天気の変化 (中2・地球)
// ===================================================================
function initC2Front(canvas) {
  const ctx = canvas.getContext('2d');

  // --- 実験状態 ---
  let frontType = "cold";       // 'cold'(寒冷前線) または 'warm'(温暖前線)
  let frontProgress = 35;       // 前線の位置 % (0〜100: 西から東へ移動)
  let isAutoPlay = false;       // 自動移動アニメーション
  let animId;
  let rainTick = 0;

  // 実写写真（雲のリアルな違い）
  const cloudImages = {
    cold: new Image(),
    warm: new Image()
  };
  cloudImages.cold.src = 'cloud_cumulonimbus.jpg'; // 積乱雲
  cloudImages.warm.src = 'cloud_nimbostratus.jpg';  // 乱層雲

  const controls = document.getElementById('labControlsArea');

  function renderControls() {
    controls.innerHTML = `
      <div class="ctrl-group">
        <label>1. 前線の種類を選択:</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <button class="btn-action ${frontType==='cold'?'':'secondary'}" id="bCold" style="${frontType==='cold'?'background:#0284c7; border-color:#0284c7;':''}">
            寒冷前線 (急な前線面・積乱雲)
          </button>
          <button class="btn-action ${frontType==='warm'?'':'secondary'}" id="bWarm" style="${frontType==='warm'?'background:#ea580c; border-color:#ea580c;':''}">
            温暖前線 (緩やかな前線面・乱層雲)
          </button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>2. 前線の位置（西 ➔ 東へ移動）: <span id="posVal" class="ctrl-val">${frontProgress}%</span></label>
        <input type="range" id="posRange" min="5" max="95" value="${frontProgress}">
      </div>

      <div class="ctrl-group">
        <label>3. 時間経過アニメーション:</label>
        <div style="display:flex; gap:6px;">
          <button class="btn-action ${isAutoPlay?'secondary':''}" id="bPlay" style="${!isAutoPlay?'background:#0d9488; border-color:#0d9488;':''}">
            ${isAutoPlay ? '一時停止 ⏸️' : '前線を通過させる ▶️'}
          </button>
          <button class="btn-action secondary" id="bResetFront">位置リセット 🔄</button>
        </div>
      </div>
    `;

    document.getElementById('bCold').onclick = () => { frontType = 'cold'; renderControls(); updateStatus(); };
    document.getElementById('bWarm').onclick = () => { frontType = 'warm'; renderControls(); updateStatus(); };

    document.getElementById('posRange').oninput = (e) => {
      frontProgress = parseInt(e.target.value);
      document.getElementById('posVal').textContent = `${frontProgress}%`;
      updateStatus();
    };

    document.getElementById('bPlay').onclick = () => {
      isAutoPlay = !isAutoPlay;
      renderControls();
    };

    document.getElementById('bResetFront').onclick = () => {
      frontProgress = 15;
      isAutoPlay = false;
      renderControls();
      updateStatus();
    };
  }

  // 観測地点（固定位置: X = 50%）に対する通過状態を判定
  function getObserverState() {
    const isCold = (frontType === 'cold');
    const obsX = 50;
    const diff = obsX - frontProgress;

    if (isCold) {
      if (diff > 12) {
        return { phase: "before", label: "通過前（暖気エリア）", temp: "高 (22℃)", press: "低下傾向", wind: "南寄りの風 (暖)", weather: "くもり/晴れ", rain: false };
      } else if (diff >= -8 && diff <= 12) {
        return { phase: "passing", label: "前線通過中！", temp: "急低下中", press: "反転上昇", wind: "突風・風向急変", weather: "激しいにわか雨・雷雨", rain: true, heavy: true };
      } else {
        return { phase: "after", label: "通過後（寒気エリア）", temp: "低 (14℃)", press: "上昇", wind: "北寄りの風 (寒)", weather: "やがて晴れ", rain: false };
      }
    } else {
      if (diff > 25) {
        return { phase: "far_before", label: "通過はるか前（寒気）", temp: "低 (13℃)", press: "低下中", wind: "東〜南東の風", weather: "うす雲（巻雲・高層雲）", rain: false };
      } else if (diff >= 0 && diff <= 25) {
        return { phase: "before_rain", label: "通過直前（雨エリア）", temp: "やや低 (15℃)", press: "さらに低下", wind: "南東寄りの風", weather: "しとしと長雨（乱層雲）", rain: true, heavy: false };
      } else {
        return { phase: "after", label: "通過後（暖気エリア）", temp: "高 (21℃)", press: "下降して安定", wind: "南寄りの風 (暖)", weather: "雨が止み晴れ", rain: false };
      }
    }
  }

  function updateStatus() {
    const state = getObserverState();
    const fName = frontType === 'cold' ? '寒冷前線' : '温暖前線';

    if (frontType === 'cold') {
      setStatus(`【${fName}の観測点】現在『${state.label}』：気温: ${state.temp}／風向: ${state.wind}／天気: ${state.weather}。寒気が暖気の下に潜り込み急激に押し上げるため、通過時に短時間の激しい雨が降ります。`);
    } else {
      setStatus(`【${fName}の観測点】現在『${state.label}』：気温: ${state.temp}／風向: ${state.wind}／天気: ${state.weather}。暖気が寒気の上に緩やかに這い上がるため、前線の通過前に広い範囲で穏やかな雨が長く続きます。`);
    }
  }

  renderControls();
  updateStatus();

  // ========================================================
  // メイン描画ループ
  // ========================================================
  function render() {
    rainTick += 0.4;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    if (isAutoPlay) {
      frontProgress += 0.25;
      if (frontProgress > 95) frontProgress = 5;
      const rng = document.getElementById('posRange');
      const val = document.getElementById('posVal');
      if (rng) rng.value = Math.round(frontProgress);
      if (val) val.textContent = `${Math.round(frontProgress)}%`;
      updateStatus();
    }

    const leftW = w - 240;

    // 1. メイン立体断面図
    drawFrontCrossSection(leftW, h);

    // 2. 右側パネル（実写写真枠 & 気象変化対照表）
    const rightX = w - 230, rightW = 215;
    drawCloudPhotoBox(rightX, 15, rightW, 140);
    drawWeatherSummaryTable(rightX, 165, rightW, h - 180);

    animId = requestAnimationFrame(render);
  }
  render();

  // ========================================================
  // A. メイン立体断面図
  // ========================================================
  function drawFrontCrossSection(bw, bh) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(15, 15, bw - 20, bh - 30);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(15, 15, bw - 20, bh - 30);

    const groundY = bh - 60;
    const isCold = (frontType === "cold");
    const fx = 35 + (bw - 70) * (frontProgress / 100);

    // 方角表示
    ctx.fillStyle = "#64748b";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("西（寒気側）", 28, 38);
    ctx.textAlign = "right";
    ctx.fillText("東（進行方向）", bw - 28, 38);

    if (isCold) {
      // 暖気エリア
      ctx.fillStyle = "rgba(244, 63, 94, 0.12)";
      ctx.fillRect(20, 45, bw - 40, groundY - 45);

      // 寒気エリア（急角度で潜り込む自然なカーブ）
      ctx.fillStyle = "rgba(59, 130, 246, 0.35)";
      ctx.beginPath();
      ctx.moveTo(20, groundY);
      ctx.lineTo(fx, groundY);
      ctx.quadraticCurveTo(fx - 15, groundY - 80, 20, groundY - 140);
      ctx.closePath();
      ctx.fill();

      // 前線面境界線
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(fx, groundY);
      ctx.quadraticCurveTo(fx - 15, groundY - 80, 20, groundY - 140);
      ctx.stroke();

      // 雨（狭い範囲に激しい雨）
      drawRain(fx - 65, fx - 10, groundY - 50, groundY, 40, true);

      // 積乱雲（灰色の四角を排除したモコモコ雲）
      drawCumulonimbus(fx - 35, groundY - 50, 90, 130);

      // 気流の矢印
      drawWindArrow(fx - 75, groundY - 18, fx - 25, groundY - 18, "#38bdf8", "寒気");
      drawWindArrow(fx + 30, groundY - 15, fx - 10, groundY - 75, "#f43f5e", "急上昇気流");

    } else {
      // 暖気エリア（這い上がり）
      ctx.fillStyle = "rgba(244, 63, 94, 0.18)";
      ctx.beginPath();
      ctx.moveTo(20, groundY);
      ctx.lineTo(fx, groundY);
      ctx.lineTo(bw - 20, groundY - 130);
      ctx.lineTo(20, groundY - 130);
      ctx.closePath();
      ctx.fill();

      // 寒気エリア（右下のくさび形）
      ctx.fillStyle = "rgba(59, 130, 246, 0.35)";
      ctx.beginPath();
      ctx.moveTo(fx, groundY);
      ctx.lineTo(bw - 20, groundY);
      ctx.lineTo(bw - 20, groundY - 130);
      ctx.closePath();
      ctx.fill();

      // 前線面境界線
      ctx.strokeStyle = "#ea580c";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(fx, groundY);
      ctx.lineTo(bw - 20, groundY - 130);
      ctx.stroke();

      // 雨（広い範囲に穏やかな雨）
      drawRain(fx + 15, bw - 30, groundY - 45, groundY, 45, false);

      // 乱層雲（層状の雲）
      drawNimbostratus(fx + 10, groundY - 55, (bw - 20) - (fx + 10), 45);

      // 気流の矢印
      drawWindArrow(fx - 50, groundY - 15, fx + 25, groundY - 40, "#f43f5e", "暖気の這い上がり");
      drawWindArrow(bw - 60, groundY - 15, fx + 20, groundY - 15, "#38bdf8", "寒気");
    }

    // 地面
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(15, groundY, bw - 20, bh - groundY - 15);
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(15, groundY, bw - 20, bh - groundY - 15);

    // 地上の前線記号（▲▲▲ または ●●●）
    drawFrontSymbolsOnGround(fx, groundY + 12, isCold);

    // 地上観測地点（学校アイコン）
    const obsPixelX = 15 + (bw - 20) * 0.5;
    drawObserverStation(obsPixelX, groundY);
  }

  // 積乱雲の描画
  function drawCumulonimbus(cx, baseY, cw, ch) {
    ctx.save();
    
    // 雲底のソフトシャドウ
    ctx.fillStyle = "rgba(71, 85, 105, 0.75)";
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 15, cw * 0.42, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // モコモコした雲本体
    ctx.fillStyle = "rgba(241, 245, 249, 0.92)";
    ctx.beginPath();
    ctx.ellipse(cx, baseY - ch * 0.35, cw * 0.45, ch * 0.35, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 12, baseY - ch * 0.65, cw * 0.38, ch * 0.28, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 15, baseY - ch * 0.5, cw * 0.35, ch * 0.25, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 5, baseY - ch * 0.85, cw * 0.3, ch * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("積乱雲", cx, baseY - ch - 4);
  }

  // 乱層雲の描画
  function drawNimbostratus(x, y, w, h) {
    ctx.save();
    const grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, "rgba(100, 116, 139, 0.9)");
    grad.addColorStop(1, "rgba(203, 213, 225, 0.6)");
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + w, y - 25);
    ctx.lineTo(x + w, y - 45);
    ctx.lineTo(x, y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("乱層雲", x + w * 0.45, y - 35);
  }

  // 雨のアニメーション
  function drawRain(minX, maxX, startY, endY, count, isHeavy) {
    ctx.save();
    ctx.strokeStyle = isHeavy ? "#38bdf8" : "rgba(148, 163, 184, 0.75)";
    ctx.lineWidth = isHeavy ? 2.2 : 1.2;

    const span = Math.max(10, maxX - minX);
    for (let i = 0; i < count; i++) {
      const rx = minX + ((i * 37 + rainTick * (isHeavy ? 18 : 10)) % span);
      const ry = startY + ((i * 19 + rainTick * (isHeavy ? 24 : 14)) % (endY - startY));
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - (isHeavy ? 4 : 2), ry + (isHeavy ? 12 : 7));
      ctx.stroke();
    }
    ctx.restore();
  }

  // 地上の前線記号
  function drawFrontSymbolsOnGround(fx, y, isCold) {
    ctx.save();
    ctx.fillStyle = isCold ? "#0284c7" : "#ea580c";
    ctx.strokeStyle = isCold ? "#0284c7" : "#ea580c";
    ctx.lineWidth = 3;

    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(fx, y - 12);
    ctx.lineTo(fx, 45);
    ctx.stroke();
    ctx.setLineDash([]);

    for (let i = -1; i <= 1; i++) {
      const sx = fx + i * 18;
      ctx.beginPath();
      if (isCold) {
        ctx.moveTo(sx, y - 6);
        ctx.lineTo(sx + 10, y);
        ctx.lineTo(sx, y + 6);
      } else {
        ctx.arc(sx, y, 6, -Math.PI / 2, Math.PI / 2, false);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // 観測地点アイコン
  function drawObserverStation(x, groundY) {
    ctx.save();
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(x, groundY - 18, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, groundY - 12);
    ctx.lineTo(x, groundY);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🏫 観測地点（あなた）", x, groundY + 28);

    const state = getObserverState();
    ctx.fillStyle = state.rain ? "#38bdf8" : "#cbd5e1";
    ctx.font = "10px sans-serif";
    ctx.fillText(state.weather, x, groundY + 42);
    ctx.restore();
  }

  // 矢印と文字の描画
  function drawWindArrow(x1, y1, x2, y2, color, label) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x2 - 8 * Math.cos(angle - Math.PI / 6), y2 - 8 * Math.sin(angle - Math.PI / 6));
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 8 * Math.cos(angle + Math.PI / 6), y2 - 8 * Math.sin(angle + Math.PI / 6));
    ctx.stroke();

    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2 - 8;
    ctx.font = "bold 10px sans-serif";
    const textW = ctx.measureText(label).width;

    ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
    ctx.fillRect(midX - textW / 2 - 3, midY - 9, textW + 6, 13);

    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.fillText(label, midX, midY + 1);
  }

  // ========================================================
  // B. 右上パネル：実写写真枠
  // ========================================================
  function drawCloudPhotoBox(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📷 実写写真: 代表的な雲", bx + 8, by + 16);

    const isCold = (frontType === "cold");
    const targetImg = isCold ? cloudImages.cold : cloudImages.warm;
    const label = isCold ? "積乱雲（激しい雨・雷・突風）" : "乱層雲（一面の雨雲・しとしと雨）";

    if (targetImg.complete && targetImg.naturalWidth !== 0) {
      ctx.drawImage(targetImg, bx + 8, by + 24, bw - 16, bh - 32);
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(bx + 8, by + 24, bw - 16, bh - 32);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${isCold ? 'cloud_cumulonimbus.jpg' : 'cloud_nimbostratus.jpg'}`, bx + bw / 2, by + bh / 2);
      ctx.fillText("実写画像待機中", bx + bw / 2, by + bh / 2 + 15);
    }

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(bx + 8, by + bh - 20, bw - 16, 16);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, bx + bw / 2, by + bh - 8);
  }

  // ========================================================
  // C. 右下パネル：対照表
  // ========================================================
  function drawWeatherSummaryTable(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📋 通過前後の変化（テスト頻出）", bx + 8, by + 16);

    const isCold = (frontType === "cold");
    const rows = isCold ? [
      { item: "前線面の傾き", val: "急（強い上昇気流）" },
      { item: "発生する雲",   val: "積乱雲（縦に長い）" },
      { item: "雨の降り方",   val: "狭い範囲・強い短時間雨" },
      { item: "通過後の気温", val: "急激に下がる ⬇️" },
      { item: "通過後の風向", val: "南寄り ➔ 北寄りに急変" }
    ] : [
      { item: "前線面の傾き", val: "緩やか（這い上がり）" },
      { item: "発生する雲",   val: "乱層雲（広範囲）" },
      { item: "雨の降り方",   val: "広い範囲・穏やかな長雨" },
      { item: "通過後の気温", val: "上がる ⬆️" },
      { item: "通過後の風向", val: "南東 ➔ 南寄りに変化" }
    ];

    ctx.font = "10px sans-serif";
    rows.forEach((r, idx) => {
      const iy = by + 36 + idx * 24;
      ctx.fillStyle = "#94a3b8";
      ctx.textAlign = "left";
      ctx.fillText(r.item, bx + 8, iy);

      ctx.fillStyle = (idx >= 3) ? "#facc15" : "#e2e8f0";
      ctx.font = (idx >= 3) ? "bold 10px sans-serif" : "10px sans-serif";
      ctx.fillText(r.val, bx + 78, iy);
      ctx.font = "10px sans-serif";
    });

    const footY = by + bh - 44;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(bx + 6, footY, bw - 12, 38);
    ctx.fillStyle = "#5eead4";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("【ポイント】前線通過のサイン：", bx + 10, footY + 13);
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("「風向きの急変」と「気温の急変」が", bx + 10, footY + 24);
    ctx.fillText("同時に起きるのが前線通過の特徴！", bx + 10, footY + 34);
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
    }
  };
}




































// ===================================================================
// 【座標・文字被り完全修正版】中和反応と塩の生成 (中3・物質)
// ===================================================================
function initC3Neutral(canvas) {
  const ctx = canvas.getContext('2d');

  // --- 実験状態 ---
  let naohAdded = 0.0;          // 加えたNaOH水溶液の体積 (0.0 〜 20.0 mL)
  const neutralPoint = 10.0;    // 中和点 (10.0 mL)
  const initialHCount = 8;      // 初期の H+ の個数
  const initialClCount = 8;     // 初期の Cl- の個数

  let isDripping = false;       // 滴下アニメーション
  let dripY = 0;
  let animId;
  let tick = 0;

  // 実写写真（スライドガラスで乾かしたNaCl結晶）
  const crystalImg = new Image();
  crystalImg.src = 'crystal_nacl_neutral.jpg';

  // 水溶液内を浮遊するイオンの物理粒子
  const ionParticles = [];

  // ビーカーの基準配置（左エリア中央）
  function getBeakerBounds(bw, bh) {
    const beakerW = 120;
    const beakerH = 145;
    const beakerX = (bw / 2) - (beakerW / 2) - 10;
    const beakerY = 160;
    const liquidH = 85 + (naohAdded / 20.0) * 22;
    return { beakerX, beakerY, beakerW, beakerH, liquidH };
  }

  // 初期の塩酸 (H+ と Cl-) をビーカー内部に確実に生成
  function initIonPopulation() {
    ionParticles.length = 0;
    const { beakerX, beakerY, beakerW, beakerH, liquidH } = getBeakerBounds(canvas.width - 240, canvas.height);
    const minY = beakerY + beakerH - liquidH + 12;
    const maxY = beakerY + beakerH - 14;

    for (let i = 0; i < initialHCount; i++) {
      ionParticles.push({
        type: "H",
        x: beakerX + 15 + Math.random() * (beakerW - 30),
        y: minY + Math.random() * (maxY - minY),
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8
      });
      ionParticles.push({
        type: "Cl",
        x: beakerX + 15 + Math.random() * (beakerW - 30),
        y: minY + Math.random() * (maxY - minY),
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6
      });
    }
  }
  initIonPopulation();

  const controls = document.getElementById('labControlsArea');

  function renderControls() {
    controls.innerHTML = `
      <div class="ctrl-group">
        <label>1. 水酸化ナトリウム水溶液の滴下量: <span id="naohVal" class="ctrl-val" style="color:#38bdf8; font-weight:bold;">${naohAdded.toFixed(1)} mL</span></label>
        <input type="range" id="naohRange" min="0" max="200" value="${Math.round(naohAdded * 10)}">
      </div>

      <div class="ctrl-group">
        <label>2. ビュレット操作:</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <button class="btn-action" id="bDropOne" style="padding:8px 4px; font-size:12px;">1滴加える (+0.5mL) 💧</button>
          <button class="btn-action secondary" id="bToNeutral" style="padding:8px 4px; font-size:12px;">中和点(10mL)に合わせる</button>
        </div>
      </div>

      <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; gap:8px;">
        <button class="btn-action secondary" id="bEvapNaCl" style="flex:2; color:#facc15; border-color:#facc15; font-size:12px; padding:6px;">
          🔬 スライドガラスに液をとって水分を蒸発させる（結晶観察）
        </button>
        <button class="btn-action secondary" id="bResetNeutral" style="flex:1; font-size:12px; padding:6px;">
          最初からやり直す 🔄
        </button>
      </div>
    `;

    document.getElementById('naohRange').oninput = (e) => {
      naohAdded = parseInt(e.target.value) / 10;
      document.getElementById('naohVal').textContent = `${naohAdded.toFixed(1)} mL`;
      syncIons();
      updateStatus();
    };

    document.getElementById('bDropOne').onclick = () => {
      if (naohAdded < 20.0) {
        naohAdded = Math.min(20.0, naohAdded + 0.5);
        document.getElementById('naohRange').value = Math.round(naohAdded * 10);
        document.getElementById('naohVal').textContent = `${naohAdded.toFixed(1)} mL`;
        isDripping = true;
        dripY = 135;
        syncIons();
        updateStatus();
      }
    };

    document.getElementById('bToNeutral').onclick = () => {
      naohAdded = neutralPoint;
      document.getElementById('naohRange').value = Math.round(naohAdded * 10);
      document.getElementById('naohVal').textContent = `${naohAdded.toFixed(1)} mL`;
      syncIons();
      updateStatus();
    };

    document.getElementById('bEvapNaCl').onclick = showEvapModal;
    document.getElementById('bResetNeutral').onclick = resetLab;
  }

  // 加えたNaOH量に応じて水溶液内のイオン数を同期
  function syncIons() {
    const naAddedCount = Math.round((naohAdded / neutralPoint) * initialHCount);
    const targetH = Math.max(0, initialHCount - naAddedCount);
    const targetOH = Math.max(0, naAddedCount - initialHCount);
    const targetNa = naAddedCount;
    const targetCl = initialClCount;

    adjustIonType("H", targetH);
    adjustIonType("OH", targetOH);
    adjustIonType("Na", targetNa);
    adjustIonType("Cl", targetCl);
  }

  function adjustIonType(type, targetCount) {
    const current = ionParticles.filter(p => p.type === type);
    const { beakerX, beakerY, beakerW, beakerH, liquidH } = getBeakerBounds(canvas.width - 240, canvas.height);
    const minY = beakerY + beakerH - liquidH + 12;
    const maxY = beakerY + beakerH - 14;

    if (current.length < targetCount) {
      for (let i = 0; i < targetCount - current.length; i++) {
        ionParticles.push({
          type: type,
          x: beakerX + 15 + Math.random() * (beakerW - 30),
          y: minY + Math.random() * (maxY - minY),
          vx: (Math.random() - 0.5) * 0.7,
          vy: (Math.random() - 0.5) * 0.7
        });
      }
    } else if (current.length > targetCount) {
      let removeCount = current.length - targetCount;
      for (let i = ionParticles.length - 1; i >= 0 && removeCount > 0; i--) {
        if (ionParticles[i].type === type) {
          ionParticles.splice(i, 1);
          removeCount--;
        }
      }
    }
  }

  function resetLab() {
    naohAdded = 0.0;
    initIonPopulation();
    const modal = document.getElementById('naclEvapModal');
    if (modal) modal.remove();
    renderControls();
    updateStatus();
  }

  function getReactionState() {
    const naAddedCount = Math.round((naohAdded / neutralPoint) * initialHCount);
    const hCount = Math.max(0, initialHCount - naAddedCount);
    const ohCount = Math.max(0, naAddedCount - initialHCount);
    const naCount = naAddedCount;
    const clCount = initialClCount;

    let btbColor = "#eab308";
    let stateName = "酸性";
    let phText = "pH < 7";

    if (Math.abs(naohAdded - neutralPoint) < 0.2) {
      btbColor = "#22c55e"; // 鮮やかな緑
      stateName = "中性（中和点）";
      phText = "pH = 7";
    } else if (naohAdded > neutralPoint) {
      btbColor = "#0284c7"; // 青色
      stateName = "アルカリ性";
      phText = "pH > 7";
    }

    // 中和熱
    const heatGain = (Math.min(naohAdded, neutralPoint) / neutralPoint) * 6.5;
    const coolLoss = Math.max(0, naohAdded - neutralPoint) * 0.35;
    const temp = 25.0 + heatGain - coolLoss;

    return { hCount, ohCount, naCount, clCount, btbColor, stateName, phText, temp };
  }

  function updateStatus() {
    const st = getReactionState();

    if (st.stateName.includes("中和点")) {
      setStatus(`【中性（完全中和達成！）】H⁺ と OH⁻ がすべて結びついて水(H₂O)になりました（BTB: 緑色）！水溶液中には Na⁺ と Cl⁻ がイオンのまま溶けて存在しています。中和熱により液温は最高(${st.temp.toFixed(1)}℃)に達しています！`);
    } else if (st.stateName === "酸性") {
      setStatus(`【酸性】H⁺（水素イオン）がまだ${st.hCount}個残っています（BTB: 黄色 / ${st.phText}）。温度: ${st.temp.toFixed(1)}℃。滴下を続けて中和点(10mL)を目指しましょう。`);
    } else {
      setStatus(`【アルカリ性】中和点を超えて OH⁻（水酸化物イオン）が過剰に入り始めました（BTB: 青色 / ${st.phText}）。常温の液が入り続けるため温度は低下傾向(${st.temp.toFixed(1)}℃)になります。`);
    }
  }

  function showEvapModal() {
    let modal = document.getElementById('naclEvapModal');
    if (modal) modal.remove();

    modal = document.createElement('div');
    modal.id = 'naclEvapModal';
    modal.style.position = 'fixed';
    modal.style.top = '0';
    modal.style.left = '0';
    modal.style.width = '100vw';
    modal.style.height = '100vh';
    modal.style.backgroundColor = 'rgba(0, 0, 0, 0.88)';
    modal.style.zIndex = '9999';
    modal.style.display = 'flex';
    modal.style.flexDirection = 'column';
    modal.style.justifyContent = 'center';
    modal.style.alignItems = 'center';
    modal.style.padding = '20px';
    modal.style.cursor = 'pointer';

    const card = document.createElement('div');
    card.style.background = '#0f172a';
    card.style.border = '2px solid #38bdf8';
    card.style.borderRadius = '14px';
    card.style.maxWidth = '580px';
    card.style.width = '90%';
    card.style.padding = '22px';
    card.style.boxShadow = '0 0 35px rgba(56, 189, 248, 0.5)';
    card.style.textAlign = 'center';
    card.style.color = '#ffffff';

    const h2 = document.createElement('h2');
    h2.textContent = '🔬 【中和で生じた塩の結晶化】';
    h2.style.color = '#38bdf8';
    h2.style.fontSize = '18px';
    h2.style.marginBottom = '12px';
    card.appendChild(h2);

    if (crystalImg.complete && crystalImg.naturalWidth !== 0) {
      const img = document.createElement('img');
      img.src = crystalImg.src;
      img.style.maxWidth = '100%';
      img.style.maxHeight = '230px';
      img.style.borderRadius = '8px';
      img.style.marginBottom = '12px';
      card.appendChild(img);
    }

    const desc = document.createElement('div');
    desc.style.fontSize = '13px';
    desc.style.lineHeight = '1.7';
    desc.style.textAlign = 'left';
    desc.style.background = '#1e293b';
    desc.style.padding = '14px';
    desc.style.borderRadius = '8px';
    desc.style.color = '#f1f5f9';
    desc.innerHTML = `
      <strong style="color:#facc15;">★ 中和した液の中身はどうなっている？</strong><br>
      中和点に達した水溶液中では、酸の陰イオン（Cl⁻）とアルカリの陽イオン（Na⁺）がバラバラに電離した状態で泳いでいます。<br><br>
      <strong style="color:#38bdf8;">★ 水分を蒸発させるとどうなる？（入試頻出）：</strong><br>
      スライドガラスに液を1滴とり、加熱して水分を蒸発させると、水分子がなくなり <strong>Na⁺ と Cl⁻ が結びついて、美しいサイコロ状（立方体）の塩化ナトリウム（食塩）の結晶</strong> が現れます！
    `;
    card.appendChild(desc);

    const tip = document.createElement('p');
    tip.textContent = 'クリックすると閉じて実験に戻ります';
    tip.style.fontSize = '12px';
    tip.style.color = '#94a3b8';
    tip.style.marginTop = '12px';
    card.appendChild(tip);

    modal.appendChild(card);
    modal.onclick = () => modal.remove();
    document.body.appendChild(modal);
  }

  renderControls();
  updateStatus();

  function render() {
    tick += 0.05;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#030712";
    ctx.fillRect(0, 0, w, h);

    const leftW = w - 240;

    // 1. 実験ベンチ
    drawNeutralBench(leftW, h);

    // 2. 右側パネル
    const rightX = w - 230, rightW = 215;
    drawCrystalPhotoBox(rightX, 15, rightW, 140);
    drawIonGraphPanel(rightX, 165, rightW, h - 180);

    animId = requestAnimationFrame(render);
  }
  render();

  function drawNeutralBench(bw, bh) {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(15, 15, bw - 20, bh - 30);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(15, 15, bw - 20, bh - 30);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("⚗️ 中和反応と水溶液内のイオンモデル（HCl + NaOH）", 28, 28);

    const st = getReactionState();
    const { beakerX, beakerY, beakerW, beakerH, liquidH } = getBeakerBounds(bw, bh);

    // 1. ビュレット（ビーカーの中央真上に配置）
    const burX = beakerX + beakerW / 2;
    const bHeight = 80;
    const filledH = bHeight * (1.0 - (naohAdded / 20.0));

    ctx.fillStyle = "rgba(14, 165, 233, 0.25)";
    ctx.fillRect(burX - 7, 45 + (bHeight - filledH), 14, filledH);

    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.strokeRect(burX - 7, 45, 14, bHeight);

    // コック
    ctx.fillStyle = "#64748b";
    ctx.fillRect(burX - 12, 125, 24, 6);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("NaOH水溶液", burX, 40);

    // 滴下の水滴アニメーション
    if (isDripping) {
      dripY += 6;
      ctx.fillStyle = "#0284c7";
      ctx.beginPath();
      ctx.arc(burX, dripY, 3, 0, Math.PI * 2);
      ctx.fill();
      if (dripY > beakerY + 10) isDripping = false;
    }

    // 2. ビーカー（BTB溶液の色で満たす）
    ctx.fillStyle = st.btbColor;
    ctx.globalAlpha = 0.65;
    ctx.fillRect(beakerX + 3, beakerY + beakerH - liquidH, beakerW - 6, liquidH - 3);
    ctx.globalAlpha = 1.0;

    // ビーカー外枠
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 3;
    ctx.strokeRect(beakerX, beakerY, beakerW, beakerH);

    // 液性ラベル
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`【${st.stateName}】`, beakerX + beakerW / 2, beakerY - 8);

    // 3. 温度計（ビーカー右側に被らないよう配置）
    const thX = beakerX + beakerW + 12;
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(thX, beakerY, 6, beakerH - 10);
    ctx.fillStyle = "#ef4444";
    const thH = Math.max(10, ((st.temp - 20) / 15) * (beakerH - 30));
    ctx.fillRect(thX, beakerY + beakerH - 20 - thH, 6, thH);
    ctx.beginPath();
    ctx.arc(thX + 3, beakerY + beakerH - 15, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`${st.temp.toFixed(1)}℃`, thX + 12, beakerY + 25);
    ctx.font = "8px sans-serif";
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("中和熱", thX + 12, beakerY + 36);

    // 4. 水溶液内のイオンモデル（ビーカー内部のみで確実にバウンド）
    const minY = beakerY + beakerH - liquidH + 10;
    const maxY = beakerY + beakerH - 12;

    ionParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;

      // ビーカー壁での跳ね返り（内側に確実に収める）
      if (p.x < beakerX + 12) { p.x = beakerX + 12; p.vx *= -1; }
      if (p.x > beakerX + beakerW - 12) { p.x = beakerX + beakerW - 12; p.vx *= -1; }
      if (p.y < minY) { p.y = minY; p.vy *= -1; }
      if (p.y > maxY) { p.y = maxY; p.vy *= -1; }

      drawIonParticle(p.x, p.y, p.type);
    });

    // 下部：化学反応式＆イオン解説バー（2段構成で文字被りを完全解消）
    drawReactionFormulaBar(25, bh - 60, bw - 45, 42, st);
  }

  function drawIonParticle(x, y, type) {
    ctx.save();
    let col = "#ffffff";
    let text = type;

    if (type === "H") {
      col = "#ef4444"; // 水素イオン（赤）
      text = "H⁺";
    } else if (type === "Cl") {
      col = "#22c55e"; // 塩化物イオン（緑）
      text = "Cl⁻";
    } else if (type === "Na") {
      col = "#eab308"; // ナトリウムイオン（黄）
      text = "Na⁺";
    } else if (type === "OH") {
      col = "#38bdf8"; // 水酸化物イオン（青）
      text = "OH⁻";
    }

    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x, y, 7.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = (type === "Na" || type === "H") ? "#000000" : "#ffffff";
    ctx.font = "bold 8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(text, x, y + 3);
    ctx.restore();
  }

  // 文字被りを解消した2段表示バー
  function drawReactionFormulaBar(bx, by, bw, bh, st) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(bx, by, bw, bh);

    // 1行目：中和の反応式
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📝 中和の本質:", bx + 8, by + 14);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("H⁺ ＋ OH⁻ ➔ H₂O（水） ＋ 熱（中和熱）", bx + 82, by + 14);

    // 2行目：現在のイオン個数内訳
    ctx.fillStyle = "#94a3b8";
    ctx.font = "9px sans-serif";
    ctx.fillText("水溶液中のイオン内訳:", bx + 8, by + 30);

    ctx.font = "bold 9px sans-serif";
    ctx.fillStyle = "#ef4444"; ctx.fillText(`H⁺: ${st.hCount}個`, bx + 115, by + 30);
    ctx.fillStyle = "#22c55e"; ctx.fillText(`Cl⁻: ${st.clCount}個`, bx + 165, by + 30);
    ctx.fillStyle = "#eab308"; ctx.fillText(`Na⁺: ${st.naCount}個`, bx + 215, by + 30);
    ctx.fillStyle = "#38bdf8"; ctx.fillText(`OH⁻: ${st.ohCount}個`, bx + 265, by + 30);
  }

  // ========================================================
  // B. 右上パネル：実写写真枠
  // ========================================================
  function drawCrystalPhotoBox(bx, by, bw, bh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📷 実写写真: 中和で生じた塩(NaCl)", bx + 8, by + 16);

    if (crystalImg.complete && crystalImg.naturalWidth !== 0) {
      ctx.drawImage(crystalImg, bx + 8, by + 24, bw - 16, bh - 32);
    } else {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(bx + 8, by + 24, bw - 16, bh - 32);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("crystal_nacl_neutral.jpg", bx + bw / 2, by + bh / 2);
      ctx.fillText("実写画像待機中", bx + bw / 2, by + bh / 2 + 15);
    }

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(bx + 8, by + bh - 20, bw - 16, 16);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("塩化ナトリウムの立方体結晶", bx + bw / 2, by + bh - 8);
  }

  // ========================================================
  // C. 右下パネル：イオン数変化グラフ
  // ========================================================
  function drawIonGraphPanel(gx, gy, gw, gh) {
    ctx.fillStyle = "#020617";
    ctx.fillRect(gx, gy, gw, gh);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(gx, gy, gw, gh);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("📈 加えたNaOH量とイオン数変化", gx + 8, gy + 16);

    const plotX = gx + 35, plotY = gy + 32;
    const plotW = gw - 48, plotH = gh - 55;

    // グリッド線
    ctx.strokeStyle = "rgba(51, 65, 85, 0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(plotX, plotY + plotH); ctx.lineTo(plotX + plotW, plotY + plotH);
    ctx.moveTo(plotX, plotY); ctx.lineTo(plotX + plotW, plotY);
    ctx.stroke();

    // 中和点 (10mL) の点線ライン
    const midX = plotX + plotW * 0.5;
    ctx.setLineDash([2, 2]);
    ctx.strokeStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(midX, plotY); ctx.lineTo(midX, plotY + plotH);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("中和点", midX, plotY + plotH + 12);
    ctx.fillText("20mL", plotX + plotW, plotY + plotH + 12);
    ctx.fillText("0", plotX, plotY + plotH + 12);

    // 1. Cl-（緑・ずっと一定・横ばい）
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(plotX, plotY + plotH * 0.5);
    ctx.lineTo(plotX + plotW, plotY + plotH * 0.5);
    ctx.stroke();
    ctx.fillStyle = "#22c55e";
    ctx.font = "bold 9px sans-serif";
    ctx.fillText("Cl⁻(不変)", plotX + plotW - 18, plotY + plotH * 0.5 - 4);

    // 2. H+（赤・最初いて中和点で0になる）
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(plotX, plotY + plotH * 0.5);
    ctx.lineTo(midX, plotY + plotH);
    ctx.lineTo(plotX + plotW, plotY + plotH);
    ctx.stroke();
    ctx.fillStyle = "#ef4444";
    ctx.fillText("H⁺(減少)", plotX + 18, plotY + plotH * 0.45);

    // 3. Na+（黄・右肩上がりで増え続ける）
    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(plotX, plotY + plotH);
    ctx.lineTo(plotX + plotW, plotY);
    ctx.stroke();
    ctx.fillStyle = "#eab308";
    ctx.fillText("Na⁺(増加)", plotX + plotW - 18, plotY + 12);

    // 4. OH-（青・中和点まで0、そこから増える）
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(plotX, plotY + plotH);
    ctx.lineTo(midX, plotY + plotH);
    ctx.lineTo(plotX + plotW, plotY + plotH * 0.5);
    ctx.stroke();
    ctx.fillStyle = "#38bdf8";
    ctx.fillText("OH⁻", plotX + plotW - 12, plotY + plotH * 0.65);

    // 現在の滴下位置マーカーバー
    const curX = plotX + (naohAdded / 20.0) * plotW;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(curX, plotY);
    ctx.lineTo(curX, plotY + plotH);
    ctx.stroke();
  }

  return {
    destroy: () => {
      cancelAnimationFrame(animId);
      const modal = document.getElementById('naclEvapModal');
      if (modal) modal.remove();
    }
  };
}











































// ===================================================================
// 【完全版】ダニエル電池とイオンの移動 (中3・物質)
// ===================================================================
function initC3Daniel(canvas) {
  const ctx = canvas.getContext('2d');

  // --- 実験状態 ---
  let isConnected = true;       // 回路接続中（放電中）
  let hasSeparator = true;      // 素焼き板（セロハン仕切り）の有無
  let dischargeProgress = 0.0;  // 反応進行度 (0.0 〜 100.0%)
  let animId;
  let propellerAngle = 0.0;
  let electronTick = 0;

  // 実写写真（放電後の亜鉛板・銅板の電極比較）
  const electrodeImg = new Image();
  electrodeImg.src = 'crystal_daniell_electrodes.jpg';

  // 水槽の幾何学定数
  function getVesselBounds(bw) {
    const vesselW = 230;
    const vesselH = 130;
    const vesselX = (bw / 2) - (vesselW / 2) - 15;
    const vesselY = 175;
    const cx = vesselX + vesselW / 2;
    return { vesselX, vesselY, vesselW, vesselH, cx };
  }

  // 水溶液中を浮遊するイオン粒子
  const ions = [];

  function initIons() {
    ions.length = 0;
    const { vesselX, vesselY, vesselW, vesselH, cx } = getVesselBounds(canvas.width - 240);
    // 左（硫酸亜鉛）：Zn2+ と SO4 2-
    for (let i = 0; i < 6; i++) {
      ions.push({
        type: "Zn2",
        x: vesselX + 15 + Math.random() * (cx - vesselX - 30),
        y: vesselY + 35 + Math.random() * (vesselH - 50),
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
      ions.push({
        type: "SO4_L",
        x: vesselX + 15 + Math.random() * (cx - vesselX - 30),
        y: vesselY + 35 + Math.random() * (vesselH - 50),
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4
      });
    }
    // 右（硫酸銅）：Cu2+ と SO4 2-
    for (let i = 0; i < 6; i++) {
      ions.push({
        type: "Cu2",
        x: cx + 15 + Math.random() * (vesselX + vesselW - cx - 30),
        y: vesselY + 35 + Math.random() * (vesselH - 50),
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
      ions.push({
        type: "SO4_R",
        x: cx + 15 + Math.random() * (vesselX + vesselW - cx - 30),
        y: vesselY + 35 + Math.random() * (vesselH - 50),
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4
      });
    }
  }
  initIons();

  const controls = document.getElementById('labControlsArea');

  function renderControls() {
    const isFinished = dischargeProgress >= 100.0;

    controls.innerHTML = `
      <div class="ctrl-group">
        <label>1. 回路スイッチ:</label>
        <button class="btn-action ${isConnected?'':'secondary'}" id="bConnect" style="${isConnected?'background:#0d9488; border-color:#0d9488;':''}">
          ${isConnected ? '放電中 (回路ON) ⚡' : '回路を切断中 (OFF)'}
        </button>
      </div>

      <div class="ctrl-group">
        <label>2. 素焼き板の操作 【最重要】:</label>
        <button class="btn-action ${hasSeparator?'secondary':''}" id="bSep" style="${!hasSeparator?'background:#ef4444; border-color:#ef4444;':''}">
          ${hasSeparator ? '素焼き板あり (正常動作)' : '⚠️ 素焼き板なし (直接ショート)'}
        </button>
      </div>

      <div class="ctrl-group">
        <label>3. 反応の進行: <span id="progVal" class="ctrl-val">${dischargeProgress.toFixed(0)}%</span></label>
        <input type="range" id="progRange" min="0" max="100" value="${Math.round(dischargeProgress)}">
      </div>

      <div class="ctrl-group" style="grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn-action secondary" id="bSpeedUp" style="flex:1.5; color:#38bdf8; border-color:#38bdf8; font-size:12px; padding:6px;">
          ⏩ 時間を急速に進める (+25%)
        </button>
        ${isFinished ? `
        <button class="btn-action" id="bShowResultSpecial" style="flex:2; background:#ea580c; border-color:#ea580c; color:white; font-size:13px; font-weight:bold; padding:6px; box-shadow:0 0 12px rgba(234,88,12,0.6);">
          🎉 使い切りました！実験結果を見る 🔍
        </button>
        ` : ''}
        <button class="btn-action secondary" id="bResetDaniel" style="flex:1; font-size:12px; padding:6px;">
          最初に戻す 🔄
        </button>
      </div>
    `;

    document.getElementById('bConnect').onclick = () => {
      isConnected = !isConnected;
      renderControls();
      updateStatus();
    };

    document.getElementById('bSep').onclick = () => {
      hasSeparator = !hasSeparator;
      renderControls();
      updateStatus();
    };

    document.getElementById('progRange').oninput = (e) => {
      dischargeProgress = parseFloat(e.target.value);
      document.getElementById('progVal').textContent = `${dischargeProgress.toFixed(0)}%`;
      renderControls();
      updateStatus();
    };

    document.getElementById('bSpeedUp').onclick = () => {
      dischargeProgress = Math.min(100.0, dischargeProgress + 25.0);
      document.getElementById('progRange').value = Math.round(dischargeProgress);
      document.getElementById('progVal').textContent = `${dischargeProgress.toFixed(0)}%`;
      renderControls();
      updateStatus();
    };

    const bRes = document.getElementById('bShowResultSpecial');
    if (bRes) bRes.onclick = showDischargeResultModal;

    document.getElementById('bResetDaniel').onclick = resetLab;
  }

  function resetLab() {
    isConnected = true;
    hasSeparator = true;
    dischargeProgress = 0.0;
    initIons();
    const modal = document.getElementById('daniellResultModal');
    if (modal) modal.remove();
    renderControls();
    updateStatus();
  }

  function updateStatus() {
    if (!hasSeparator) {
      setStatus("【大事故！素焼き板なしでショート】水溶液が混ざったため、Cu²⁺が直接亜鉛板に触れて電子を奪い、亜鉛板の表面に直接黒い銅が析出しました！導線に電子が流れずプロペラは停止します。（素焼き板の役割：液の混合を防ぎつつイオンだけを通す）", true);
      return;
    }

    if (!isConnected) {
      setStatus("【回路切断中 (OFF)】電子の流れが遮断されているため、化学反応はストップしています。スイッチを入れると起電力約1.1Vが発生します。");
      return;
    }

    if (dischargeProgress >= 100.0) {
      setStatus("【電池を最後まで使い切りました！】硫酸銅水溶液のCu²⁺が消費し尽くされ、亜鉛板も溶け細って寿命を迎えました。下のオレンジのボタンを押して『実験結果（金属写真と解説）』を確認しましょう！");
      return;
    }

    const znLoss = (dischargeProgress * 0.05).toFixed(1);
    const cuGain = (dischargeProgress * 0.05).toFixed(1);
    setStatus(`【放電中（起電力 約1.10V）】負極(Zn)でZnが電子を放出して溶解(質量-${znLoss}g)。電子が導線を通ってモーターを回し、正極(Cu)でCu²⁺が電子を受け取って銅が析出(質量+${cuGain}g)！硫酸銅の青色は徐々に薄くなります。`);
  }

  // 結果ポップアップモーダル（数式タグ表記修正版）
